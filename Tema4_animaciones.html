<div class="bar" id="bar-cbb"><div id="cbb-bar" class="inner"></div></div><div hidden><input type="range" id="app-speed" value="1"><input type="range" id="app-cap" value="18"><button id="app-themeBtn"></button><button id="mat-themeBtn"></button></div>

<script>(function(){

const CSS=k=>getComputedStyle(document.documentElement).getPropertyValue(k).trim();
const cv=document.getElementById('app-cv'), ctx=cv.getContext('2d');
const B=6.6;                       // radio del hábitat en unidades de mundo
let W=0,H=0,S=20,R=150,K=1,GAP=100,portrait=false;
let C1=[0,0],C2=[0,0],AX=[1,0];

function resize(){
  const r=cv.getBoundingClientRect(); if(!r.width) return;
  const d=window.devicePixelRatio||1;
  cv.width=r.width*d; cv.height=r.height*d; W=r.width; H=r.height;
  ctx.setTransform(d,0,0,d,0,0);
  portrait = H > W;
  if(!portrait){
    GAP=Math.max(84,Math.min(220,W*0.15));
    R=Math.max(40,Math.min(H*0.45,(W-24-GAP)/4));
    C1=[W/2-GAP/2-R,H/2]; C2=[W/2+GAP/2+R,H/2]; AX=[1,0];
  }else{
    GAP=Math.max(84,Math.min(200,H*0.14));
    R=Math.max(40,Math.min(W*0.46,(H-24-GAP)/4));
    C1=[W/2,H/2-GAP/2-R]; C2=[W/2,H/2+GAP/2+R]; AX=[0,1];
  }
  S=R/B; K=Math.max(.55,Math.min(1.25,S/40));
}
new ResizeObserver(resize).observe(cv);

/* ---------------- álgebra básica ---------------- */
const add=(a,b)=>[a[0]+b[0],a[1]+b[1]];
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1]];
const mul=(k,a)=>[k*a[0],k*a[1]];
const len=a=>Math.hypot(a[0],a[1]);
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
const lerp=(a,b,t)=>a+(b-a)*t;
function clampLen(v,maxL){ const n=len(v); return n>maxL ? mul(maxL/n,v) : v; }
function avgHue(h1,h2){
  const a1=h1*Math.PI/180, a2=h2*Math.PI/180;
  const x=Math.cos(a1)+Math.cos(a2), y=Math.sin(a1)+Math.sin(a2);
  let a=Math.atan2(y,x)*180/Math.PI; if(a<0)a+=360; return a;
}
function rand(a,b){ return a+Math.random()*(b-a); }
function hexRgb(h){ h=h.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
function hexA(h,a){ const c=hexRgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function mixHex(h1,h2,t){ const a=hexRgb(h1),b=hexRgb(h2); return `rgb(${Math.round(lerp(a[0],b[0],t))},${Math.round(lerp(a[1],b[1],t))},${Math.round(lerp(a[2],b[2],t))})`; }

/* ---------------- la aplicación lineal F (matriz 2×2) ---------------- */
function specNorm(m){
  const a=m[0][0]**2+m[1][0]**2, b=m[0][1]**2+m[1][1]**2, c=m[0][0]*m[0][1]+m[1][0]*m[1][1];
  return Math.sqrt((a+b)/2+Math.sqrt(((a-b)/2)**2+c*c));
}
const cA=Math.cos(1.13), sA=Math.sin(1.13);
const maps=[
  [[0.95,-0.55],[0.40,0.60]],   // giro con deformación
  [[1,0.8],[0,1]],              // cizalla
  [[cA,-sA],[sA,cA]],           // giro
  [[-1,0],[0,0.4]],             // reflexión y aplastamiento
  [[0.8,0.4],[0.4,0.2]]         // proyección sobre una recta
].map(m=>{ const n=Math.max(1,specNorm(m)); return m.map(r=>r.map(x=>x/n)); });
let mapIdx=0, M=maps[0].map(r=>r.slice()), T=maps[0];
const app=(m,p)=>[m[0][0]*p[0]+m[0][1]*p[1], m[1][0]*p[0]+m[1][1]*p[1]];

/* mundo origen (V) y mundo destino (W): p ∈ V se dibuja en P1(p); su imagen F(p) en P2(p) */
const P1=p=>[C1[0]+p[0]*S, C1[1]-p[1]*S];
const P2=p=>{ const q=app(M,p); return [C2[0]+q[0]*S, C2[1]-q[1]*S]; };
const Wc1=(px,py)=>[(px-C1[0])/S,(C1[1]-py)/S];

/* ---------------- estado del ecosistema ---------------- */
/* ind.pos = origen (punto de aplicación) de la flecha; ind.u = la flecha.
   Su gemela en el segundo mundo es la flecha F(u) aplicada en F(pos): mismo color. */
let pop=[], effects=[], couriers=[], nextId=1;
let paused=false, speedMult=1, capMax=18, hoverId=null, hoverT=0, trickleT=1;
const MERGE_DIST=0.62;

function makeIndividual({pos,vel,u,hue,gen}){
  const life=rand(18,30);
  return {
    id:nextId++, pos, vel, u, hue, gen, age:0, life,
    cooldown:0, birthT:0, dying:false, deathT:0, heldByUser:false,
    mutateAt: rand(4, Math.max(5,life-2)), mutated:false, mutateT:null, mutateFrom:null, mutateTo:null,
    ghostU:null, ghostT:0
  };
}
function spawnRandom(n){
  for(let i=0;i<n;i++){
    const ang=rand(0,6.28), r=rand(0.8,2.2);
    const ind=makeIndividual({
      pos:[rand(-B*0.6,B*0.6),rand(-B*0.6,B*0.6)],
      vel:[rand(-0.35,0.35),rand(-0.35,0.35)],
      u:[r*Math.cos(ang), r*Math.sin(ang)],
      hue:rand(0,360), gen:0
    });
    ind.birthT=1;
    pop.push(ind);
  }
}
spawnRandom(12);

function killIndividual(ind, fast){ if(ind.dying) return; ind.dying=true; ind.deathT= fast?0.4:0; }

/* un mensajero viaja por la flecha grande: sale como u y llega como F(u) */
function sendCourier(u,hue,delay){
  if(couriers.length>14) couriers.shift();
  couriers.push({u:[u[0],u[1]],hue,t:-(delay||0),dur:1.4});
}

function scaleIndividual(ind,lam){
  if(ind.mutateT!=null) return;
  let target=clampLen(mul(lam, ind.u), 4.3);
  if(len(target) < 0.4){ const n=len(target)||1; target=mul(0.4/n, target); }
  ind.mutated=true;
  ind.ghostU=[ind.u[0],ind.u[1]]; ind.ghostT=1.8;
  ind.mutateFrom=[ind.u[0],ind.u[1]]; ind.mutateTo=target; ind.mutateT=0;
  effects.push({pos:[ind.pos[0],ind.pos[1]], t:0, kind:'mutate'});
  sendCourier(target, ind.hue, 0);
}

function tryReproduce(){
  const alive=pop.filter(p=>!p.dying && p.cooldown<=0);
  for(let i=0;i<alive.length;i++){
    const a=alive[i]; if(a.cooldown>0||a.dying) continue;
    for(let j=i+1;j<alive.length;j++){
      const b=alive[j]; if(b.cooldown>0||b.dying) continue;
      if(dist(a.pos,b.pos) < MERGE_DIST){
        const base=mul(0.5,add(a.pos,b.pos));
        const childU=clampLen(add(a.u,b.u), 4.3);
        const gen=Math.max(a.gen,b.gen)+1;
        const hue=(avgHue(a.hue,b.hue)+rand(-12,12)+360)%360;
        const child=makeIndividual({ pos:base, vel:mul(0.5,add(a.vel,b.vel)), u:childU, hue, gen });
        pop.push(child);
        effects.push({pos:base, t:0, kind:'fusion', ua:[a.u[0],a.u[1]], ub:[b.u[0],b.u[1]], hue});
        // F(a), F(b) y después F(a+b) cruzan la flecha grande
        sendCourier(a.u,a.hue,0); sendCourier(b.u,b.hue,0.22); sendCourier(childU,hue,0.75);
        const diff=sub(b.pos,a.pos);
        const dir= len(diff)>1e-6 ? mul(1/len(diff), diff) : [1,0];
        a.vel=sub(a.vel, mul(0.5,dir)); b.vel=add(b.vel, mul(0.5,dir));
        a.cooldown=2.6; b.cooldown=2.6;
        const aliveCount=pop.filter(p=>!p.dying).length;
        if(aliveCount>capMax){
          let oldest=null;
          pop.forEach(p=>{ if(!p.dying && p!==a && p!==b && p!==child && !p.heldByUser){ if(!oldest||p.age>oldest.age) oldest=p; } });
          if(oldest) killIndividual(oldest,true);
        }
        return;
      }
    }
  }
}

function update(dt){
  pop.forEach(ind=>{
    if(ind.cooldown>0) ind.cooldown=Math.max(0,ind.cooldown-dt);
    if(ind.ghostT>0) ind.ghostT-=dt;
    if(ind.birthT<1) ind.birthT=Math.min(1, ind.birthT + dt*2.6);
    if(ind.dying){ ind.deathT=Math.min(1, ind.deathT + dt*2.0); return; }
    ind.age += dt;
    if(ind.age > ind.life){ killIndividual(ind,false); return; }

    if(!ind.mutated && !ind.heldByUser && ind.mutateT==null && ind.age>=ind.mutateAt){
      let lam = Math.random()<0.5 ? rand(0.55,0.8) : rand(1.25,1.75);
      if(Math.random()<0.18) lam=-lam;
      scaleIndividual(ind,lam);
    }
    if(ind.mutateT!=null){
      ind.mutateT += dt/0.9;
      const tt=Math.min(1, ind.mutateT);
      const e=tt*tt*(3-2*tt);
      ind.u=[ lerp(ind.mutateFrom[0], ind.mutateTo[0], e), lerp(ind.mutateFrom[1], ind.mutateTo[1], e) ];
      if(tt>=1){ ind.mutateT=null; ind.u=ind.mutateTo; }
    }
    if(ind.heldByUser) return;

    ind.vel[0]+= rand(-1,1)*0.12*dt; ind.vel[1]+= rand(-1,1)*0.12*dt;
    const sp=len(ind.vel), maxSp=0.55*speedMult;
    if(sp>maxSp) ind.vel=mul(maxSp/sp, ind.vel);
    ind.pos[0]+= ind.vel[0]*dt*speedMult*3; ind.pos[1]+= ind.vel[1]*dt*speedMult*3;

    for(let pass=0; pass<2; pass++){
      const point = pass===0 ? ind.pos : add(ind.pos, ind.u);
      const r=len(point);
      if(r>B){
        const n=mul(1/r, point), over=r-B;
        ind.pos=sub(ind.pos, mul(over,n));
        const vn=ind.vel[0]*n[0]+ind.vel[1]*n[1];
        if(vn>0){ ind.vel[0]-=2*vn*n[0]; ind.vel[1]-=2*vn*n[1]; }
      }
    }
  });
  pop = pop.filter(ind=> !(ind.dying && ind.deathT>=1));
  effects.forEach(e=>e.t+=dt);
  effects=effects.filter(e=>e.t<(e.kind==='fusion'?1.8:0.6));
  couriers.forEach(c=>c.t+=dt);
  couriers=couriers.filter(c=>c.t<c.dur);
  if(hoverT>0 && hoverT<1e8){ hoverT-=dt; if(hoverT<=0) hoverId=null; }
  trickleT-=dt;
  if(trickleT<=0){
    trickleT=rand(1.3,2.2);
    const al=pop.filter(p=>!p.dying && p.birthT>=1);
    if(al.length && couriers.length<5){ const p=al[Math.floor(Math.random()*al.length)]; sendCourier(p.u,p.hue,0); }
  }
  if(!paused) tryReproduce();
}

/* ---------------- dibujo ---------------- */
let bgResolved='#f2efe9';
function refreshBg(){ bgResolved=CSS('--bg'); }

function drawArrow(p1,p2,color,alpha,lw,halo){
  const [x1,y1]=p1, [x2,y2]=p2;
  const Lp=Math.hypot(x2-x1,y2-y1); if(Lp<1.5) return;
  const hl=Math.min(Lp*0.4, lw*2.4+6), hw=lw*1.6+4;
  const ang=Math.atan2(y2-y1,x2-x1);
  const bx=x2-hl*Math.cos(ang), by=y2-hl*Math.sin(ang);
  const nx=-Math.sin(ang), ny=Math.cos(ang);
  ctx.save(); ctx.globalAlpha=alpha; ctx.lineCap='round'; ctx.lineJoin='round';
  if(halo){
    ctx.strokeStyle=halo; ctx.lineWidth=lw+4;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(bx,by); ctx.stroke();
    ctx.fillStyle=halo; ctx.lineWidth=4; ctx.strokeStyle=halo;
    ctx.beginPath(); ctx.moveTo(x2,y2); ctx.lineTo(bx+nx*hw/2,by+ny*hw/2); ctx.lineTo(bx-nx*hw/2,by-ny*hw/2); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  ctx.strokeStyle=color; ctx.lineWidth=lw;
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(bx,by); ctx.stroke();
  ctx.fillStyle=color;
  ctx.beginPath(); ctx.moveTo(x2,y2);
  ctx.lineTo(bx+nx*hw/2, by+ny*hw/2); ctx.lineTo(bx-nx*hw/2, by-ny*hw/2);
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function dashSeg(a,b,color,alpha,lw){
  ctx.save(); ctx.globalAlpha=alpha; ctx.strokeStyle=color; ctx.lineWidth=lw||1.8; ctx.setLineDash([5,5]);
  ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke(); ctx.restore();
}
function ring(pt,r,color,alpha,lw){
  ctx.save(); ctx.globalAlpha=alpha; ctx.strokeStyle=color; ctx.lineWidth=lw;
  ctx.beginPath(); ctx.arc(pt[0],pt[1],r,0,7); ctx.stroke(); ctx.restore();
}

function drawHabitats(){
  const gold=CSS('--gold'), teal=CSS('--teal'), mut=CSS('--muted'), hab=CSS('--habitat');
  // mundo de partida: disco
  ctx.save(); ctx.fillStyle=hexA(gold,0.06);
  ctx.beginPath(); ctx.arc(C1[0],C1[1],R,0,7); ctx.fill();
  ctx.strokeStyle=hab; ctx.globalAlpha=.6; ctx.lineWidth=1.4; ctx.setLineDash([2,6]);
  ctx.beginPath(); ctx.arc(C1[0],C1[1],R,0,7); ctx.stroke(); ctx.restore();
  // mundo de llegada: imagen del disco
  ctx.save(); ctx.beginPath();
  for(let i=0;i<=72;i++){
    const th=i/72*Math.PI*2, p=P2([B*Math.cos(th),B*Math.sin(th)]);
    i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);
  }
  ctx.closePath(); ctx.fillStyle=hexA(teal,0.06); ctx.fill();
  ctx.strokeStyle=hab; ctx.globalAlpha=.6; ctx.lineWidth=1.4; ctx.setLineDash([2,6]); ctx.stroke(); ctx.restore();
  // retícula: sus imágenes muestran cómo se deforma el mundo, conservando rectas y paralelogramos
  [P1,P2].forEach(Pf=>{
    ctx.save(); ctx.strokeStyle=mut; ctx.lineWidth=1;
    for(let i=-6;i<=6;i++){
      const h=Math.sqrt(B*B-i*i);
      ctx.globalAlpha= i===0?0.30:0.11;
      let a=Pf([i,-h]), b=Pf([i,h]);
      ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
      a=Pf([-h,i]); b=Pf([h,i]);
      ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
    }
    ctx.restore();
  });
}

function drawBridge(t){
  const gold=CSS('--gold'), teal=CSS('--teal');
  // hilo entre los dos orígenes
  ctx.save(); const g=ctx.createLinearGradient(C1[0],C1[1],C2[0],C2[1]);
  g.addColorStop(0,hexA(gold,.5)); g.addColorStop(1,hexA(teal,.5));
  ctx.strokeStyle=g; ctx.lineWidth=1.4; ctx.setLineDash([3,6]);
  ctx.beginPath(); ctx.moveTo(C1[0],C1[1]); ctx.lineTo(C2[0],C2[1]); ctx.stroke(); ctx.restore();

  // flecha grande
  const a0=[C1[0]+AX[0]*(R+8), C1[1]+AX[1]*(R+8)];
  const L=GAP-16, th=Math.max(14,Math.min(34,R*0.16));
  const hl=Math.min(L*0.42, th*1.5);
  ctx.save(); ctx.translate(a0[0],a0[1]); ctx.rotate(Math.atan2(AX[1],AX[0]));
  const grad=ctx.createLinearGradient(0,0,L,0);
  grad.addColorStop(0,hexA(gold,.92)); grad.addColorStop(1,hexA(teal,.92));
  const path=()=>{
    ctx.beginPath(); ctx.moveTo(0,-th/2); ctx.lineTo(L-hl,-th/2); ctx.lineTo(L-hl,-th*0.95); ctx.lineTo(L,0);
    ctx.lineTo(L-hl,th*0.95); ctx.lineTo(L-hl,th/2); ctx.lineTo(0,th/2); ctx.closePath();
  };
  ctx.shadowColor='rgba(0,0,0,.18)'; ctx.shadowBlur=14; ctx.shadowOffsetY=3;
  path(); ctx.fillStyle=grad; ctx.fill();
  ctx.shadowColor='transparent'; path(); ctx.clip();
  const sp=th*1.1, off=(t*38)%sp;
  ctx.strokeStyle='rgba(255,255,255,.42)'; ctx.lineWidth=2.2; ctx.lineJoin='round';
  for(let x=-sp+off;x<L+sp;x+=sp){
    ctx.beginPath(); ctx.moveTo(x-th*.22,-th*.34); ctx.lineTo(x+th*.12,0); ctx.lineTo(x-th*.22,th*.34); ctx.stroke();
  }
  ctx.restore();
}

function drawCouriers(){
  const a0=[C1[0]+AX[0]*(R+10), C1[1]+AX[1]*(R+10)], a1=[C2[0]-AX[0]*(R+10), C2[1]-AX[1]*(R+10)];
  const cf=Math.min(0.65*S,(GAP-20)*0.8/4.3);
  couriers.forEach(c=>{
    if(c.t<0) return;
    const s=Math.min(1,c.t/c.dur), e=s*s*(3-2*s);
    const pt=[lerp(a0[0],a1[0],e),lerp(a0[1],a1[1],e)];
    const Mu=app(M,c.u), v=[lerp(c.u[0],Mu[0],e),lerp(c.u[1],Mu[1],e)];   // u se va convirtiendo en F(u)
    const vx=v[0]*cf, vy=-v[1]*cf;
    const al=Math.min(1,s*8)*Math.min(1,(1-s)*8);
    drawArrow([pt[0]-vx/2,pt[1]-vy/2],[pt[0]+vx/2,pt[1]+vy/2],`hsl(${c.hue},72%,52%)`,al,(3.2+Math.min(2,len(v)))*Math.max(.8,K),bgResolved);
  });
}

function drawOrigin(pt,color,t,ph){
  const br=1+0.12*Math.sin(t*2.4+ph), rad=30*K*br;
  const g=ctx.createRadialGradient(pt[0],pt[1],0,pt[0],pt[1],rad);
  g.addColorStop(0,hexA(color,.6)); g.addColorStop(.35,hexA(color,.22)); g.addColorStop(1,hexA(color,0));
  ctx.save(); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(pt[0],pt[1],rad,0,7); ctx.fill();
  ring(pt,9*K*br,color,.55,1.6);
  ctx.fillStyle=color; ctx.beginPath(); ctx.arc(pt[0],pt[1],5.5*K+1,0,7); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.9)'; ctx.beginPath(); ctx.arc(pt[0],pt[1],2.2*K+.4,0,7); ctx.fill();
  ctx.restore();
}

function drawSpark(t){
  const gold=CSS('--gold'), teal=CSS('--teal');
  const per=5.2, q=(t%per)/1.9;
  if(q<0.3) ring(C1,q/0.3*34*K,gold,(1-q/0.3)*.6,2);
  if(q<1){
    const e=q*q*(3-2*q), p=[lerp(C1[0],C2[0],e),lerp(C1[1],C2[1],e)];
    const col=mixHex(gold,teal,e);
    const g=ctx.createRadialGradient(p[0],p[1],0,p[0],p[1],14*K);
    g.addColorStop(0,col); g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.save(); ctx.globalAlpha=.9; ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p[0],p[1],14*K,0,7); ctx.fill(); ctx.restore();
  }else if(q<1.35){
    const k=(q-1)/0.35; ring(C2,k*36*K,teal,(1-k)*.7,2.2);
  }
}

function render(t){
  ctx.fillStyle=bgResolved; ctx.fillRect(0,0,W,H);
  if(!W) return;
  const mutedC=CSS('--muted'), fg=CSS('--fg'), gold=CSS('--gold'), teal=CSS('--teal');

  drawHabitats();
  drawBridge(t);

  // efectos: ley del paralelogramo y dilatación, a la vez en los dos mundos
  effects.forEach(e=>{
    [P1,P2].forEach(Pf=>{
      if(e.kind==='fusion'){
        const fa=Math.max(0,Math.min(1,(1-e.t/1.8)*1.4));
        const o=e.pos, a=add(o,e.ua), b=add(o,e.ub), tip=add(a,e.ub);
        const po=Pf(o), pa=Pf(a), pb=Pf(b), pt=Pf(tip);
        ctx.save(); ctx.globalAlpha=fa*0.10; ctx.fillStyle=`hsl(${e.hue},68%,55%)`;
        ctx.beginPath(); ctx.moveTo(po[0],po[1]); ctx.lineTo(pa[0],pa[1]); ctx.lineTo(pt[0],pt[1]); ctx.lineTo(pb[0],pb[1]); ctx.closePath(); ctx.fill(); ctx.restore();
        dashSeg(po,pa,mutedC,fa*0.85,2); dashSeg(po,pb,mutedC,fa*0.85,2);
        dashSeg(pa,pt,mutedC,fa*0.6,1.8); dashSeg(pb,pt,mutedC,fa*0.6,1.8);
        dashSeg(po,pt,mutedC,fa*0.35,1.4);
      }
      if(e.t<0.6){
        const r=(e.t/0.6)*46*K, a=1-(e.t/0.6);
        ring(Pf(e.pos),r,e.kind==='mutate'?gold:fg,a*(e.kind==='mutate'?0.75:0.55),e.kind==='mutate'?3:2);
      }
    });
  });

  // flechas y sus gemelas
  let hov=null;
  pop.forEach(ind=>{
    const breathe=1+Math.sin(t*2 + ind.id)*0.05;
    const scale=ind.birthT*breathe;
    const isHov=(hoverId===ind.id); if(isHov) hov=ind;
    const light = ind.dying ? 45 : ((ind.heldByUser||isHov) ? 62 : 55);
    const color=`hsl(${ind.hue}, 68%, ${light}%)`;
    const alpha=(ind.dying? (1-ind.deathT) : 1) * (0.55+ind.birthT*0.45);
    const head=add(ind.pos, mul(scale, ind.u));
    [P1,P2].forEach(Pf=>{
      const a=Pf(ind.pos), b=Pf(head);
      const L=Math.hypot(b[0]-a[0],b[1]-a[1]);
      const mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2;
      ctx.save(); ctx.globalAlpha=alpha*((ind.heldByUser||isHov)?0.26:0.14); ctx.fillStyle=color;
      ctx.beginPath(); ctx.arc(mx,my,L/2+10*K,0,7); ctx.fill(); ctx.restore();
      if(isHov) ring([mx,my],L/2+10*K,color,alpha*.7,1.6);
      if(ind.ghostT>0 && ind.ghostU){
        dashSeg(a,Pf(add(ind.ghostPos||ind.pos,ind.ghostU)),color,Math.min(1,ind.ghostT)*0.7*alpha,2);
      }
      ctx.save(); ctx.globalAlpha=alpha*0.5; ctx.fillStyle=color;
      ctx.beginPath(); ctx.arc(a[0],a[1],(ind.heldByUser?5.5:3)*K+.5,0,7); ctx.fill(); ctx.restore();
      drawArrow(a,b,color,alpha,((ind.heldByUser||isHov)?7:5.5)*K+Math.min(3,L/S)*K);
    });
  });
  if(hov){
    const head=add(hov.pos, mul(hov.birthT, hov.u));
    const m1=P1(add(hov.pos,mul(.5,sub(head,hov.pos)))), m2=P2(add(hov.pos,mul(.5,sub(head,hov.pos))));
    dashSeg(m1,m2,`hsl(${hov.hue},68%,55%)`,.55,1.8);
  }

  if(newDrag && newDrag.head) drawArrow(P1(newDrag.tail),P1(newDrag.head),fg,0.5,4*K+1);

  drawCouriers();
  drawSpark(t);
  drawOrigin(C1,gold,t,0);
  drawOrigin(C2,teal,t,1.7);
}

/* ---------------- interacción (solo en el primer mundo) ---------------- */
let newDrag=null, moveDrag=null;
const ptr=e=>{const r=cv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top];};
function segDist(p,a,b){ const ab=sub(b,a), ap=sub(p,a);
  const t=Math.max(0,Math.min(1,(ap[0]*ab[0]+ap[1]*ab[1])/((ab[0]**2+ab[1]**2)||1)));
  return dist(p, add(a,mul(t,ab))); }
function hitTest(px,py){
  const thr=Math.max(10,0.32*S), p=[px,py];
  for(let i=pop.length-1;i>=0;i--){
    const ind=pop[i]; if(ind.dying) continue;
    const head=add(ind.pos,ind.u);
    if(dist(p,C1)<R+12 && segDist(p,P1(ind.pos),P1(head))<thr) return {ind,world:1};
    if(segDist(p,P2(ind.pos),P2(head))<thr && dist(p,C2)<R+12) return {ind,world:2};
  }
  return null;
}

cv.addEventListener('pointerdown',e=>{
  const [px,py]=ptr(e); cv.setPointerCapture(e.pointerId);
  const h=hitTest(px,py), wp=Wc1(px,py);
  if(h && h.world===1){
    moveDrag={ind:h.ind, startP:wp, moved:false, lastT:performance.now(), offset:sub(wp,h.ind.pos)};
    hoverId=h.ind.id; hoverT=1e9;
  }else if(h && h.world===2){
    hoverId=h.ind.id; hoverT=2.5;
  }else if(dist([px,py],C1)<R+8){
    newDrag={tail:wp};
  }
});
cv.addEventListener('pointermove',e=>{
  const [px,py]=ptr(e), wp=Wc1(px,py);
  if(moveDrag){
    if(!moveDrag.moved && dist(wp,moveDrag.startP) > 0.15){
      moveDrag.moved=true; moveDrag.ind.heldByUser=true; moveDrag.ind.cooldown=0; moveDrag.lastT=performance.now();
    }
    if(moveDrag.moved){
      const now=performance.now(); const dts=Math.max(0.001,(now-moveDrag.lastT)/1000);
      const newPos=sub(wp, moveDrag.offset);
      let v=[(newPos[0]-moveDrag.ind.pos[0])/dts, (newPos[1]-moveDrag.ind.pos[1])/dts];
      const sp=len(v); if(sp>3.5) v=mul(3.5/sp,v);
      moveDrag.ind.vel=v; moveDrag.ind.pos=newPos; moveDrag.lastT=now;
    }
    return;
  }
  if(newDrag){ newDrag.head=wp; return; }
  const h=hitTest(px,py);
  if(h){ hoverId=h.ind.id; hoverT= e.pointerType==='mouse' ? 1e9 : 2.5; }
  else if(e.pointerType==='mouse'){ hoverId=null; }
});
function endInteraction(){
  if(moveDrag){
    if(!moveDrag.moved){ killIndividual(moveDrag.ind,true); hoverId=null; }
    else { moveDrag.ind.heldByUser=false; }
    moveDrag=null; return;
  }
  if(newDrag && newDrag.head){
    const u=sub(newDrag.head, newDrag.tail);
    if(len(u)>0.2){
      const ind=makeIndividual({pos:newDrag.tail, vel:[rand(-0.2,0.2),rand(-0.2,0.2)], u:clampLen(u,4.3), hue:rand(0,360), gen:0});
      ind.cooldown=0.4; pop.push(ind); sendCourier(ind.u,ind.hue,0);
    }
  }
  newDrag=null;
}
cv.addEventListener('pointerup',endInteraction);
cv.addEventListener('pointercancel',endInteraction);
cv.addEventListener('pointerleave',e=>{ if(e.pointerType==='mouse' && !moveDrag) hoverId=null; });

/* ---------------- controles ---------------- */
document.getElementById('app-speed').oninput=e=>{speedMult=+e.target.value;};
document.getElementById('app-cap').oninput=e=>{capMax=+e.target.value;};
const pauseBtn=document.getElementById('app-pauseBtn');
pauseBtn.onclick=()=>{paused=!paused; pauseBtn.textContent=paused?'▶':'⏸'; pauseBtn.setAttribute('aria-pressed',paused);};

// dos flechas con el mismo origen se encuentran: nace su suma
document.getElementById('app-sumBtn').onclick=()=>{
  const m=[rand(-1.5,1.5),rand(-1.5,1.5)], h=rand(0,360);
  const ang=rand(0,6.28), spread=rand(1.0,2.0)*(Math.random()<.5?1:-1);
  const la=rand(1.3,2.0), lb=rand(1.3,2.0);
  const ua=[la*Math.cos(ang),la*Math.sin(ang)], ub=[lb*Math.cos(ang+spread),lb*Math.sin(ang+spread)];
  const dir=[Math.cos(ang+spread/2+1.5708),Math.sin(ang+spread/2+1.5708)];
  const A=makeIndividual({pos:add(m,mul(1.5,dir)),vel:mul(-0.5,dir),u:ua,hue:h,gen:0});
  const Bb=makeIndividual({pos:add(m,mul(-1.5,dir)),vel:mul(0.5,dir),u:ub,hue:(h+100)%360,gen:0});
  [A,Bb].forEach(x=>{ x.mutateAt=x.life+10; pop.push(x); sendCourier(x.u,x.hue,0); });
};
// una flecha se estira o se encoge: su gemela lo hace en la misma proporción
document.getElementById('app-scaleBtn').onclick=()=>{
  const c=pop.filter(p=>!p.dying && !p.heldByUser && p.mutateT==null && p.birthT>=1);
  if(!c.length) return;
  const ind=c[Math.floor(Math.random()*c.length)];
  const lams=[0.5,0.65,1.5,1.8,-1];
  scaleIndividual(ind,lams[Math.floor(Math.random()*lams.length)]);
  hoverId=ind.id; hoverT=2.2;
};
document.getElementById('app-mapBtn').onclick=()=>{ mapIdx=(mapIdx+1)%maps.length; T=maps[mapIdx]; };
document.getElementById('app-clearBtn').onclick=()=>{pop=[]; effects=[]; couriers=[]; hoverId=null; moveDrag=null; newDrag=null;};
document.getElementById('app-resetBtn').onclick=()=>{pop=[]; effects=[]; couriers=[]; hoverId=null; spawnRandom(12);};
document.getElementById('app-themeBtn').onclick=()=>{
  const el=document.documentElement, dark=matchMedia('(prefers-color-scheme: dark)').matches;
  const now=el.getAttribute('data-theme')||(dark?'dark':'light');
  el.setAttribute('data-theme', now==='dark'?'light':'dark');
  refreshBg();
};

/* ---------------- bucle ---------------- */
let last=performance.now();
function loop(now){ if(!cv.offsetParent){ last=now; requestAnimationFrame(loop); return; }
  let dt=(now-last)/1000; last=now; dt=Math.min(dt,0.05);
  // F se desliza suavemente hacia la nueva aplicación lineal: en cada instante sigue siendo lineal
  const k=Math.min(1,dt*3.2);
  for(let i=0;i<2;i++)for(let j=0;j<2;j++) M[i][j]+= (T[i][j]-M[i][j])*k;
  if(!paused) update(dt);
  render(now/1000);
  requestAnimationFrame(loop);
}
resize(); refreshBg();
requestAnimationFrame(loop);
window.addEventListener('resize',resize);

})();
</script>
<script>(function(){

const CSS=k=>getComputedStyle(document.documentElement).getPropertyValue(k).trim();
const cv=document.getElementById('mat-cv'), ctx=cv.getContext('2d');
const btnReflect=document.getElementById('mat-btnReflect'), btnCoords=document.getElementById('mat-btnCoords');

/* ---------- álgebra ---------- */
const Z2=[0,0];
const add=(a,b)=>a.map((x,i)=>x+b[i]);
const sub=(a,b)=>a.map((x,i)=>x-b[i]);
const mul=(k,a)=>a.map(x=>k*x);
const len=a=>Math.hypot(...a);
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const ease=g=>g*g*(3-2*g);
const cross=(a,b)=>a[0]*b[1]-a[1]*b[0];
const dist2=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
function solve2(u,v,p){ const d=cross(u,v); if(Math.abs(d)<1e-9) return [0,0]; return [cross(p,v)/d, cross(u,p)/d]; }
function hexRgb(h){ h=h.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
function hexA(h,a){ const c=hexRgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function mixHex(h1,h2,t){ const a=hexRgb(h1),b=hexRgb(h2); return `rgb(${Math.round(lerp(a[0],b[0],t))},${Math.round(lerp(a[1],b[1],t))},${Math.round(lerp(a[2],b[2],t))})`; }
const hcol=(h,l)=>`hsl(${h},68%,${l||55}%)`;
let bgResolved='#f2efe9';
function refreshBg(){ bgResolved=CSS('--bg'); }

/* ---------- los datos: la aplicación F y las dos bases ---------- */
const G=[[0.85,-0.55],[0.45,0.6]];                       // F, fija
const appG=p=>[G[0][0]*p[0]+G[0][1]*p[1], G[1][0]*p[0]+G[1][1]*p[1]];
const HE=[22,205], HF=[140,300];                         // colores: base de salida (e), base de llegada (f)
const E0=[[2.3,0.5],[-0.7,1.9]], F0=[[2.0,-0.3],[0.6,2.0]];
let E=E0.map(v=>v.slice()), Fb=F0.map(v=>v.slice());
const Fe=j=>appG(E[j]);                                  // F(e_j)
const colOf=j=>solve2(Fb[0],Fb[1],Fe(j));                // coordenadas de F(e_j) en la base f

/* ---------- disposición ---------- */
let W=0,H=0,S=30,K=1,portrait=false;
let Vr={x:0,y:0,w:0,h:0}, Wr={x:0,y:0,w:0,h:0}, Mr={x:0,y:0,w:0,h:0};
let CV=[0,0], CW=[0,0], AX=[1,0], GAPpx=100, HX=5, HY=4;
let MX={cx:0,cy:0,cs:40};
function layout(){
  const r=cv.getBoundingClientRect(); if(!r.width) return;
  const d=window.devicePixelRatio||1;
  cv.width=r.width*d; cv.height=r.height*d; W=r.width; H=r.height;
  ctx.setTransform(d,0,0,d,0,0);
  portrait = H > W*0.95;
  if(!portrait){
    const mw=clamp(W*0.17,140,210), gap2=16, g=clamp(W*0.11,72,150);
    const rw=(W-24-mw-gap2-g)/2, rh=Math.min(rw*0.84,H-40), y=(H-rh)/2;
    Vr={x:12,y,w:rw,h:rh}; Wr={x:12+rw+g,y,w:rw,h:rh}; Mr={x:Wr.x+rw+gap2,y,w:mw,h:rh};
    AX=[1,0]; GAPpx=g;
  }else{
    const mh=clamp(H*0.22,124,172), gap2=12, g=clamp(H*0.1,60,92);
    const rh0=(H-24-mh-gap2-g)/2, rw=Math.min(W-24,rh0*1.2), rh=Math.min(rh0,rw/1.0);
    const x=(W-rw)/2;
    Vr={x,y:12,w:rw,h:rh}; Wr={x,y:12+rh+g,w:rw,h:rh}; Mr={x:12,y:Wr.y+rh+gap2,w:W-24,h:mh};
    AX=[0,1]; GAPpx=g;
  }
  S=Math.min(Vr.w/10.4,Vr.h/8.4); K=clamp(S/38,.6,1.2);
  CV=[Vr.x+Vr.w/2,Vr.y+Vr.h/2]; CW=[Wr.x+Wr.w/2,Wr.y+Wr.h/2];
  HX=Vr.w/(2*S); HY=Vr.h/(2*S);
  const cs=clamp(Math.min(Mr.w/3.9,Mr.h/3.6),30,64);
  if(!portrait) MX={cx:Mr.x+Mr.w/2,cy:Wr.y+Wr.h*0.60,cs};
  else MX={cx:Mr.x+Mr.w*0.66,cy:Mr.y+Mr.h*0.60,cs};
  // botones
  if(!portrait){
    btnReflect.style.left=((Vr.x+Vr.w+Wr.x)/2)+'px'; btnReflect.style.top=(H/2+Math.max(34,Vr.h*0.14))+'px';
    btnCoords.style.left=(Mr.x+Mr.w/2)+'px'; btnCoords.style.top=(Wr.y+24)+'px';
  }else{
    btnReflect.style.left=(W/2+Math.min(96,W*0.25))+'px'; btnReflect.style.top=((Vr.y+Vr.h+Wr.y)/2)+'px';
    btnCoords.style.left=(Mr.x+100)+'px'; btnCoords.style.top=(Mr.y+18)+'px';
  }
}
new ResizeObserver(layout).observe(cv);
const Pv=p=>[CV[0]+p[0]*S, CV[1]-p[1]*S];
const Pw=q=>[CW[0]+q[0]*S, CW[1]-q[1]*S];
const unV=(x,y)=>[(x-CV[0])/S,(CV[1]-y)/S];
const unW=(x,y)=>[(x-CW[0])/S,(CW[1]-y)/S];

/* ---------- primitivas ---------- */
function drawArrow(p1,p2,color,alpha,lw,halo){
  const [x1,y1]=p1,[x2,y2]=p2;
  const Lp=Math.hypot(x2-x1,y2-y1); if(Lp<1.5) return;
  const hl=Math.min(Lp*0.4, lw*2.4+6), hw=lw*1.6+4;
  const ang=Math.atan2(y2-y1,x2-x1);
  const bx=x2-hl*Math.cos(ang), by=y2-hl*Math.sin(ang);
  const nx=-Math.sin(ang), ny=Math.cos(ang);
  ctx.save(); ctx.globalAlpha=alpha; ctx.lineCap='round'; ctx.lineJoin='round';
  if(halo){
    ctx.strokeStyle=halo; ctx.lineWidth=lw+4;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(bx,by); ctx.stroke();
    ctx.fillStyle=halo; ctx.lineWidth=4; ctx.strokeStyle=halo;
    ctx.beginPath(); ctx.moveTo(x2,y2); ctx.lineTo(bx+nx*hw/2,by+ny*hw/2); ctx.lineTo(bx-nx*hw/2,by-ny*hw/2); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  ctx.strokeStyle=color; ctx.lineWidth=lw;
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(bx,by); ctx.stroke();
  ctx.fillStyle=color;
  ctx.beginPath(); ctx.moveTo(x2,y2); ctx.lineTo(bx+nx*hw/2,by+ny*hw/2); ctx.lineTo(bx-nx*hw/2,by-ny*hw/2); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function dashSeg(a,b,color,alpha,lw,dash){
  ctx.save(); ctx.globalAlpha=alpha; ctx.strokeStyle=color; ctx.lineWidth=lw||1.8; ctx.setLineDash(dash||[5,5]);
  ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke(); ctx.restore();
}
function ring(pt,r,color,alpha,lw,dash){
  ctx.save(); ctx.globalAlpha=alpha; ctx.strokeStyle=color; ctx.lineWidth=lw; if(dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.arc(pt[0],pt[1],r,0,7); ctx.stroke(); ctx.restore();
}
function dot_(pt,r,color,alpha){
  ctx.save(); ctx.globalAlpha=alpha; ctx.fillStyle=color; ctx.beginPath(); ctx.arc(pt[0],pt[1],r,0,7); ctx.fill(); ctx.restore();
}
function rrect(x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r); ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r); ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}
function drawOrigin(pt,color,t,ph){
  const br=1+0.12*Math.sin(t*2.4+ph), rad=30*K*br;
  const g=ctx.createRadialGradient(pt[0],pt[1],0,pt[0],pt[1],rad);
  g.addColorStop(0,hexA(color,.6)); g.addColorStop(.35,hexA(color,.22)); g.addColorStop(1,hexA(color,0));
  ctx.save(); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(pt[0],pt[1],rad,0,7); ctx.fill(); ctx.restore();
  ring(pt,9*K*br,color,.55,1.6);
  dot_(pt,5.5*K+1,color,1); dot_(pt,2.2*K+.4,'#ffffff',.9);
}

/* ---------- construcción por paralelogramo: estirar f1, f2 hasta alcanzar el punto ---------- */
function paraAnim(Pf,ui,uj,hi,hj,a,b,tau,alpha,diagCol,ringCol){
  const eA=ease(clamp(tau/1.2,0,1)), eB=ease(clamp((tau-1.2)/1.0,0,1)), eC=ease(clamp((tau-2.2)/0.8,0,1));
  const A=mul(a,ui), Bv=mul(b,uj), Ev=add(A,Bv), O=Pf(Z2);
  const si=lerp(1,a,eA), sj=lerp(1,b,eA);
  if(eB>0){
    const pA=Pf(A), pB=Pf(Bv), pE=Pf(Ev);
    ctx.save(); ctx.globalAlpha=alpha*.1*eB; ctx.fillStyle=CSS('--fg');
    ctx.beginPath(); ctx.moveTo(O[0],O[1]); ctx.lineTo(pA[0],pA[1]); ctx.lineTo(pE[0],pE[1]); ctx.lineTo(pB[0],pB[1]); ctx.closePath(); ctx.fill(); ctx.restore();
    const t1=mul(eB,A), t2=mul(eB,Bv);
    drawArrow(Pf(t1),Pf(add(t1,Bv)),hcol(hj),alpha*.8,3.4*K+1,bgResolved);
    drawArrow(Pf(t2),Pf(add(t2,A)),hcol(hi),alpha*.8,3.4*K+1,bgResolved);
  }
  drawArrow(O,Pf(mul(si,ui)),hcol(hi),alpha,5*K+1.5,bgResolved);
  drawArrow(O,Pf(mul(sj,uj)),hcol(hj),alpha,5*K+1.5,bgResolved);
  if(eC>0){
    drawArrow(O,Pf(mul(eC,Ev)),diagCol,alpha,5.8*K+1.5,bgResolved);
    if(tau>3.0&&tau<3.7){ const k=(tau-3.0)/0.7; ring(Pf(Ev),k*30*K,ringCol,(1-k)*.8*alpha,2.4); }
  }
}
/* paralelogramo estático y tenue (al terminar, queda como huella) */
function ghostPara(Pf,ui,uj,hi,hj,a,b,alpha){
  const A=mul(a,ui), Bv=mul(b,uj), Ev=add(A,Bv), O=Pf(Z2), pA=Pf(A), pB=Pf(Bv), pE=Pf(Ev);
  dashSeg(O,pA,hcol(hi),alpha,1.6,[3,5]); dashSeg(pA,pE,hcol(hj),alpha,1.6,[3,5]);
  dashSeg(O,pB,hcol(hj),alpha,1.6,[3,5]); dashSeg(pB,pE,hcol(hi),alpha,1.6,[3,5]);
}

/* ---------- estado del proceso ---------- */
let phase='idle', pt=0, NOW=0;
const T_REFL=2.8, DC=6.2;
function gF(j){ if(phase==='idle') return 0; if(phase==='reflecting') return ease(clamp((pt-(j*0.6+1.5))/0.5,0,1)); return 1; }
function colT(j){ return phase==='coords'?pt-j*DC:(phase==='done'?99:-1); }
const filled=j=>colT(j)>=4.9;
function updButtons(){
  btnReflect.disabled=(phase==='reflecting'||phase==='coords');
  btnCoords.disabled=!(phase==='reflected'||phase==='done');
}
btnReflect.onclick=()=>{ phase='reflecting'; pt=0; updButtons(); };
btnCoords.onclick=()=>{ phase='coords'; pt=0; updButtons(); };
document.getElementById('mat-resetBtn').onclick=()=>{ phase='idle'; pt=0; E=E0.map(v=>v.slice()); Fb=F0.map(v=>v.slice()); updButtons(); };

/* ---------- la matriz ---------- */
function cellCenter(i,j){ const {cx,cy,cs}=MX; return [cx-cs+(j+.5)*cs, cy-cs+(i+.5)*cs]; }
const fmt=v=>(Math.abs(v)<0.005?0:v).toFixed(2).replace('-','−');
function miniArrow(c,dir,len_,color,alpha,lw){
  const d=[dir[0],-dir[1]], l=Math.hypot(d[0],d[1])||1, u=[d[0]/l,d[1]/l];
  drawArrow([c[0]-u[0]*len_/2,c[1]-u[1]*len_/2],[c[0]+u[0]*len_/2,c[1]+u[1]*len_/2],color,alpha,lw,null);
}
function drawMatrix(t){
  const {cx,cy,cs}=MX, fg=CSS('--fg'), hab=CSS('--habitat');
  const left=cx-cs, right=cx+cs, top=cy-cs, bot=cy+cs;
  // resalte de la columna que se está construyendo
  for(let j=0;j<2;j++){
    const ct=colT(j);
    if(phase==='coords' && ct>=0 && ct<5.6){
      const pul=.10+.06*Math.sin(t*5);
      ctx.save(); ctx.globalAlpha=pul+0.04; ctx.fillStyle=hcol(HE[j]);
      rrect(left+j*cs+3,top-4,cs-6,2*cs+8,8*K); ctx.fill(); ctx.restore();
    }
  }
  // corchetes
  ctx.save(); ctx.strokeStyle=fg; ctx.globalAlpha=.85; ctx.lineWidth=3*K; ctx.lineCap='round'; ctx.lineJoin='round';
  const bw=9*K, pad=6*K;
  ctx.beginPath(); ctx.moveTo(left-pad+bw,top-pad); ctx.lineTo(left-pad,top-pad); ctx.lineTo(left-pad,bot+pad); ctx.lineTo(left-pad+bw,bot+pad); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(right+pad-bw,top-pad); ctx.lineTo(right+pad,top-pad); ctx.lineTo(right+pad,bot+pad); ctx.lineTo(right+pad-bw,bot+pad); ctx.stroke();
  ctx.restore();
  // cabeceras: qué vector de la primera base da cada columna; marcas: qué vector de la segunda base da cada fila
  for(let j=0;j<2;j++) miniArrow([left+(j+.5)*cs,top-0.55*cs-6*K],E[j],cs*0.55,hcol(HE[j]),1,3.4*K);
  for(let i=0;i<2;i++) miniArrow([left-0.62*cs-pad,top+(i+.5)*cs],Fb[i],cs*0.55,hcol(HF[i]),1,3.4*K);
  // celdas
  const fs=clamp(cs*0.36,12,22);
  ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font=`600 ${fs}px "Iowan Old Style",Palatino,Georgia,serif`;
  for(let j=0;j<2;j++){
    const co=colOf(j), ct=colT(j);
    for(let i=0;i<2;i++){
      const c=cellCenter(i,j);
      if(filled(j)){
        const v=co[i], landed=ct<5.9&&ct>=4.9, k=landed?(ct-4.9)/1.0:1;
        if(landed){ ring(c,(8+k*26)*K,hcol(HF[i]),(1-k)*.8,2.2); }
        ctx.fillStyle=hcol(HF[i],50); ctx.globalAlpha=1; ctx.fillText(fmt(v),c[0],c[1]-3*K);
        const bl=clamp(Math.abs(v),0,1.8)/1.8*cs*0.38;
        ctx.globalAlpha=.85; ctx.fillStyle=hcol(HF[i]);
        ctx.fillRect(v>=0?c[0]:c[0]-bl, c[1]+fs*0.62, bl, 3.6*K);
        ctx.globalAlpha=.3; ctx.fillRect(c[0]-1,c[1]+fs*0.62-2*K,2,7.6*K);
      }else{
        ctx.globalAlpha=.45; ctx.strokeStyle=hab; ctx.lineWidth=1.4; ctx.setLineDash([3,5]);
        rrect(c[0]-cs*0.36,c[1]-cs*0.36,cs*0.72,cs*0.72,7*K); ctx.stroke(); ctx.setLineDash([]);
      }
    }
  }
  ctx.restore();
}
/* las "fichas" con las coordenadas: salen de la punta de cada flecha estirada y vuelan a su celda */
function drawChips(t){
  const fs=clamp(MX.cs*0.30,11,17);
  for(let j=0;j<2;j++){
    const ct=colT(j); if(!(phase==='coords') || ct<1.3 || ct>=4.9) continue;
    const co=colOf(j);
    for(let i=0;i<2;i++){
      const tipW=Pw(mul(co[i],Fb[i]));
      const dirp=[Fb[i][0]*co[i],-Fb[i][1]*co[i]]; let l=Math.hypot(dirp[0],dirp[1])||1;
      const off=[-dirp[1]/l*18*K, dirp[0]/l*18*K];
      let start=[tipW[0]+off[0],tipW[1]+off[1]];
      start=[clamp(start[0],Wr.x+24,Wr.x+Wr.w-24), clamp(start[1],Wr.y+14,Wr.y+Wr.h-14)];
      const target=cellCenter(i,j);
      let p=start, sc=1, al=clamp((ct-1.3)/0.3,0,1);
      if(ct>=3.9){
        const s=ease(clamp((ct-3.9)/1.0,0,1));
        p=[lerp(start[0],target[0],s), lerp(start[1],target[1],s)-Math.sin(Math.PI*s)*34*K];
        sc=lerp(1,0.8,s);
      }
      const txt=fmt(co[i]);
      ctx.save(); ctx.globalAlpha=al; ctx.font=`600 ${fs*sc}px "Iowan Old Style",Palatino,Georgia,serif`;
      const tw=ctx.measureText(txt).width+14*K;
      ctx.fillStyle=bgResolved; ctx.strokeStyle=hcol(HF[i]); ctx.lineWidth=2*K;
      rrect(p[0]-tw/2,p[1]-fs*0.85*sc,tw,fs*1.7*sc,9*K); ctx.fill(); ctx.stroke();
      ctx.fillStyle=hcol(HF[i],50); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(txt,p[0],p[1]); ctx.restore();
    }
  }
}

/* ---------- los lienzos ---------- */
function drawCanvasFrame(r,color){
  ctx.save(); rrect(r.x,r.y,r.w,r.h,18*K); ctx.fillStyle=hexA(color,.05); ctx.fill();
  ctx.strokeStyle=CSS('--habitat'); ctx.globalAlpha=.8; ctx.lineWidth=1.6; ctx.setLineDash([2,6]); ctx.stroke(); ctx.restore();
}
function drawLatticeF(alpha){
  // la retícula que generan f1 y f2: así se "mide" cualquier punto de este espacio
  ctx.save(); ctx.lineWidth=1;
  [[Fb[0],Fb[1],HF[0]],[Fb[1],Fb[0],HF[1]]].forEach(([base,dir,h])=>{
    const dl=len(dir), dn=mul(1/dl,dir);
    for(let k=-16;k<=16;k++){
      const p0=mul(k,base), a=Pw(add(p0,mul(-30,dn))), b=Pw(add(p0,mul(30,dn)));
      ctx.globalAlpha=alpha*(k===0?.5:.2); ctx.strokeStyle=hcol(h); ctx.lineWidth=k===0?2:1;
      ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
    }
  });
  ctx.restore();
}
function drawHandle(pt_,color,hov){ ring(pt_,13*K,color,hov?.95:.55,hov?2.2:1.5,[3,4]); }

/* ---------- la flecha grande y los mensajeros ---------- */
function bridgeEnds(){
  const half=(AX[0]?Vr.w:Vr.h)/2;
  return [[CV[0]+AX[0]*(half+8),CV[1]+AX[1]*(half+8)],[CW[0]-AX[0]*(half+8),CW[1]-AX[1]*(half+8)]];
}
function drawBridge(t){
  const gold=CSS('--gold'), teal=CSS('--teal');
  ctx.save(); const g=ctx.createLinearGradient(CV[0],CV[1],CW[0],CW[1]);
  g.addColorStop(0,hexA(gold,.5)); g.addColorStop(1,hexA(teal,.5));
  ctx.strokeStyle=g; ctx.lineWidth=1.4; ctx.setLineDash([3,6]);
  ctx.beginPath(); ctx.moveTo(CV[0],CV[1]); ctx.lineTo(CW[0],CW[1]); ctx.stroke(); ctx.restore();
  const [a0,a1]=bridgeEnds();
  const L=Math.hypot(a1[0]-a0[0],a1[1]-a0[1]), th=clamp(Math.min(Vr.w,Vr.h)*0.1,14,32), hl=Math.min(L*0.42,th*1.5);
  ctx.save(); ctx.translate(a0[0],a0[1]); ctx.rotate(Math.atan2(AX[1],AX[0]));
  const grad=ctx.createLinearGradient(0,0,L,0);
  grad.addColorStop(0,hexA(gold,.92)); grad.addColorStop(1,hexA(teal,.92));
  const path=()=>{ ctx.beginPath(); ctx.moveTo(0,-th/2); ctx.lineTo(L-hl,-th/2); ctx.lineTo(L-hl,-th*0.95); ctx.lineTo(L,0);
    ctx.lineTo(L-hl,th*0.95); ctx.lineTo(L-hl,th/2); ctx.lineTo(0,th/2); ctx.closePath(); };
  ctx.shadowColor='rgba(0,0,0,.18)'; ctx.shadowBlur=14; ctx.shadowOffsetY=3;
  path(); ctx.fillStyle=grad; ctx.fill();
  ctx.shadowColor='transparent'; path(); ctx.clip();
  const sp=th*1.1, off=(t*38)%sp;
  ctx.strokeStyle='rgba(255,255,255,.42)'; ctx.lineWidth=2.2; ctx.lineJoin='round';
  for(let x=-sp+off;x<L+sp;x+=sp){ ctx.beginPath(); ctx.moveTo(x-th*.22,-th*.34); ctx.lineTo(x+th*.12,0); ctx.lineTo(x-th*.22,th*.34); ctx.stroke(); }
  ctx.restore();
}
function drawCouriers(){
  if(phase!=='reflecting') return;
  const [a0,a1]=bridgeEnds();
  const cf=Math.min(0.7*S,(GAPpx-16)*0.8/4);
  for(let j=0;j<2;j++){
    const ct=pt-j*0.6; if(ct<0||ct>1.5) continue;
    const s=ct/1.5, e=ease(s), u=E[j], Fu=Fe(j);
    const p=[lerp(a0[0],a1[0],e),lerp(a0[1],a1[1],e)];
    const v=[lerp(u[0],Fu[0],e),lerp(u[1],Fu[1],e)];
    const vx=v[0]*cf, vy=-v[1]*cf, al=Math.min(1,s*8)*Math.min(1,(1-s)*8);
    drawArrow([p[0]-vx/2,p[1]-vy/2],[p[0]+vx/2,p[1]+vy/2],hcol(HE[j]),al,(3.4+Math.min(2,len(v)))*Math.max(.8,K),bgResolved);
  }
}
function drawSpark(t){
  const gold=CSS('--gold'), teal=CSS('--teal');
  const per=5.2, q=(t%per)/1.9;
  if(q<0.3) ring(CV,q/0.3*34*K,gold,(1-q/0.3)*.6,2);
  if(q<1){
    const e=q*q*(3-2*q), p=[lerp(CV[0],CW[0],e),lerp(CV[1],CW[1],e)];
    const col=mixHex(gold,teal,e), g=ctx.createRadialGradient(p[0],p[1],0,p[0],p[1],14*K);
    g.addColorStop(0,col); g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.save(); ctx.globalAlpha=.9; ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p[0],p[1],14*K,0,7); ctx.fill(); ctx.restore();
  }else if(q<1.35){ const k=(q-1)/0.35; ring(CW,k*36*K,teal,(1-k)*.7,2.2); }
}

/* ---------- dibujo ---------- */
let hoverKey=null, drag=null;
function render(t){
  ctx.fillStyle=bgResolved; ctx.fillRect(0,0,W,H);
  if(!W) return;
  const gold=CSS('--gold'), teal=CSS('--teal');
  drawCanvasFrame(Vr,gold); drawCanvasFrame(Wr,teal);
  drawBridge(t);

  // ---- primer espacio: la base e1, e2
  ctx.save(); rrect(Vr.x,Vr.y,Vr.w,Vr.h,18*K); ctx.clip();
  for(let j=0;j<2;j++){
    const hot=(phase==='reflecting' && pt-j*0.6>=0 && pt-j*0.6<0.5);
    const O=Pv(Z2), T=Pv(E[j]);
    dot_([(O[0]+T[0])/2,(O[1]+T[1])/2],len(sub(T,O))/2+10*K,hcol(HE[j]),hot?.3:.14);
    drawArrow(O,T,hcol(HE[j]),1,6*K+1,null);
    if(hot) ring(T,(10+ (pt-j*0.6)/0.5*22)*K,hcol(HE[j]),1-(pt-j*0.6)/0.5,2.2);
  }
  ctx.restore();

  // ---- segundo espacio: la base f1, f2 y las imágenes F(e_j)
  ctx.save(); rrect(Wr.x,Wr.y,Wr.w,Wr.h,18*K); ctx.clip();
  const showLat=(phase==='coords'||phase==='done');
  if(showLat) drawLatticeF(clamp(phase==='coords'?pt/1.2:1,0,1));
  for(let i=0;i<2;i++){
    const O=Pw(Z2), T=Pw(Fb[i]);
    dot_([(O[0]+T[0])/2,(O[1]+T[1])/2],len(sub(T,O))/2+10*K,hcol(HF[i]),.14);
    drawArrow(O,T,hcol(HF[i]),1,6*K+1,null);
  }
  // huellas de las construcciones ya terminadas
  if(phase==='done'||phase==='coords'){
    for(let j=0;j<2;j++){
      if(phase==='done'||colT(j)>=3.7){ const co=colOf(j); ghostPara(Pw,Fb[0],Fb[1],HF[0],HF[1],co[0],co[1],.38); }
    }
  }
  // imágenes de la primera base
  for(let j=0;j<2;j++){
    const g=gF(j); if(g<=0) continue;
    const act=(phase==='coords' && colT(j)>=0 && colT(j)<5.6);
    const dim=(phase==='coords' && !act && colT(j)<0);
    const O=Pw(Z2), T=Pw(mul(g,Fe(j)));
    dot_([(O[0]+T[0])/2,(O[1]+T[1])/2],len(sub(T,O))/2+11*K,hcol(HE[j]),act?.30:.16);
    drawArrow(O,T,hcol(HE[j]),dim?.55:1,(act?7:6)*K+1,bgResolved);
    if(phase==='reflecting' && pt-(j*0.6+1.5)>=0 && pt-(j*0.6+1.5)<0.8){
      const k=(pt-(j*0.6+1.5))/0.8; ring(Pw(Fe(j)),k*34*K,hcol(HE[j]),(1-k)*.9,2.4);
    }
  }
  // construcción de la columna activa: f1 y f2 se estiran y se suman hasta alcanzar F(e_j)
  if(phase==='coords'){
    for(let j=0;j<2;j++){
      const ct=colT(j); if(ct<0||ct>=5.6) continue;
      const co=colOf(j), fade=ct>4.9?clamp((5.6-ct)/0.7,0,1):1;
      paraAnim(Pw,Fb[0],Fb[1],HF[0],HF[1],co[0],co[1],Math.min(ct,3.8),fade,hcol(HE[j]),hcol(HE[j]));
      // la flecha F(e_j) se vuelve a pintar encima de la diagonal
      const g=1; ring(Pw(Fe(j)),(15+3*Math.sin(t*6))*K,hcol(HE[j]),.8*fade,2);
    }
  }
  ctx.restore();

  drawCouriers();
  drawSpark(t);

  // asas para cambiar las bases (la aplicación no cambia; la matriz sí)
  for(let j=0;j<2;j++){ drawHandle(Pv(E[j]),hcol(HE[j]),hoverKey==='e'+j||drag==='e'+j); }
  for(let i=0;i<2;i++){ drawHandle(Pw(Fb[i]),hcol(HF[i]),hoverKey==='f'+i||drag==='f'+i); }

  drawOrigin(CV,gold,t,0); drawOrigin(CW,teal,t,1.7);
  if(phase==='reflecting' && pt>1.9 && pt<2.7){ const k=(pt-1.9)/0.8; ring(CW,k*46*K,teal,(1-k)*.8,2.6); }

  drawMatrix(t);
  drawChips(t);
  // la matriz completa: pulso final
  if(phase==='done' && pt<1.2){ const k=pt/1.2; const {cx,cy,cs}=MX; ring([cx,cy],(cs*1.7+k*26)*K,CSS('--fg'),(1-k)*.35,2.4); }
}

/* ---------- bucle ---------- */
function update(dt,t){
  NOW=t; pt+=dt;
  if(phase==='reflecting' && pt>=T_REFL){ phase='reflected'; pt=0; updButtons(); }
  if(phase==='coords' && pt>=2*DC){ phase='done'; pt=0; updButtons(); }
}
let last=performance.now();
function loop(now){ if(!cv.offsetParent){ last=now; requestAnimationFrame(loop); return; }
  let dt=(now-last)/1000; last=now; dt=Math.min(dt,0.05);
  update(dt,now/1000); render(now/1000);
  requestAnimationFrame(loop);
}

/* ---------- interacción: arrastrar las puntas de las bases ---------- */
const ptr=e=>{const r=cv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top];};
function findHandle(px,py){
  const thr=Math.max(22,24*K); let best=null,bd=thr;
  for(let j=0;j<2;j++){ const d=dist2([px,py],Pv(E[j])); if(d<bd){bd=d;best='e'+j;} }
  for(let i=0;i<2;i++){ const d=dist2([px,py],Pw(Fb[i])); if(d<bd){bd=d;best='f'+i;} }
  return best;
}
function enforceIndep(vs,i){
  const o=vs[1-i], u=vs[i], lu=len(u), lo=len(o); if(lu<1e-6||lo<1e-6) return;
  let rel=Math.atan2(u[1],u[0])-Math.atan2(o[1],o[0]); rel=Math.atan2(Math.sin(rel),Math.cos(rel));
  if(Math.abs(Math.sin(rel))>=0.28) return;
  const m=0.2838; let nr;
  if(Math.abs(rel)<=Math.PI/2) nr=(rel>=0?1:-1)*m; else nr=(rel>0?1:-1)*(Math.PI-m);
  const ang=Math.atan2(o[1],o[0])+nr; vs[i]=[lu*Math.cos(ang),lu*Math.sin(ang)];
}
function setHandle(key,px,py){
  const isE=key[0]==='e', idx=+key[1], vs=isE?E:Fb;
  let p=isE?unV(px,py):unW(px,py);
  const L=len(p); if(L>3.4) p=mul(3.4/L,p); if(L<0.9){ const d=L>1e-6?mul(1/L,p):[1,0]; p=mul(0.9,d); }
  p=[clamp(p[0],-HX+0.5,HX-0.5),clamp(p[1],-HY+0.5,HY-0.5)];
  vs[idx]=p; enforceIndep(vs,idx);
}
cv.addEventListener('pointerdown',e=>{
  const [px,py]=ptr(e); const h=findHandle(px,py);
  if(h){ cv.setPointerCapture(e.pointerId); drag=h; hoverKey=h; setHandle(h,px,py); }
});
cv.addEventListener('pointermove',e=>{
  const [px,py]=ptr(e);
  if(drag){ setHandle(drag,px,py); return; }
  const h=findHandle(px,py); hoverKey=h; cv.style.cursor=h?'grab':'default';
});
function endDrag(){ drag=null; }
cv.addEventListener('pointerup',endDrag);
cv.addEventListener('pointercancel',endDrag);
cv.addEventListener('pointerleave',()=>{ if(!drag) hoverKey=null; });

document.getElementById('mat-themeBtn').onclick=()=>{
  const el=document.documentElement, dark=matchMedia('(prefers-color-scheme: dark)').matches;
  const now=el.getAttribute('data-theme')||(dark?'dark':'light');
  el.setAttribute('data-theme', now==='dark'?'light':'dark'); refreshBg();
};

layout(); refreshBg(); updButtons();
window.addEventListener('resize',layout);
requestAnimationFrame(loop);

})();
</script>
<script>/* =====================================================================
   Utilidades comunes de los módulos nuevos (mismo trazo que los antiguos)
   ===================================================================== */
const CSSV=k=>getComputedStyle(document.documentElement).getPropertyValue(k).trim();
const hcol=(h,l)=>`hsl(${h},68%,${l||55}%)`;
function hexA(h,a){ h=h.replace('#',''); return `rgba(${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)},${a})`; }

  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2], cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],

const HU=[22,205,140,300];

function makeKit(cv){

    ctx.save(); ctx.globalAlpha=alpha; ctx.lineCap='round'; ctx.lineJoin='round';
    if(halo){ ctx.strokeStyle=halo; ctx.lineWidth=lw+4; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(bx,by); ctx.stroke();
      ctx.fillStyle=halo; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(x2,y2); ctx.lineTo(bx+nx*hw/2,by+ny*hw/2); ctx.lineTo(bx-nx*hw/2,by-ny*hw/2); ctx.closePath(); ctx.fill(); ctx.stroke(); }
    ctx.strokeStyle=color; ctx.lineWidth=lw; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(bx,by); ctx.stroke();
    ctx.fillStyle=color; ctx.beginPath(); ctx.moveTo(x2,y2); ctx.lineTo(bx+nx*hw/2,by+ny*hw/2); ctx.lineTo(bx-nx*hw/2,by-ny*hw/2); ctx.closePath(); ctx.fill();
    ctx.restore(); };
  K.dash=(a,b,color,alpha,lw,dash)=>{ ctx.save(); ctx.globalAlpha=alpha; ctx.strokeStyle=color; ctx.lineWidth=lw||1.8; ctx.setLineDash(dash||[5,5]);
    ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke(); ctx.restore(); };
  K.ring=(pt,r,color,alpha,lw,dash)=>{ ctx.save(); ctx.globalAlpha=alpha; ctx.strokeStyle=color; ctx.lineWidth=lw; if(dash) ctx.setLineDash(dash);
    ctx.beginPath(); ctx.arc(pt[0],pt[1],Math.max(0,r),0,7); ctx.stroke(); ctx.restore(); };
  K.dot=(pt,r,color,alpha)=>{ ctx.save(); ctx.globalAlpha=alpha; ctx.fillStyle=color; ctx.beginPath(); ctx.arc(pt[0],pt[1],r,0,7); ctx.fill(); ctx.restore(); };
  K.cross=(pt,s,color,alpha)=>{ ctx.save(); ctx.globalAlpha=alpha; ctx.strokeStyle=color; ctx.lineWidth=2.8*K.k; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(pt[0]-s,pt[1]-s); ctx.lineTo(pt[0]+s,pt[1]+s); ctx.moveTo(pt[0]+s,pt[1]-s); ctx.lineTo(pt[0]-s,pt[1]+s); ctx.stroke(); ctx.restore(); };
  K.origin=(pt,t,col)=>{ const color=col||CSSV('--gold'), br=1+0.12*Math.sin(t*2.4), rad=30*K.k*br;
    const g=ctx.createRadialGradient(pt[0],pt[1],0,pt[0],pt[1],rad);
    g.addColorStop(0,hexA(color,.6)); g.addColorStop(.35,hexA(color,.22)); g.addColorStop(1,hexA(color,0));
    ctx.save(); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(pt[0],pt[1],rad,0,7); ctx.fill(); ctx.restore();
    K.ring(pt,9*K.k*br,color,.55,1.6); K.dot(pt,5.5*K.k+1,color,1); K.dot(pt,2.2*K.k+.4,'#ffffff',.9); };
  K.habitat=(C,R)=>{ const gold=CSSV('--gold'), hab=CSSV('--habitat');
    ctx.save(); ctx.fillStyle=hexA(gold,0.05); ctx.beginPath(); ctx.arc(C[0],C[1],R,0,7); ctx.fill(); ctx.restore();
    K.ring(C,R,hab,.6,1.4,[2,6]); };
  K.habitatFuerte=(C,R,S)=>{ // el plano R^2 como disco bien marcado, con sus ejes
    ctx.save(); ctx.beginPath(); ctx.arc(C[0],C[1],R,0,7); ctx.fillStyle=hexA(CSSV('--tema'),0.04); ctx.fill(); ctx.clip();
    ctx.strokeStyle='#e2e8f0'; ctx.lineWidth=1;
    for(let k=-12;k<=12;k++){ ctx.beginPath(); ctx.moveTo(C[0]+k*S,C[1]-R); ctx.lineTo(C[0]+k*S,C[1]+R); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(C[0]-R,C[1]+k*S); ctx.lineTo(C[0]+R,C[1]+k*S); ctx.stroke(); }
    ctx.strokeStyle='#8c9bad'; ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.moveTo(C[0]-R,C[1]); ctx.lineTo(C[0]+R,C[1]); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(C[0],C[1]-R); ctx.lineTo(C[0],C[1]+R); ctx.stroke(); ctx.restore();

  K.loop=fn=>{ let last=performance.now();

      if(cv.offsetParent){ if(!K.W) K.fit(); if(K.W) fn(dt,now/1000); } else if(K.capEl) K.capEl.style.display='none'; requestAnimationFrame(L); };
    requestAnimationFrame(L); };

  return K;
}
function planoR2(K,C,S){ // R^2: cuadrícula suave y ejes continuos con flecha
  const ctx=K.ctx; ctx.save(); ctx.strokeStyle='#e2e8f0'; ctx.lineWidth=1;
  for(let k=-20;k<=20;k++){ const x=C[0]+k*S, y=C[1]+k*S;
    if(x>0&&x<K.W){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,K.H); ctx.stroke(); }
    if(y>0&&y<K.H){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(K.W,y); ctx.stroke(); } }
  ctx.strokeStyle='#8c9bad'; ctx.lineWidth=1.6;
  ctx.beginPath(); ctx.moveTo(8,C[1]); ctx.lineTo(K.W-8,C[1]); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(C[0],K.H-8); ctx.lineTo(C[0],8); ctx.stroke();
  ctx.fillStyle='#8c9bad';
  ctx.beginPath(); ctx.moveTo(K.W-6,C[1]); ctx.lineTo(K.W-16,C[1]-5); ctx.lineTo(K.W-16,C[1]+5); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(C[0],6); ctx.lineTo(C[0]-5,16); ctx.lineTo(C[0]+5,16); ctx.closePath(); ctx.fill();
  ctx.restore(); }
function makeBar(id){ return document.getElementById(id); }
function pill(bar,txt,title,fn,pressed){
  const b=document.createElement('button'); b.className='pill'; b.textContent=txt; if(title) b.title=title; b.onclick=()=>fn(b);
  if(pressed!==undefined) b.setAttribute('aria-pressed',pressed); bar.appendChild(b); return b; }

/* =====================================================================
   Motor 3D mínimo (giro con el ratón)
   ===================================================================== */
function make3D(K){
  const V={yaw:0.75,pitch:0.38,S:30,C:[0,0],drag:null,idle:0};
  V.rot=p=>{ const c=Math.cos(V.yaw), s=Math.sin(V.yaw), x=p[0]*c-p[1]*s, y=p[0]*s+p[1]*c, z=p[2];
    const cp=Math.cos(V.pitch), sp=Math.sin(V.pitch); return [x, z*cp - y*sp, y*cp + z*sp]; };
  V.P=p=>{ const r=V.rot(p); return [V.C[0]+r[0]*V.S, V.C[1]-r[1]*V.S]; };
  V.depth=p=>V.rot(p)[2];
  K.cv.addEventListener('pointerdown',e=>{ V.drag=K.ptr(e); K.cv.setPointerCapture(e.pointerId); });
  K.cv.addEventListener('pointermove',e=>{ if(!V.drag) return; const p=K.ptr(e);
    V.yaw-=(p[0]-V.drag[0])*0.008; V.pitch=clampN(V.pitch+(p[1]-V.drag[1])*0.006,-0.2,1.2); V.drag=p; V.idle=0; });
  K.cv.addEventListener('pointerup',()=>{V.drag=null;});
  V.tick=dt=>{ V.idle+=dt; if(!V.drag && V.idle>1.5) V.yaw+=dt*0.16; };
  V.fit=()=>{ V.C=[K.W/2,K.H/2]; V.S=Math.min(K.W,K.H)/14.5; K.k=clampN(V.S/40,.6,1.2); };
  V.cube=(L,alpha,color)=>{ const ctx=K.ctx, c=[-L,L], pts=[];
    for(const x of c) for(const y of c) for(const z of c) pts.push([x,y,z]);
    const pp=pts.map(V.P), faces=[[0,1,3,2],[4,5,7,6],[0,1,5,4],[2,3,7,6],[0,2,6,4],[1,3,7,5]];
    ctx.save(); ctx.fillStyle=CSSV('--tema'); ctx.globalAlpha=0.025;
    faces.forEach(f=>{ ctx.beginPath(); f.forEach((i,k)=>k?ctx.lineTo(pp[i][0],pp[i][1]):ctx.moveTo(pp[i][0],pp[i][1])); ctx.closePath(); ctx.fill(); });
    ctx.strokeStyle=color||'#8ea3bb'; ctx.globalAlpha=0.9; ctx.lineWidth=1.5; ctx.lineJoin='round';
    for(let i=0;i<8;i++) for(let j=i+1;j<8;j++){ const d=[0,1,2].filter(k=>pts[i][k]!==pts[j][k]).length;
      if(d===1){ const a=pp[i], b=pp[j]; ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke(); } }
    ctx.restore(); };
  V.axes=L=>{ const g='#a9b6c6'; [[1,0,0],[0,1,0],[0,0,1]].forEach(e=>{ const a=V.P(V3.mul(-L,e)), b=V.P(V3.mul(L,e));
    K.ctx.save(); K.ctx.strokeStyle=g; K.ctx.globalAlpha=.8; K.ctx.lineWidth=1.2; K.ctx.beginPath(); K.ctx.moveTo(a[0],a[1]); K.ctx.lineTo(b[0],b[1]); K.ctx.stroke(); K.ctx.restore(); }); };
  V.planeBasis=n=>{ const nn=V3.unit(n), a=V3.unit(Math.abs(nn[0])<.9?V3.cross(nn,[1,0,0]):V3.cross(nn,[0,1,0])); return [a,V3.cross(nn,a)]; };
  V.disc=(a,b,r,fill,fa,edge,ea)=>{ // trozo cuadrado del plano generado por a, b
    const ctx=K.ctx, cs=[[1,1],[-1,1],[-1,-1],[1,-1]].map(([i,j])=>V.P(V3.add(V3.mul(i*r,a),V3.mul(j*r,b))));
    ctx.save(); ctx.beginPath(); cs.forEach((q,k)=>k?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])); ctx.closePath();
    ctx.globalAlpha=fa; ctx.fillStyle=fill; ctx.fill();
    if(edge){ ctx.globalAlpha=ea; ctx.strokeStyle=edge; ctx.lineWidth=2; ctx.lineJoin='round'; ctx.stroke(); }
    // retícula tenue sobre la hoja: se ve que es plana
    ctx.globalAlpha=(edge?ea:fa)*0.35; ctx.strokeStyle=edge||fill; ctx.lineWidth=1;
    for(let k=-3;k<=3;k++){ const t=k/4*r;
      let q1=V.P(V3.add(V3.mul(t,a),V3.mul(-r,b))), q2=V.P(V3.add(V3.mul(t,a),V3.mul(r,b)));
      ctx.beginPath(); ctx.moveTo(q1[0],q1[1]); ctx.lineTo(q2[0],q2[1]); ctx.stroke();
      q1=V.P(V3.add(V3.mul(-r,a),V3.mul(t,b))); q2=V.P(V3.add(V3.mul(r,a),V3.mul(t,b)));
      ctx.beginPath(); ctx.moveTo(q1[0],q1[1]); ctx.lineTo(q2[0],q2[1]); ctx.stroke(); }
    ctx.restore(); };
  V.line=(d,L,color,alpha)=>{ const ctx=K.ctx, u=V3.unit(d), a=V.P(V3.mul(-L,u)), b=V.P(V3.mul(L,u));
    ctx.save(); ctx.lineCap='round'; ctx.strokeStyle=hexA(color,.16*alpha); ctx.lineWidth=16*K.k; ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
    ctx.strokeStyle=hexA(color,.85*alpha); ctx.lineWidth=2.6*K.k; ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke(); ctx.restore(); };
  V.solidCube=(L,alpha)=>{ // el espacio entero, encendido
    const gold=CSSV('--gold'), ctx=K.ctx, c=[-L,L], pts=[]; for(const x of c) for(const y of c) for(const z of c) pts.push(V.P([x,y,z]));
    const faces=[[0,1,3,2],[4,5,7,6],[0,1,5,4],[2,3,7,6],[0,2,6,4],[1,3,7,5]];
    ctx.save(); faces.forEach(f=>{ ctx.beginPath(); f.forEach((i,k)=>k?ctx.lineTo(pts[i][0],pts[i][1]):ctx.moveTo(pts[i][0],pts[i][1])); ctx.closePath();
      ctx.globalAlpha=.06*alpha; ctx.fillStyle=gold; ctx.fill(); ctx.globalAlpha=.55*alpha; ctx.strokeStyle=gold; ctx.lineWidth=1.6; ctx.stroke(); }); ctx.restore(); };
  return V;
}
