<script>/* =====================================================================
   Tema 3 · Espacios vectoriales euclídeos — la luz del sol
   u: rojo teja · v: gris oscuro · sombra: azul claro · sol: dorado
   ===================================================================== */
function fit3(K,V){ K.onfit=()=>{ V.fit(); V.S=Math.min(K.W,K.H)/12; K.k=clampN(V.S/34,.7,1.25); }; }
const UC='#B5452B', VC='#3d4b5c', SH='#5E9FD8', SUN='#F2B90C', OKC='#1e963c';

function sun2(K,pt,r,t){ const ctx=K.ctx, R=r*K.k;
  const g=ctx.createRadialGradient(pt[0],pt[1],0,pt[0],pt[1],R*3.2);
  g.addColorStop(0,'rgba(255,248,210,1)'); g.addColorStop(.25,'rgba(255,214,90,.75)'); g.addColorStop(1,'rgba(255,214,90,0)');
  ctx.save(); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(pt[0],pt[1],R*3.2,0,7); ctx.fill();
  ctx.strokeStyle=SUN; ctx.lineWidth=2*K.k; ctx.lineCap='round';
  for(let k=0;k<12;k++){ const a=k*Math.PI/6+t*0.3; ctx.globalAlpha=.7;
    ctx.beginPath(); ctx.moveTo(pt[0]+Math.cos(a)*R*1.5,pt[1]+Math.sin(a)*R*1.5); ctx.lineTo(pt[0]+Math.cos(a)*R*2.2,pt[1]+Math.sin(a)*R*2.2); ctx.stroke(); }
  ctx.globalAlpha=1; ctx.fillStyle='#FFF6CF'; ctx.beginPath(); ctx.arc(pt[0],pt[1],R,0,7); ctx.fill();
  ctx.restore(); }
function cone(K,s,a,b,alpha){ const ctx=K.ctx;
  const g=ctx.createLinearGradient(s[0],s[1],(a[0]+b[0])/2,(a[1]+b[1])/2);
  g.addColorStop(0,`rgba(255,215,80,${.45*alpha})`); g.addColorStop(1,`rgba(255,215,80,${.12*alpha})`);
  ctx.save(); ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(s[0],s[1]); ctx.lineTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.closePath(); ctx.fill(); ctx.restore(); }
function shadowSeg(K,a,b,color,alpha){ const ctx=K.ctx; ctx.save(); ctx.lineCap='round';
  ctx.globalAlpha=.28*alpha; ctx.strokeStyle=color; ctx.lineWidth=16*K.k; ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
  ctx.globalAlpha=.95*alpha; ctx.lineWidth=5*K.k; ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
  ctx.globalAlpha=.9*alpha; ctx.strokeStyle='#ffffff'; ctx.lineWidth=1.6*K.k; ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
  ctx.restore(); }
function rightAngle(K,O,a,b,s,color,alpha){ // a, b: direcciones en pantalla (unitarias)
  const ctx=K.ctx, p1=[O[0]+a[0]*s,O[1]+a[1]*s], p2=[p1[0]+b[0]*s,p1[1]+b[1]*s], p3=[O[0]+b[0]*s,O[1]+b[1]*s];
  ctx.save(); ctx.globalAlpha=alpha; ctx.strokeStyle=color; ctx.lineWidth=2*K.k; ctx.beginPath(); ctx.moveTo(p1[0],p1[1]); ctx.lineTo(p2[0],p2[1]); ctx.lineTo(p3[0],p3[1]); ctx.stroke(); ctx.restore(); }

const MATHC='#503050', MF=sz=>`italic ${sz}px "Latin Modern Math","CMU Serif","Cambria Math","Times New Roman",serif`;
function texNode(t){ if(!(window.MathJax&&MathJax.tex2svg)) return null; try{ return MathJax.tex2svg(t,{display:false}); }catch(e){ return null; } }
function cap(K,lines){ // rótulo matemático en LaTeX, arriba a la izquierda del lienzo
  if(!K.capEl){ const d=document.createElement('div'); d.className='cap'; K.cv.parentElement.appendChild(d); K.capEl=d; }
  K.capEl.style.display='block';
  const ready=!!(window.MathJax&&MathJax.tex2svg), key=JSON.stringify(lines)+ready+(K.capCv=K.cv.id);
  if(K.capKey===key) return; K.capKey=key; K.capEl.innerHTML='';
  if(!ready) return;
  lines.forEach(l=>{ const row=document.createElement('div'); row.style.color=(l&&l.c)||'#503050';
    const n=texNode(typeof l==='string'?l:l.t); if(n) row.appendChild(n); K.capEl.appendChild(row); });
}
function tag(K,pt,txt,color){ const ctx=K.ctx, sz=Math.round(clampN(19*K.k,15,24)); ctx.save(); ctx.font=`italic ${sz+2}px "Latin Modern Math","STIX Two Math","Times New Roman",serif`;
  ctx.fillStyle=color; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.lineWidth=4; ctx.strokeStyle='#fff'; ctx.strokeText(txt,pt[0],pt[1]); ctx.fillText(txt,pt[0],pt[1]); ctx.restore(); }
function tipTag(K,O,T,txt,color){ const d=unit2([T[0]-O[0],T[1]-O[1]]); tag(K,[T[0]+d[0]*20*K.k+(-d[1])*12*K.k,T[1]+d[1]*20*K.k+d[0]*12*K.k],txt,color); }
function matLabel(K,x,y,M){ // G = ( a b ; c d )
  const ctx=K.ctx, sz=Math.round(clampN(17*K.k,14,22)), cw=sz*1.6, rh=sz*1.25;
  ctx.save(); ctx.font=MF(sz); ctx.fillStyle=MATHC; ctx.textBaseline='middle'; ctx.fillText('G =',x,y+rh);
  const x0=x+sz*2.9; ctx.strokeStyle=MATHC; ctx.lineWidth=1.6;
  ctx.beginPath(); ctx.moveTo(x0+6,y+2); ctx.quadraticCurveTo(x0-2,y+rh,x0+6,y+2*rh-2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x0+2*cw+6,y+2); ctx.quadraticCurveTo(x0+2*cw+14,y+rh,x0+2*cw+6,y+2*rh-2); ctx.stroke();
  ctx.font=`${sz}px "Latin Modern Math","CMU Serif","Times New Roman",serif`; ctx.textAlign='center';
  for(let i=0;i<2;i++) for(let j=0;j<2;j++) ctx.fillText(M[i][j],x0+10+cw*(j+.5)-4,y+rh*(i+.5)+2);
  ctx.restore(); }

const unit2=a=>{ const l=Math.hypot(a[0],a[1])||1; return [a[0]/l,a[1]/l]; };
function lineThrough(K,P,d,color,alpha){ const a=P(V2.mul(-40,d)), b=P(V2.mul(40,d)); K.dash(a,b,color,alpha,1.4,[6,6]); }
function view2(K,f){ const V={C:[0,0],S:40}; K.onfit=()=>{ V.C=[K.W/2,K.H*0.6]; V.S=Math.min(K.W,K.H)/(f||8); K.k=clampN(V.S/50,.7,1.3); };
  V.P=p=>[V.C[0]+p[0]*V.S, V.C[1]-p[1]*V.S]; V.unP=(x,y)=>[(x-V.C[0])/V.S,(V.C[1]-y)/V.S]; return V; }
function handles(K,V,list,onmove){ // asas arrastrables en las puntas
  let drag=null; K.hov=null;
  K.cv.addEventListener('pointerdown',e=>{ const p=K.ptr(e); for(const h of list()) if(Math.hypot(p[0]-V.P(h.get())[0],p[1]-V.P(h.get())[1])<26*K.k){ drag=h; K.cv.setPointerCapture(e.pointerId); K.dragging=true; return; } });
  K.cv.addEventListener('pointermove',e=>{ const p=K.ptr(e);
    if(drag){ let q=V.unP(p[0],p[1]); const L=V2.len(q); if(L>4.2) q=V2.mul(4.2/L,q); if(L<0.5) q=V2.mul(0.5/(L||1),q); drag.set(q); if(onmove) onmove(); return; }
    K.hov=null; for(const h of list()) if(Math.hypot(p[0]-V.P(h.get())[0],p[1]-V.P(h.get())[1])<26*K.k) K.hov=h.id; K.cv.style.cursor=K.hov?'grab':'default'; });
  K.cv.addEventListener('pointerup',()=>{ drag=null; K.dragging=false; });
}

</script>
<script>/* =====================================================================
   Tema 4 · Aplicaciones lineales — el puente y su reflejo
   ===================================================================== */
const GOLD='#c99a2e', TEAL='#14a89b', VIO='#8e5bb5', KER='#d2553f', IMC='#3d7cc0', OR='#E07B39', BL='#4F81BD';
const TL=(K)=>K.ctx;

/* ---------- mundos en fila (2D) ---------- */
function rowWorlds(K,n,B){
  const W={C:[],R:100,S:20,B};
  W.fit=()=>{ const gap=Math.max(70,K.W*(n===3?0.07:0.11)); W.R=Math.max(50,Math.min(K.H*0.43,(K.W-24-gap*(n-1))/(2*n)));
    const tot=2*n*W.R+gap*(n-1), x0=(K.W-tot)/2+W.R; W.gap=gap; W.C=[]; for(let i=0;i<n;i++) W.C.push([x0+i*(2*W.R+gap),K.H*0.55]);
    W.S=W.R/B; K.k=clampN(W.S/40,.6,1.2); };
  W.P=(i,p)=>[W.C[i][0]+p[0]*W.S, W.C[i][1]-p[1]*W.S];
  W.unP=(i,x,y)=>[(x-W.C[i][0])/W.S,(W.C[i][1]-y)/W.S];
  W.disk=(i,col)=>{ const ctx=K.ctx, C=W.C[i]; ctx.save(); ctx.fillStyle=hexA(col,.06); ctx.beginPath(); ctx.arc(C[0],C[1],W.R,0,7); ctx.fill();
    K.ring(C,W.R,'#9aa7b6',.9,1.6); ctx.restore(); };
  W.clip=i=>{ const ctx=K.ctx, C=W.C[i]; ctx.beginPath(); ctx.arc(C[0],C[1],W.R,0,7); ctx.clip(); };
  W.grid=(i,f,alpha)=>{ const ctx=K.ctx; ctx.save(); W.clip(i); ctx.strokeStyle='#9aa7b6'; ctx.lineWidth=1;
    for(let k=-B;k<=B;k++){ for(const dir of [0,1]){ ctx.globalAlpha=(k===0?.6:.28)*(alpha??1); ctx.beginPath();
      for(let s=0;s<=60;s++){ const tt=-B*1.6+3.2*B*s/60, p=dir?[k,tt]:[tt,k], q=W.P(i,f?f(p):p); s?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]); } ctx.stroke(); } }
    ctx.restore(); };
  W.bridge=(i,t,label)=>{ const ctx=K.ctx, a=[W.C[i][0]+W.R+8,W.C[i][1]], b=[W.C[i+1][0]-W.R-8,W.C[i+1][1]], L=b[0]-a[0];
    const th=clampN(W.R*0.14,12,26), hl=Math.min(L*0.42,th*1.5);
    ctx.save(); ctx.translate(a[0],a[1]);
    const g=ctx.createLinearGradient(0,0,L,0); g.addColorStop(0,hexA(CSSV('--tema'),.85)); g.addColorStop(1,hexA(CSSV('--tema'),.95));
    const path=()=>{ ctx.beginPath(); ctx.moveTo(0,-th/2); ctx.lineTo(L-hl,-th/2); ctx.lineTo(L-hl,-th*.95); ctx.lineTo(L,0); ctx.lineTo(L-hl,th*.95); ctx.lineTo(L-hl,th/2); ctx.lineTo(0,th/2); ctx.closePath(); };
    ctx.shadowColor='rgba(0,0,0,.15)'; ctx.shadowBlur=10; ctx.shadowOffsetY=2; path(); ctx.fillStyle=g; ctx.fill();
    ctx.shadowColor='transparent'; path(); ctx.clip(); const sp=th*1.1, off=(t*34)%sp;
    ctx.strokeStyle='rgba(255,255,255,.45)'; ctx.lineWidth=2;
    for(let x=-sp+off;x<L+sp;x+=sp){ ctx.beginPath(); ctx.moveTo(x-th*.22,-th*.34); ctx.lineTo(x+th*.12,0); ctx.lineTo(x-th*.22,th*.34); ctx.stroke(); }
    ctx.restore();
    if(label){ ctx.save(); ctx.font=`italic ${Math.round(22*K.k)}px "Latin Modern Math","STIX Two Math","Times New Roman",serif`; ctx.fillStyle='#503050'; ctx.textAlign='center';
      ctx.fillText(label,(a[0]+b[0])/2,a[1]-th*1.3); ctx.restore(); } };
  return W;
}
const ORC=[GOLD,TEAL,VIO];

/* ---------- 3D: dos cubos unidos por el puente ---------- */
function twoCubes(K){
  const V=make3D(K);
  K.onfit=()=>{ V.fit(); V.S=Math.min(K.W/2.2,K.H)/11.5; K.k=clampN(V.S/34,.7,1.2); V.dx=K.W*0.25; };
  V.P1=p=>{ const q=V.P(p); return [q[0]-V.dx,q[1]+K.H*0.04]; };
  V.P2=p=>{ const q=V.P(p); return [q[0]+V.dx,q[1]+K.H*0.04]; };
  V.cubeAt=(Pf,L)=>{ const ctx=K.ctx, c=[-L,L], pts=[]; for(const x of c) for(const y of c) for(const z of c) pts.push([x,y,z]);
    const pp=pts.map(Pf), faces=[[0,1,3,2],[4,5,7,6],[0,1,5,4],[2,3,7,6],[0,2,6,4],[1,3,7,5]];
    ctx.save(); ctx.fillStyle=CSSV('--tema'); ctx.globalAlpha=0.03;
    faces.forEach(f=>{ ctx.beginPath(); f.forEach((i,k)=>k?ctx.lineTo(pp[i][0],pp[i][1]):ctx.moveTo(pp[i][0],pp[i][1])); ctx.closePath(); ctx.fill(); });
    ctx.strokeStyle='#8ea3bb'; ctx.globalAlpha=.9; ctx.lineWidth=1.4;
    for(let i=0;i<8;i++) for(let j=i+1;j<8;j++){ const d=[0,1,2].filter(k=>pts[i][k]!==pts[j][k]).length; if(d===1){ ctx.beginPath(); ctx.moveTo(pp[i][0],pp[i][1]); ctx.lineTo(pp[j][0],pp[j][1]); ctx.stroke(); } }
    ctx.strokeStyle='#a9b6c6'; ctx.globalAlpha=.7; ctx.lineWidth=1;
    [[1,0,0],[0,1,0],[0,0,1]].forEach(e=>{ const a=Pf(V3.mul(-L,e)), b=Pf(V3.mul(L,e)); ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke(); });
    ctx.restore(); };
  V.sheetAt=(Pf,a,b,r,col,fa,ea)=>{ const ctx=K.ctx, cs=[[1,1],[-1,1],[-1,-1],[1,-1]].map(([i,j])=>Pf(V3.add(V3.mul(i*r,a),V3.mul(j*r,b))));
    ctx.save(); ctx.beginPath(); cs.forEach((q,k)=>k?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])); ctx.closePath(); ctx.globalAlpha=fa; ctx.fillStyle=col; ctx.fill();
    ctx.globalAlpha=ea; ctx.strokeStyle=col; ctx.lineWidth=2; ctx.stroke();
    ctx.globalAlpha=ea*.35; ctx.lineWidth=1; for(let k=-3;k<=3;k++){ const t=k/4*r; let q1=Pf(V3.add(V3.mul(t,a),V3.mul(-r,b))), q2=Pf(V3.add(V3.mul(t,a),V3.mul(r,b)));
      ctx.beginPath(); ctx.moveTo(q1[0],q1[1]); ctx.lineTo(q2[0],q2[1]); ctx.stroke(); q1=Pf(V3.add(V3.mul(-r,a),V3.mul(t,b))); q2=Pf(V3.add(V3.mul(r,a),V3.mul(t,b)));
      ctx.beginPath(); ctx.moveTo(q1[0],q1[1]); ctx.lineTo(q2[0],q2[1]); ctx.stroke(); }
    ctx.restore(); };
  V.lineAt=(Pf,d,L,col,alpha)=>{ const ctx=K.ctx, u=V3.unit(d), a=Pf(V3.mul(-L,u)), b=Pf(V3.mul(L,u));
    ctx.save(); ctx.lineCap='round'; ctx.strokeStyle=hexA(col,.18*alpha); ctx.lineWidth=16*K.k; ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
    ctx.strokeStyle=hexA(col,.9*alpha); ctx.lineWidth=2.8*K.k; ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke(); ctx.restore(); };
  V.solidAt=(Pf,L,col,alpha)=>{ const ctx=K.ctx, c=[-L,L], pts=[]; for(const x of c) for(const y of c) for(const z of c) pts.push(Pf([x,y,z]));
    const faces=[[0,1,3,2],[4,5,7,6],[0,1,5,4],[2,3,7,6],[0,2,6,4],[1,3,7,5]];
    ctx.save(); faces.forEach(f=>{ ctx.beginPath(); f.forEach((i,k)=>k?ctx.lineTo(pts[i][0],pts[i][1]):ctx.moveTo(pts[i][0],pts[i][1])); ctx.closePath(); ctx.globalAlpha=.07*alpha; ctx.fillStyle=col; ctx.fill(); ctx.globalAlpha=.6*alpha; ctx.strokeStyle=col; ctx.lineWidth=1.6; ctx.stroke(); }); ctx.restore(); };
  V.bridge=t=>{ const ctx=K.ctx, a=[K.W/2-K.W*0.06,K.H*0.54], b=[K.W/2+K.W*0.06,K.H*0.54], L=b[0]-a[0], th=clampN(K.H*0.05,12,24), hl=Math.min(L*.42,th*1.5);
    ctx.save(); ctx.translate(a[0],a[1]); const path=()=>{ ctx.beginPath(); ctx.moveTo(0,-th/2); ctx.lineTo(L-hl,-th/2); ctx.lineTo(L-hl,-th*.95); ctx.lineTo(L,0); ctx.lineTo(L-hl,th*.95); ctx.lineTo(L-hl,th/2); ctx.lineTo(0,th/2); ctx.closePath(); };
    ctx.shadowColor='rgba(0,0,0,.15)'; ctx.shadowBlur=10; path(); ctx.fillStyle=hexA(CSSV('--tema'),.9); ctx.fill(); ctx.shadowColor='transparent'; path(); ctx.clip();
    const sp=th*1.1, off=(t*34)%sp; ctx.strokeStyle='rgba(255,255,255,.45)'; ctx.lineWidth=2;
    for(let x=-sp+off;x<L+sp;x+=sp){ ctx.beginPath(); ctx.moveTo(x-th*.22,-th*.34); ctx.lineTo(x+th*.12,0); ctx.lineTo(x-th*.22,th*.34); ctx.stroke(); } ctx.restore();
    ctx.save(); ctx.font=`italic ${Math.round(22*K.k)}px "Latin Modern Math","STIX Two Math","Times New Roman",serif`; ctx.fillStyle='#503050'; ctx.textAlign='center'; ctx.fillText('F',K.W/2,a[1]-th*1.3); ctx.restore(); };
  return V;
}
const rotM=(()=>{ const a=0.7,b=0.35, Rz=[[Math.cos(a),-Math.sin(a),0],[Math.sin(a),Math.cos(a),0],[0,0,1]], Rx=[[1,0,0],[0,Math.cos(b),-Math.sin(b)],[0,Math.sin(b),Math.cos(b)]];
  const m=(A,B)=>A.map((r,i)=>B[0].map((_,j)=>r.reduce((s,_,k)=>s+A[i][k]*B[k][j],0))); return m(Rx,Rz); })();
const apply3=(M,p)=>[M[0][0]*p[0]+M[0][1]*p[1]+M[0][2]*p[2],M[1][0]*p[0]+M[1][1]*p[1]+M[1][2]*p[2],M[2][0]*p[0]+M[2][1]*p[1]+M[2][2]*p[2]];

/* ---------- números en columnas y matrices (lienzo) ---------- */
const fmt=x=>(Math.abs(x)<0.005?0:x).toFixed(2).replace('-','−');
function brackets(ctx,l,t,r,b,k,col,alpha){ ctx.save(); ctx.strokeStyle=col||'#20201e'; ctx.globalAlpha=alpha??.85; ctx.lineWidth=2.6*k; ctx.lineCap='round';
  const bw=8*k; ctx.beginPath(); ctx.moveTo(l+bw,t); ctx.lineTo(l,t); ctx.lineTo(l,b); ctx.lineTo(l+bw,b); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(r-bw,t); ctx.lineTo(r,t); ctx.lineTo(r,b); ctx.lineTo(r-bw,b); ctx.stroke(); ctx.restore(); }
function numCol(K,cx,cy,vals,cols,cs,glow){ const ctx=K.ctx, w=cs*1.25, h=cs*2;
  if(glow>0){ ctx.save(); ctx.globalAlpha=.18*glow; ctx.fillStyle=CSSV('--tema'); ctx.fillRect(cx-w/2-6,cy-h/2-6,w+12,h+12); ctx.restore(); }
  brackets(ctx,cx-w/2,cy-h/2,cx+w/2,cy+h/2,K.k);
  ctx.save(); ctx.font=`${Math.round(cs*.42)}px "Latin Modern Math","CMU Serif","Times New Roman",serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
  vals.forEach((v,i)=>{ ctx.fillStyle=cols[i]; ctx.fillText(fmt(v),cx,cy-h/4+i*h/2); }); ctx.restore(); return [w,h]; }
function numMat(K,cx,cy,M,cs,glow,colsHead){ const ctx=K.ctx, w=cs*2.5, h=cs*2;
  if(glow>0){ ctx.save(); ctx.globalAlpha=.18*glow; ctx.fillStyle=CSSV('--tema'); ctx.fillRect(cx-w/2-6,cy-h/2-6,w+12,h+12); ctx.restore(); }
  brackets(ctx,cx-w/2,cy-h/2,cx+w/2,cy+h/2,K.k);
  ctx.save(); ctx.font=`${Math.round(cs*.42)}px "Latin Modern Math","CMU Serif","Times New Roman",serif`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='#20201e';
  for(let i=0;i<2;i++) for(let j=0;j<2;j++){ if(colsHead) ctx.fillStyle=colsHead[j]; ctx.fillText(fmt(M[i][j]),cx-w/4+j*w/2,cy-h/4+i*h/2); }
  ctx.restore(); return [w,h]; }
function txt(K,x,y,s,size,col,align){ const ctx=K.ctx; ctx.save(); ctx.font=`${Math.round(size*K.k)}px "Latin Modern Math","CMU Serif","Times New Roman",serif`; ctx.fillStyle=col||'#503050'; ctx.textAlign=align||'center'; ctx.textBaseline='middle'; ctx.fillText(s,x,y); ctx.restore(); }
const solve2v=(a,b,p)=>{ const d=V2.cross(a,b); return [V2.cross(p,b)/d, V2.cross(a,p)/d]; };
const appM=(M,p)=>[M[0][0]*p[0]+M[0][1]*p[1], M[1][0]*p[0]+M[1][1]*p[1]];

/* =====================================================================
   2. ¿LINEAL O NO?
   ===================================================================== */
(function(){
  const K=makeKit(document.getElementById('lin-cv')), bar=makeBar('lin-bar'), W=rowWorlds(K,2,4); K.onfit=W.fit;
  const FS=[
    {f:p=>[p[0]+0.5*p[1],0.5*p[0]+p[1]], tex:String.raw`F(x,y)=\big(x+\tfrac12 y,\ \tfrac12 x+y\big)`, lin:true, name:'Lineal 1'},
    {f:p=>[-p[1],p[0]], tex:String.raw`F(x,y)=(-y,\ x)`, lin:true, name:'Lineal 2'},
    {f:p=>[p[0]+1,p[1]], tex:String.raw`F(x,y)=(x+1,\ y)`, lin:false, why:'origen', name:'(x+1, y)'},
    {f:p=>[p[0],p[1]+p[0]*p[0]/3], tex:String.raw`F(x,y)=\big(x,\ y+\tfrac13 x^2\big)`, lin:false, why:'curva', name:'(x, y + x²/3)'}];
  let idx=0, ph=0;
  function build(){ bar.innerHTML=''; FS.forEach((F,i)=>pill(bar,F.name,'',()=>{idx=i;ph=0;build();},idx===i)); }
  const u=[1.7,0.5], v=[0.4,1.5], w=V2.add(u,v);
  K.loop((dt,t)=>{
    K.bg(); ph+=dt; const F=FS[idx], tt=easeN(clampN((ph%7)/2.2,0,1)), G=p=>{ const q=F.f(p); return [lerpN(p[0],q[0],tt),lerpN(p[1],q[1],tt)]; };
    W.disk(0,GOLD); W.disk(1,TEAL); W.bridge(0,t,'F');
    W.grid(0,null); W.grid(1,G);
    const O1=W.P(0,[0,0]), O2=W.P(1,[0,0]);
    // mundo de partida: u, v y u+v (paralelogramo)
    K.dash(W.P(0,u),W.P(0,w),'#7a8796',.6,1.4,[4,4]); K.dash(W.P(0,v),W.P(0,w),'#7a8796',.6,1.4,[4,4]);
    K.arrow(O1,W.P(0,u),UC,1,5*K.k+1,'#fff'); K.arrow(O1,W.P(0,v),VC,1,5*K.k+1,'#fff'); K.arrow(O1,W.P(0,w),'#9a6d00',1,5*K.k+1,'#fff');
    // mundo de llegada
    const F0=G([0,0]), Fu=G(u), Fv=G(v), Fw=G(w), S=V2.add(V2.sub(Fu,F0),V2.sub(Fv,F0)), sum=V2.add(F0,S);
    const ctx=K.ctx; ctx.save(); W.clip(1);
    K.dash(W.P(1,Fu),W.P(1,V2.add(Fu,V2.sub(Fv,F0))),'#7a8796',.6,1.4,[4,4]); K.dash(W.P(1,Fv),W.P(1,V2.add(Fv,V2.sub(Fu,F0))),'#7a8796',.6,1.4,[4,4]);
    K.arrow(W.P(1,F0),W.P(1,Fu),UC,1,5*K.k+1,'#fff'); K.arrow(W.P(1,F0),W.P(1,Fv),VC,1,5*K.k+1,'#fff'); K.arrow(W.P(1,F0),W.P(1,Fw),'#9a6d00',1,5*K.k+1,'#fff');
    const gap=V2.len(V2.sub(sum,Fw));
    if(gap>0.05){ K.dash(W.P(1,sum),W.P(1,Fw),KER,.9,2.4,[3,3]); K.cross(W.P(1,sum),8*K.k,KER,.8); }
    ctx.restore();
    K.origin(O1,t,GOLD); K.origin(O2,t,TEAL);
    if(V2.len(F0)>0.02){ K.ring(O2,(20+5*Math.sin(t*5))*K.k,KER,.8,2.4,[4,4]); K.dot(W.P(1,F0),6*K.k,KER,1); }
    tipTag(K,O1,W.P(0,u),'u',UC); tipTag(K,O1,W.P(0,v),'v',VC); tipTag(K,O1,W.P(0,w),'u+v','#9a6d00');
    const ok = F.lin || tt<0.05;
    cap(K,[F.tex, F.lin ? {t:String.raw`F(u+v)=F(u)+F(v),\quad F(\lambda v)=\lambda F(v)`,c:OKC} :
      (F.why==='origen' ? {t:String.raw`F(0)\neq 0:\ \text{el origen se mueve; no es lineal}`,c:KER} : {t:String.raw`F(u+v)\neq F(u)+F(v):\ \text{la cuadrícula se curva; no es lineal}`,c:KER}),
      {t: F.lin?String.raw`\text{rectas}\to\text{rectas},\ \ \text{paralelas}\to\text{paralelas},\ \ 0\mapsto 0`:String.raw`\text{no conserva la estructura}`,c:'#7a7873'}]);
  });
  build();
})();

/* =====================================================================
   3. NÚCLEO E IMAGEN (3D)
   ===================================================================== */
(function(){
  const K=makeKit(document.getElementById('ker-cv')), bar=makeBar('ker-bar'), V=twoCubes(K);
  const n=V3.unit([0.6,-0.5,0.62]), m=V3.unit([0.3,0.85,-0.2]);
  let mode=2, dust=[], spawn=0;
  const A={3:p=>V3.mul(0.85,apply3(rotM,p)),
           2:p=>{ const q=V3.add(p,V3.mul(-V3.dot(p,n),n)); return V3.mul(0.95,apply3(rotM,q)); },
           1:p=>V3.mul(0.95*V3.dot(p,m),apply3(rotM,m))};
  function build(){ bar.innerHTML='';
    pill(bar,'Núcleo: recta','',()=>{mode=2;dust=[];build();},mode===2);
    pill(bar,'Núcleo: plano','',()=>{mode=1;dust=[];build();},mode===1);
    pill(bar,'Núcleo: solo el origen','',()=>{mode=3;dust=[];build();},mode===3); }
  K.loop((dt,t)=>{
    V.tick(dt); K.bg(); const L=3.0;
    V.cubeAt(V.P1,L); V.cubeAt(V.P2,L); V.bridge(t);
    const f=A[mode], [a,b]=V.planeBasis(n);
    // núcleo (rojo) en el primer espacio
    if(mode===2) V.lineAt(V.P1,n,L*1.05,KER,1);
    if(mode===1){ const [p,q]=V.planeBasis(m); V.sheetAt(V.P1,p,q,2.6,KER,.12,.8); }
    // imagen (azul) en el segundo
    if(mode===2){ const ia=V3.unit(f(a)), ib0=f(b), ib=V3.unit(V3.add(ib0,V3.mul(-V3.dot(ib0,ia),ia))); V.sheetAt(V.P2,ia,ib,2.6,IMC,.14,.85); }
    if(mode===1) V.lineAt(V.P2,f(m),L*1.05,IMC,1);
    if(mode===3) V.solidAt(V.P2,L,IMC,1);
    // vectores que cruzan el puente
    spawn-=dt; if(spawn<=0){ spawn=0.22;
      let p, inK=Math.random()<0.45 && mode!==3;
      if(inK) p = mode===2 ? V3.mul(randN(-2.6,2.6),n) : (()=>{ const [pp,qq]=V.planeBasis(m); return V3.add(V3.mul(randN(-2.4,2.4),pp),V3.mul(randN(-2.4,2.4),qq)); })();
      else p=[randN(-2.6,2.6),randN(-2.6,2.6),randN(-2.6,2.6)];
      dust.push({p,q:f(p),k:inK,a:0}); }
    dust.forEach(d=>d.a+=dt/2.6); dust=dust.filter(d=>d.a<1);
    dust.forEach(d=>{ const s=easeN(clampN((d.a-0.15)/0.55,0,1)), A1=V.P1(d.p), A2=V.P2(d.q), col=d.k?KER:IMC;
      const pos=[lerpN(A1[0],A2[0],s), lerpN(A1[1],A2[1],s)-Math.sin(Math.PI*s)*K.H*0.12];
      const al=Math.min(1,d.a*8)*(d.a>0.85?(1-d.a)/0.15:1);
      if(s<=0) K.dot(A1,3.4*K.k,col,al); else K.dot(pos,3.4*K.k,col,al);
      if(s>=1 && d.k) K.ring(V.P2([0,0,0]),(1-(d.a-0.7)/0.3)*14*K.k,KER,al*.6,1.5); });
    K.origin(V.P1([0,0,0]),t,GOLD); K.origin(V.P2([0,0,0]),t,TEAL);
    cap(K,[{t:String.raw`\operatorname{Ker}F=\{\,v\in V\mid F(v)=0\,\}\ \ \text{(rojo: van al origen)}`,c:KER},
           {t:String.raw`\operatorname{Im}F=\{\,F(v)\mid v\in V\,\}\ \ \text{(azul: lo que se refleja)}`,c:IMC},
           {t:String.raw`\text{ambos son subespacios: pasan por el origen}`,c:'#7a7873'}]);
  });
  build();
})();

/* =====================================================================
   4. FÓRMULA DE LAS DIMENSIONES
   ===================================================================== */
(function(){
  const K=makeKit(document.getElementById('dimf-cv')), bar=makeBar('dimf-bar'), V=twoCubes(K);
  const Bs=[[2.2,0.4,0.3],[-0.4,2.1,0.4],[0.3,0.2,2.2]];
  let r=2, st=0;
  function build(){ bar.innerHTML=''; [3,2,1,0].forEach(k=>pill(bar,'rg F = '+k,'',()=>{r=k;st=0;build();},r===k)); pill(bar,'▶','repetir',()=>{st=0;}); }
  K.loop((dt,t)=>{
    V.tick(dt); K.bg(); st+=dt; const L=3.0, kdim=3-r;
    V.cubeAt(V.P1,L); V.cubeAt(V.P2,L); V.bridge(t);
    const O1=V.P1([0,0,0]), O2=V.P2([0,0,0]), img=Bs.map(b=>V3.mul(0.95,apply3(rotM,b)));
    // en V: una base adaptada; las primeras 3−r flechas forman una base del núcleo
    Bs.forEach((b,i)=>K.arrow(O1,V.P1(b),i<kdim?KER:IMC,1,5.5*K.k+1,'#fff'));
    if(kdim===1) V.lineAt(V.P1,Bs[0],L,KER,.8);
    if(kdim===2) V.sheetAt(V.P1,V3.unit(Bs[0]),V3.unit(Bs[1]),2.6,KER,.1,.7);
    if(kdim===3) V.solidAt(V.P1,L,KER,.8);
    // cruzan el puente: las del núcleo se apagan en el origen; las demás generan la imagen
    const s=easeN(clampN((st-0.6)/1.6,0,1));
    Bs.forEach((b,i)=>{ const inK=i<kdim, tip=inK?[0,0,0]:img[i];
      if(s<1){ const A1=V.P1(b), A2=V.P2(tip), pos=[lerpN(A1[0],A2[0],s),lerpN(A1[1],A2[1],s)-Math.sin(Math.PI*s)*K.H*0.1];
        if(s>0) K.dot(pos,5*K.k,inK?KER:IMC,1); }
      else{ if(inK) K.ring(O2,(10+6*Math.sin(t*4+i))*K.k,KER,.8,2); else K.arrow(O2,V.P2(img[i]),IMC,1,5.5*K.k+1,'#fff'); } });
    if(s>=1){ const sv=img.slice(kdim);
      if(sv.length===1) V.lineAt(V.P2,sv[0],L,IMC,.9);
      if(sv.length===2){ const ia=V3.unit(sv[0]), ib=V3.unit(V3.add(sv[1],V3.mul(-V3.dot(sv[1],ia),ia))); V.sheetAt(V.P2,ia,ib,2.6,IMC,.12,.8); }
      if(sv.length===3) V.solidAt(V.P2,L,IMC,.9); }
    K.origin(O1,t,GOLD); K.origin(O2,t,TEAL);
    // casillas: cada dimensión de V acaba en el núcleo (roja) o en la imagen (azul)
    const cx=K.W/2, cy=K.H*0.88, R=13*K.k;
    for(let i=0;i<3;i++){ const x=cx+(i-1)*R*3; K.ctx.save(); K.ctx.fillStyle=i<kdim?KER:IMC; K.ctx.globalAlpha=s>=1?1:.3; K.ctx.beginPath(); K.ctx.arc(x,cy,R,0,7); K.ctx.fill(); K.ctx.restore(); }
    cap(K,[String.raw`\dim V=\dim\operatorname{Ker}F+\dim\operatorname{Im}F`, {t:String.raw`3=`+kdim+String.raw`+`+r+String.raw`\qquad(\dim\operatorname{Im}F=\operatorname{rg}F)`,c:'#9a6d00'},
           {t:String.raw`\text{rojas: se apagan en el origen}\quad\text{azules: generan la imagen}`,c:'#7a7873'}]);
  });
  build();
})();

/* =====================================================================
   5. OPERACIONES
   ===================================================================== */
(function(){
  const K=makeKit(document.getElementById('ops-cv')), bar=makeBar('ops-bar');
  let mode='suma', W2=rowWorlds(K,2,4), W3=rowWorlds(K,3,4), ang=0.5;
  K.onfit=()=>{ W2.fit(); W3.fit(); };
  const F=[[1,0.45],[0.2,0.75]], G=(()=>{ const a=1.05, c=0.8; return [[c*Math.cos(a),-c*Math.sin(a)],[c*Math.sin(a),c*Math.cos(a)]]; })();
  function build(){ bar.innerHTML='';
    pill(bar,'Suma  F + G','',()=>{mode='suma';build();},mode==='suma');
    pill(bar,'Por un número  λF','',()=>{mode='esc';build();},mode==='esc');
    pill(bar,'Composición  G ∘ F','',()=>{mode='comp';build();},mode==='comp'); }
  K.loop((dt,t)=>{
    K.bg(); ang+=dt*0.25; const v=[2.2*Math.cos(ang),2.2*Math.sin(ang)];
    if(mode!=='comp'){
      const W=W2; W.disk(0,GOLD); W.disk(1,TEAL); W.grid(0,null,.6); W.grid(1,null,.6);
      W.bridge(0,t, mode==='suma'?'F, G':'λF');
      const O1=W.P(0,[0,0]), O2=W.P(1,[0,0]); K.arrow(O1,W.P(0,v),VC,1,5.5*K.k+1,'#fff'); tipTag(K,O1,W.P(0,v),'v',VC);
      const ctx=K.ctx; ctx.save(); W.clip(1);
      if(mode==='suma'){ const a=appM(F,v), b=appM(G,v), s=V2.add(a,b);
        K.dash(W.P(1,a),W.P(1,s),'#7a8796',.6,1.4,[4,4]); K.dash(W.P(1,b),W.P(1,s),'#7a8796',.6,1.4,[4,4]);
        K.arrow(O2,W.P(1,a),OR,1,5*K.k+1,'#fff'); K.arrow(O2,W.P(1,b),BL,1,5*K.k+1,'#fff'); K.arrow(O2,W.P(1,s),'#9a6d00',1,5.5*K.k+1,'#fff');
        ctx.restore(); tipTag(K,O2,W.P(1,a),'F(v)',OR); tipTag(K,O2,W.P(1,b),'G(v)',BL); tipTag(K,O2,W.P(1,s),'(F+G)(v)','#9a6d00');
        cap(K,[String.raw`(F+G)(v)=F(v)+G(v)`,{t:String.raw`\text{las imágenes se suman con el paralelogramo}`,c:'#7a7873'}]); }
      else { const lam=0.25+1.5*(0.5+0.5*Math.sin(t*0.8)), a=appM(F,v), s=V2.mul(lam,a);
        K.arrow(O2,W.P(1,a),OR,.35,4*K.k,null); K.arrow(O2,W.P(1,s),'#9a6d00',1,5.5*K.k+1,'#fff'); ctx.restore();
        tipTag(K,O2,W.P(1,s),'λF(v)','#9a6d00');
        cap(K,[String.raw`(\lambda F)(v)=\lambda\,F(v)`,{t:String.raw`\lambda=`+lam.toFixed(2),c:'#9a6d00'}]); }
      K.origin(O1,t,GOLD); K.origin(O2,t,TEAL);
    } else {
      const W=W3; [GOLD,TEAL,VIO].forEach((c,i)=>W.disk(i,c));
      W.grid(0,null,.6); W.grid(1,p=>appM(F,p),.6); W.grid(2,p=>appM(G,appM(F,p)),.6);
      W.bridge(0,t,'F'); W.bridge(1,t,'G');
      const a=appM(F,v), b=appM(G,a), Os=[0,1,2].map(i=>W.P(i,[0,0]));
      K.arrow(Os[0],W.P(0,v),VC,1,5*K.k+1,'#fff'); K.arrow(Os[1],W.P(1,a),OR,1,5*K.k+1,'#fff'); K.arrow(Os[2],W.P(2,b),'#9a6d00',1,5.5*K.k+1,'#fff');
      tipTag(K,Os[0],W.P(0,v),'v',VC); tipTag(K,Os[1],W.P(1,a),'F(v)',OR); tipTag(K,Os[2],W.P(2,b),'G(F(v))','#9a6d00');
      // un mensajero recorre los dos puentes
      const q=(t%4)/4, A=W.P(0,v), Bp=W.P(1,a), Cp=W.P(2,b);
      const pos = q<0.5 ? [lerpN(A[0],Bp[0],easeN(q*2)), lerpN(A[1],Bp[1],easeN(q*2))-Math.sin(Math.PI*q*2)*K.H*0.12]
                        : [lerpN(Bp[0],Cp[0],easeN(q*2-1)), lerpN(Bp[1],Cp[1],easeN(q*2-1))-Math.sin(Math.PI*(q*2-1))*K.H*0.12];
      K.dot(pos,5*K.k,'#9a6d00',.9);
      Os.forEach((o,i)=>K.origin(o,t,ORC[i]));
      cap(K,[String.raw`(G\circ F)(v)=G\big(F(v)\big)`,{t:String.raw`\text{primero se cruza el puente } F\text{, después el puente } G`,c:'#7a7873'}]);
    }
  });
  build();
})();

/* =====================================================================
   7. LA MATRIZ TRADUCE
   ===================================================================== */
(function(){
  const K=makeKit(document.getElementById('tra-cv')), bar=makeBar('tra-bar');
  const Gm=[[0.85,-0.55],[0.45,0.6]], E=[[1.6,0.35],[-0.5,1.35]], Fb=[[1.45,-0.2],[0.45,1.45]], HE=[22,205], HF=[140,300];
  let v=[2.1,1.3], drag=false, L={}, ph=0;
  K.onfit=()=>{ const top=K.H*0.64, gap=K.W*0.12, rw=(K.W-36-gap)/2;
    L.r1={x:12,y:12,w:rw,h:top-18}; L.r2={x:12+rw+gap,y:12,w:rw,h:top-18};
    L.S=Math.min(rw/8.5,(top-18)/6.2); K.k=clampN(L.S/34,.6,1.2);
    L.C1=[L.r1.x+L.r1.w/2,L.r1.y+L.r1.h/2]; L.C2=[L.r2.x+L.r2.w/2,L.r2.y+L.r2.h/2]; L.band=top; };
  const P1=p=>[L.C1[0]+p[0]*L.S,L.C1[1]-p[1]*L.S], P2=p=>[L.C2[0]+p[0]*L.S,L.C2[1]-p[1]*L.S];
  const M=[0,1].map(j=>solve2v(Fb[0],Fb[1],appM(Gm,E[j]))); const MM=[[M[0][0],M[1][0]],[M[0][1],M[1][1]]];
  function rr(r){ const ctx=K.ctx; ctx.beginPath(); ctx.roundRect(r.x,r.y,r.w,r.h,14); }
  function lattice(Pf,r,b1,b2,h1,h2){ const ctx=K.ctx; ctx.save(); rr(r); ctx.clip();
    [[b1,b2,h1],[b2,b1,h2]].forEach(([base,dir,h])=>{ const dn=V2.mul(1/V2.len(dir),dir);
      for(let k=-12;k<=12;k++){ const p0=V2.mul(k,base), a=Pf(V2.add(p0,V2.mul(-20,dn))), b=Pf(V2.add(p0,V2.mul(20,dn)));
        ctx.globalAlpha=k===0?.5:.2; ctx.strokeStyle=hcol(h); ctx.lineWidth=k===0?2:1; ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke(); } });
    ctx.restore(); }
  K.cv.addEventListener('pointerdown',e=>{ const p=K.ptr(e), r=L.r1; if(p[0]>r.x&&p[0]<r.x+r.w&&p[1]>r.y&&p[1]<r.y+r.h){ drag=true; K.cv.setPointerCapture(e.pointerId); mv(p);} });
  function mv(p){ const q=[(p[0]-L.C1[0])/L.S,(L.C1[1]-p[1])/L.S]; v=[clampN(q[0],-3.6,3.6),clampN(q[1],-2.7,2.7)]; ph=0; }
  K.cv.addEventListener('pointermove',e=>{ if(drag) mv(K.ptr(e)); }); K.cv.addEventListener('pointerup',()=>{drag=false;});
  K.loop((dt,t)=>{
    K.bg(); ph+=dt; const ctx=K.ctx;
    [[L.r1,GOLD],[L.r2,TEAL]].forEach(([r,c])=>{ ctx.save(); rr(r); ctx.fillStyle=hexA(c,.05); ctx.fill(); ctx.strokeStyle='#9aa7b6'; ctx.lineWidth=1.4; ctx.stroke(); ctx.restore(); });
    lattice(P1,L.r1,E[0],E[1],HE[0],HE[1]); lattice(P2,L.r2,Fb[0],Fb[1],HF[0],HF[1]);
    // puente
    const a=[L.r1.x+L.r1.w+10,L.C1[1]], b=[L.r2.x-10,L.C2[1]]; K.arrow(a,b,CSSV('--tema'),.9,12*K.k,null); txt(K,(a[0]+b[0])/2,a[1]-26*K.k,'F',22,'#503050');
    const cv=solve2v(E[0],E[1],v), Fv=appM(Gm,v), cw=solve2v(Fb[0],Fb[1],Fv), O1=P1([0,0]), O2=P2([0,0]);
    ctx.save(); rr(L.r1); ctx.clip();
    for(let j=0;j<2;j++) K.arrow(O1,P1(E[j]),hcol(HE[j]),1,5*K.k+1,null);
    K.dash(O1,P1(V2.mul(cv[0],E[0])),hcol(HE[0]),.8,2,[4,4]); K.dash(P1(V2.mul(cv[0],E[0])),P1(v),hcol(HE[1]),.8,2,[4,4]);
    K.arrow(O1,P1(v),VC,1,6*K.k+1,'#fff'); ctx.restore();
    ctx.save(); rr(L.r2); ctx.clip();
    for(let j=0;j<2;j++) K.arrow(O2,P2(Fb[j]),hcol(HF[j]),1,5*K.k+1,null);
    K.dash(O2,P2(V2.mul(cw[0],Fb[0])),hcol(HF[0]),.8,2,[4,4]); K.dash(P2(V2.mul(cw[0],Fb[0])),P2(Fv),hcol(HF[1]),.8,2,[4,4]);
    K.arrow(O2,P2(Fv),'#9a6d00',1,6*K.k+1,'#fff'); ctx.restore();
    K.origin(O1,t,GOLD); K.origin(O2,t,TEAL); tipTag(K,O1,P1(v),'v',VC); tipTag(K,O2,P2(Fv),'F(v)','#9a6d00');
    // la traducción: M · [v]_{B1} = [F(v)]_{B2}
    const cs=clampN((K.H-L.band)*0.3,26,52), cy=L.band+(K.H-L.band)*0.55, cx=K.W/2;
    const g=k=>{ const q=(ph%5)/5; return Math.max(0,1-Math.abs(q-k)*4); };
    numMat(K,cx-cs*2.6,cy,MM,cs,g(0.35),[hcol(HE[0],42),hcol(HE[1],42)]);
    numCol(K,cx-cs*0.3,cy,cv,[hcol(HE[0],42),hcol(HE[1],42)],cs,g(0.15));
    txt(K,cx+cs*0.85,cy,'=',cs*0.5/K.k,'#20201e');
    numCol(K,cx+cs*2.0,cy,cw,[hcol(HF[0],38),hcol(HF[1],38)],cs,g(0.6));
    txt(K,cx-cs*2.6,cy+cs*1.45,'M',16,'#503050'); txt(K,cx-cs*0.3,cy+cs*1.45,'[v] en B₁',15,'#503050'); txt(K,cx+cs*2.0,cy+cs*1.45,'[F(v)] en B₂',15,'#503050');
    cap(K,[String.raw`M_{B_1,B_2}(F)\cdot[v]_{B_1}=[F(v)]_{B_2}`,{t:String.raw`\text{la matriz traduce las coordenadas de } v \text{ en las de } F(v)`,c:'#7a7873'}]);
  });
  bar.innerHTML=''; pill(bar,'⟲','',()=>{v=[2.1,1.3];ph=0;});
})();

/* =====================================================================
   8. CAMBIO DE BASE
   ===================================================================== */
(function(){
  const K=makeKit(document.getElementById('cbb-cv')), bar=makeBar('cbb-bar');
  const A=[[2,1],[1,-1]]; // F(x,y) = (2x + y, x − y)
  const l1=(1+Math.sqrt(13))/2, l2=(1-Math.sqrt(13))/2, e1=V2.mul(1.3/Math.hypot(1,l1-2),[1,l1-2]), e2=V2.mul(1.3/Math.hypot(1,l2-2),[1,l2-2]);
  const BASES=[{b:[[1,0],[0,1]],name:'Base canónica',tex:String.raw`B_c`},{b:[[1,1],[0,1]],name:'Otra base B′',tex:String.raw`B'`},{b:[e1,e2],name:'Base de vectores propios',tex:String.raw`B''`}];
  let idx=0, cur=BASES[0].b.map(x=>x.slice()), v=[1.2,0.8], drag=false, L={};
  K.onfit=()=>{ const pw=Math.max(220,Math.min(330,K.W*0.3)); L.r={x:12,y:12,w:K.W-24-pw-12,h:K.H-24}; L.S=Math.min(L.r.w/9,L.r.h/7); K.k=clampN(L.S/40,.6,1.2);
    L.C=[L.r.x+L.r.w/2,L.r.y+L.r.h*0.55]; L.px=L.r.x+L.r.w+12+pw/2; };
  const P=p=>[L.C[0]+p[0]*L.S,L.C[1]-p[1]*L.S];
  function build(){ bar.innerHTML=''; BASES.forEach((B,i)=>pill(bar,B.name,'',()=>{idx=i;build();},idx===i)); }
  K.cv.addEventListener('pointerdown',e=>{ const p=K.ptr(e); if(p[0]<L.r.x+L.r.w){ drag=true; K.cv.setPointerCapture(e.pointerId); mv(p);} });
  function mv(p){ const q=[(p[0]-L.C[0])/L.S,(L.C[1]-p[1])/L.S]; v=[clampN(q[0],-2.2,2.2),clampN(q[1],-2.2,2.2)]; }
  K.cv.addEventListener('pointermove',e=>{ if(drag) mv(K.ptr(e)); }); K.cv.addEventListener('pointerup',()=>{drag=false;});
  K.loop((dt,t)=>{
    K.bg(); const ctx=K.ctx, T=BASES[idx].b, k=Math.min(1,dt*3);
    for(let i=0;i<2;i++) for(let j=0;j<2;j++) cur[i][j]+=(T[i][j]-cur[i][j])*k;
    ctx.save(); ctx.beginPath(); ctx.roundRect(L.r.x,L.r.y,L.r.w,L.r.h,14); ctx.fillStyle=hexA(GOLD,.04); ctx.fill(); ctx.strokeStyle='#9aa7b6'; ctx.lineWidth=1.4; ctx.stroke(); ctx.clip();
    // retícula de la base actual (el punto de vista)
    [[cur[0],cur[1],22],[cur[1],cur[0],205]].forEach(([base,dir,h])=>{ const dn=V2.mul(1/V2.len(dir),dir);
      for(let kk=-14;kk<=14;kk++){ const p0=V2.mul(kk,base), a=P(V2.add(p0,V2.mul(-20,dn))), b=P(V2.add(p0,V2.mul(20,dn)));
        ctx.globalAlpha=kk===0?.5:.18; ctx.strokeStyle=hcol(h); ctx.lineWidth=kk===0?2:1; ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke(); } });
    ctx.globalAlpha=1; const O=P([0,0]);
    // la base y sus imágenes: con vectores propios, F solo los estira
    for(let j=0;j<2;j++){ const Fb=appM(A,cur[j]); K.dash(O,P(Fb),hcol(j?205:22),.7,2.2,[5,4]); K.arrow(O,P(cur[j]),hcol(j?205:22),1,5.5*K.k+1,null); }
    const Fv=appM(A,v); K.arrow(O,P(v),VC,1,6*K.k+1,'#fff'); K.arrow(O,P(Fv),'#9a6d00',1,6*K.k+1,'#fff');
    ctx.restore(); K.origin(O,t,GOLD); tipTag(K,O,P(v),'v',VC); tipTag(K,O,P(Fv),'F(v)','#9a6d00');
    // la matriz de F vista desde esta base: M' = P^{-1} M P
    const Pm=[[cur[0][0],cur[1][0]],[cur[0][1],cur[1][1]]], d=Pm[0][0]*Pm[1][1]-Pm[0][1]*Pm[1][0], Pi=[[Pm[1][1]/d,-Pm[0][1]/d],[-Pm[1][0]/d,Pm[0][0]/d]];
    const mul=(X,Y)=>[[X[0][0]*Y[0][0]+X[0][1]*Y[1][0],X[0][0]*Y[0][1]+X[0][1]*Y[1][1]],[X[1][0]*Y[0][0]+X[1][1]*Y[1][0],X[1][0]*Y[0][1]+X[1][1]*Y[1][1]]];
    const Mp=mul(Pi,mul(A,Pm)), cs=clampN(K.H*0.09,26,46), diag=Math.abs(Mp[0][1])<0.02&&Math.abs(Mp[1][0])<0.02;
    txt(K,L.px,K.H*0.62-cs*1.55,'matriz de F en esta base',15,'#503050');
    numMat(K,L.px,K.H*0.62,Mp,cs,diag?0.6+0.4*Math.sin(t*4):0);
    if(diag) txt(K,L.px,K.H*0.62+cs*1.5,'¡diagonal!',17,OKC);
    cap(K,[String.raw`F(x,y)=(2x+y,\ x-y)`,String.raw`M'=P^{-1}\,M\,P`,{t:String.raw`P:\ \text{columnas} = \text{vectores de la nueva base}`,c:'#7a7873'},
           {t: idx===0?String.raw`\text{desde }B_c:\ M=\begin{pmatrix}2&1\\1&-1\end{pmatrix}`:(idx===1?String.raw`\text{desde }B'=\{(1,1),(0,1)\}`:String.raw`\text{desde los vectores propios: } F \text{ solo estira}`),c: idx===2?OKC:'#9a6d00'}]);
  });
  build();
})();
</script>
<script>
