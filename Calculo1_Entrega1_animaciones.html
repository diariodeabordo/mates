<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tema 6 · Cálculo de una variable</title>
<style>
  :root{
    --tema:#3C8C64; --temaD:#2E6E4E; --temaL:#E6F1EB;
    --rojo:#C81E1E; --ink:#2b2b2b; --gris:#9AA3A0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:#fff;color:var(--ink);
    font-family:"Latin Modern Sans","CMU Sans Serif","Helvetica Neue",Arial,sans-serif}
  header{background:var(--tema);color:#fff;text-align:center;padding:10px 12px 0}
  header h1{margin:0 0 8px;font-weight:400;font-size:22px;letter-spacing:.3px}
  header h1 b{font-weight:700}
  nav{display:flex;justify-content:center;flex-wrap:wrap;gap:2px}
  nav button{background:transparent;border:0;color:#e9f4ee;font:inherit;font-size:15px;
    padding:8px 14px 9px;border-radius:8px 8px 0 0;cursor:pointer;opacity:.85}
  nav button:hover{opacity:1}
  nav button.on{background:#fff;color:var(--temaD);opacity:1;font-weight:700}
  main{max-width:1120px;margin:0 auto;padding:10px 14px 10px}
  #wrap{position:relative;width:min(100%, calc((100vh - 210px) * 16 / 9));margin:0 auto;aspect-ratio:16/9;border:1px solid #e3ebe6;border-radius:10px;overflow:hidden;background:#fff}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  .bar{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:10px;min-height:34px}
  .bar > div{row-gap:6px}
  .bar button{font:inherit;font-size:15px;background:#fff;color:var(--temaD);
    border:1.5px solid var(--tema);border-radius:999px;padding:6px 16px;cursor:pointer}
  .bar button:hover{background:var(--temaL)}
  .bar button.on{background:var(--tema);color:#fff}
  .bar .sep{width:18px}
  #texlayer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .tx{position:absolute;white-space:nowrap;font-size:21px;line-height:1;color:#503050}
  .tx.bg{background:rgba(255,255,255,.92);padding:3px 6px;border-radius:6px}
  .tx mjx-container{margin:0!important} .tx mjx-assistive-mml{display:none!important}
</style>
<script>window.MathJax={tex:{},svg:{fontCache:'local'},options:{enableAssistiveMml:false},startup:{typeset:false}};</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
</head>
<body>
<header>
  <h1>Tema 6. <b>Cálculo de una variable</b></h1>
  <nav id="tabs"></nav>
</header>
<main>
  <div id="wrap"><canvas id="cv"></canvas><div id="texlayer"></div></div>
  <div class="bar" id="bar"></div>
</main>

<script>
/* ============================================================
   Utilidades comunes
   ============================================================ */
const COL = {tema:'#3C8C64', temaD:'#2E6E4E', rojo:'#C81E1E', ok:'#1E963C',
             eje:'#A7AFAB', f:'#EE8A00', g:'#4F7FD0', sol:'#E1B400', fant:'#EE8A00'};
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W=0, H=0, DPR=1;
function resize(){
  const r = cv.getBoundingClientRect(); DPR = window.devicePixelRatio||1;
  W = r.width; H = r.height; cv.width = W*DPR; cv.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);

// vista: centro (cx,cy) y semiancho en unidades del mundo
let V = {cx:0, cy:0, half:6};
const U  = () => W/(2*V.half);
const sx = x => W/2 + (x-V.cx)*U();
const sy = y => H/2 - (y-V.cy)*U();
const wx = px => (px-W/2)/U()+V.cx;
const wy = py => -(py-H/2)/U()+V.cy;
const yTop = () => wy(0), yBot = () => wy(H);
const xL = () => wx(0), xR = () => wx(W);
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;

function clear(){ ctx.clearRect(0,0,W,H); }
function arrowHead(x,y,ang,len=8,color=COL.eje){
  ctx.save(); ctx.fillStyle=color; ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-len,-len*0.45); ctx.lineTo(-len,len*0.45); ctx.closePath(); ctx.fill(); ctx.restore();
}
function axes(){
  ctx.strokeStyle=COL.eje; ctx.lineWidth=1.2;
  const x0=sx(0), y0=sy(0);
  ctx.beginPath(); ctx.moveTo(6,y0); ctx.lineTo(W-6,y0); ctx.stroke(); arrowHead(W-6,y0,0);
  ctx.beginPath(); ctx.moveTo(x0,H-6); ctx.lineTo(x0,6); ctx.stroke(); arrowHead(x0,6,-Math.PI/2);
}
function poly(pts, color, lw=3, dash=null, alpha=1){
  if(pts.length<2) return;
  ctx.save(); ctx.globalAlpha=alpha; ctx.strokeStyle=color; ctx.lineWidth=lw;
  ctx.lineCap='round'; ctx.lineJoin='round'; if(dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(sx(pts[0][0]),sy(pts[0][1]));
  for(let i=1;i<pts.length;i++) ctx.lineTo(sx(pts[i][0]),sy(pts[i][1]));
  ctx.stroke(); ctx.restore();
}
// dibuja y=f(x) partiendo la curva donde no está definida o se dispara
function plotF(f, a, b, color, lw=3, opt={}){
  const n = opt.n||700, lim = opt.lim||(V.half*0.62);
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=lw; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.globalAlpha = opt.alpha??1; if(opt.dash) ctx.setLineDash(opt.dash);
  if(opt.glow){ ctx.shadowColor=color; ctx.shadowBlur=opt.glow; }
  ctx.beginPath(); let pen=false, prev=null;
  for(let i=0;i<=n;i++){
    const x=a+(b-a)*i/n, y=f(x);
    const okv = Number.isFinite(y) && Math.abs(y-V.cy) < lim*1.6;
    if(okv && prev!==null && Math.abs(y-prev)>lim) pen=false;
    if(okv){ pen ? ctx.lineTo(sx(x),sy(y)) : ctx.moveTo(sx(x),sy(y)); pen=true; prev=y; }
    else { pen=false; prev=null; }
  }
  ctx.stroke(); ctx.restore();
}
function dot(x,y,color,r=5,hollow=false){
  ctx.beginPath(); ctx.arc(sx(x),sy(y),r,0,2*Math.PI);
  if(hollow){ ctx.fillStyle='#fff'; ctx.fill(); ctx.lineWidth=2; ctx.strokeStyle=color; ctx.stroke(); }
  else { ctx.fillStyle=color; ctx.fill(); }
}
function sun(px,py,r=16,phase=0){
  ctx.save(); ctx.translate(px,py);
  ctx.fillStyle='#FFF3C4'; ctx.strokeStyle=COL.sol; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.arc(0,0,r,0,2*Math.PI); ctx.fill(); ctx.stroke();
  ctx.lineCap='round';
  for(let k=0;k<8;k++){ const a=k*Math.PI/4+phase;
    ctx.beginPath(); ctx.moveTo(Math.cos(a)*(r+5),Math.sin(a)*(r+5)); ctx.lineTo(Math.cos(a)*(r+12),Math.sin(a)*(r+12)); ctx.stroke(); }
  ctx.restore();
}
function sampleCurve(f,a,b,n=400){ const p=[]; for(let i=0;i<=n;i++){const x=a+(b-a)*i/n; p.push([x,f(x)]);} return p; }


/* ---------- etiquetas en LaTeX (MathJax) sobre el lienzo ---------- */
const texLayer=document.getElementById('texlayer'), texEls={}; let texUsed={};
function texAt(id,tex,x,y,o={}){ texUsed[id]=1; let e=texEls[id];
  if(!e){ e=document.createElement('div'); e.className='tx'; texLayer.appendChild(e); texEls[id]=e; }
  e.classList.toggle('bg',!!o.bg); e.style.color=o.color||'#503050'; e.style.fontSize=(o.size||21)+'px';
  const ready=!!(window.MathJax&&MathJax.tex2svg);
  if(e.dataset.tex!==tex+ready){ e.innerHTML=''; if(ready){ try{ e.appendChild(MathJax.tex2svg(tex,{display:false})); }catch(err){} } e.dataset.tex=tex+ready; }
  const tr = o.anchor==='l' ? 'translate(0,-50%)' : (o.anchor==='r' ? 'translate(-100%,-50%)' : 'translate(-50%,-50%)');
  e.style.left=x+'px'; e.style.top=y+'px'; e.style.display='block'; let sc=1; if(o.maxw){ const w=e.offsetWidth; if(w>o.maxw) sc=o.maxw/w; } e.style.transformOrigin='0 50%'; e.style.transform=tr+(sc<1?` scale(${sc})`:''); }
function texFrame(){ for(const id in texEls) if(!texUsed[id]) texEls[id].style.display='none'; texUsed={}; }

/* ---------- barra de botones ---------- */
const bar = document.getElementById('bar');
function buttons(list){
  bar.innerHTML='';
  list.forEach(it=>{
    if(it==='|'){ const s=document.createElement('span'); s.className='sep'; bar.appendChild(s); return; }
    const b=document.createElement('button'); b.textContent=it.t; if(it.on) b.classList.add('on');
    b.onclick=()=>{ if(it.group){ [...bar.querySelectorAll('button')].forEach(o=>{ if(o.dataset.g===it.group) o.classList.remove('on'); }); b.classList.add('on'); } it.f(b); };
    if(it.group) b.dataset.g=it.group;
    bar.appendChild(b);
  });
}
/* ---------- puntero ---------- */
let ptr = {down:false, x:0, y:0};
function evPos(e){ const r=cv.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; }
cv.addEventListener('pointerdown', e=>{ cv.setPointerCapture(e.pointerId); const [x,y]=evPos(e); ptr={down:true,x,y}; cur.down&&cur.down(x,y); });
cv.addEventListener('pointermove', e=>{ const [x,y]=evPos(e); ptr.x=x; ptr.y=y; cur.move&&cur.move(x,y,ptr.down); });
cv.addEventListener('pointerup',   e=>{ ptr.down=false; cur.up&&cur.up(); });

/* ============================================================
   1. La regla de la vertical
   ============================================================ */
const T1 = (()=>{
  const heartP=[],moonP=[],circP=[];
  for(let i=0;i<=240;i++){ const t=i/240*2*Math.PI, k=0.17;
    heartP.push([k*16*Math.sin(t)**3, 0.35+k*(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))]); }
  const R=2.5, d=0.4/0.65*R, r=0.568/0.65*R;
  for(let a=60;a<=300;a+=2){ const t=a*Math.PI/180; moonP.push([R*Math.cos(t),R*Math.sin(t)]); }
  for(let a=262.4;a>=97.6;a-=2){ const t=a*Math.PI/180; moonP.push([d+r*Math.cos(t),r*Math.sin(t)]); }
  moonP.push(moonP[0].slice());
  for(let i=0;i<=200;i++){ const t=i/200*2*Math.PI; circP.push([2.5*Math.cos(t),2.5*Math.sin(t)]); }
  const shapes = {
    ola:      sampleCurve(x=>1.3*Math.sin(1.1*x),-5.3,5.3,300),
    colinas:  sampleCurve(x=>-1.6+1.9*Math.exp(-((x+1.6)**2)/1.6)+1.2*Math.exp(-((x-2.4)**2)/1.2)+0.25*Math.sin(1.7*x),-5.5,5.5,300),
    corazon:  heartP, luna: moonP, circ: circP,
    saliente: [[-4.6,-2.6],[-3.0,-0.6],[-1.4,1.7],[2.3,2.3],[0.3,1.1],[1.5,-0.4],[4.6,-2.6]],
    tuyo: []
  };
  let s = {shape:'ola', x:-5, dir:1, drag:false, drawing:false, hold:0};
  function cuts(pts,x){
    const out=[];
    for(let i=0;i<pts.length-1;i++){ const [x0,y0]=pts[i],[x1,y1]=pts[i+1];
      if((x0<=x && x<x1)||(x1<=x && x<x0)){ const t=(x-x0)/(x1-x0); out.push(lerp(y0,y1,t)); } }
    out.sort((a,b)=>a-b); const ded=[]; out.forEach(y=>{ if(!ded.length||Math.abs(y-ded[ded.length-1])>0.04) ded.push(y); });
    return ded;
  }
  return {
    enter(){ V={cx:0,cy:0,half:6}; s.x=-5.6; s.dir=1;
      buttons([
        {t:'Ola',group:'s',on:s.shape==='ola',f:()=>{s.shape='ola';s.drawing=false;}},
        {t:'Colinas',group:'s',on:s.shape==='colinas',f:()=>{s.shape='colinas';s.drawing=false;}},
        {t:'Corazón',group:'s',on:s.shape==='corazon',f:()=>{s.shape='corazon';s.drawing=false;}},
        {t:'Luna',group:'s',on:s.shape==='luna',f:()=>{s.shape='luna';s.drawing=false;}},
        {t:'Circunferencia',group:'s',on:s.shape==='circ',f:()=>{s.shape='circ';s.drawing=false;}},
        {t:'Saliente',group:'s',on:s.shape==='saliente',f:()=>{s.shape='saliente';s.drawing=false;}},
        '|',
        {t:'✎ Dibuja tú',group:'s',on:s.shape==='tuyo',f:()=>{s.shape='tuyo';shapes.tuyo=[];s.drawing=true;}}
      ]);
    },
    down(px,py){ if(s.shape==='tuyo'){ shapes.tuyo=[[wx(px),wy(py)]]; s.drawing=true; } else { s.drag=true; s.x=wx(px);} },
    move(px,py,d){ if(!d) return;
      if(s.shape==='tuyo' && s.drawing){ const p=[wx(px),wy(py)], L=shapes.tuyo[shapes.tuyo.length-1];
        if(!L||Math.hypot(p[0]-L[0],p[1]-L[1])>0.05) shapes.tuyo.push(p); }
      else if(s.drag) s.x=wx(px); },
    up(){ s.drag=false; },
    draw(dt){
      clear(); axes();
      const pts=shapes[s.shape];
      if(!s.drag && !(s.shape==='tuyo' && ptr.down)){
        s.x += s.dir*dt*1.6;
        if(s.x>5.7){s.x=5.7;s.dir=-1;} if(s.x<-5.7){s.x=-5.7;s.dir=1;}
      }
      poly(pts, COL.tema, 3.2);
      const c = pts.length>1 ? cuts(pts,s.x) : [];
      const col = c.length>1 ? COL.rojo : COL.ok;
      ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=2.2; ctx.setLineDash([7,6]);
      ctx.beginPath(); ctx.moveTo(sx(s.x),0); ctx.lineTo(sx(s.x),H); ctx.stroke(); ctx.restore();
      c.forEach(y=>dot(s.x,y,col,6));
    }
  };
})();

/* ============================================================
   2. Las sombras: dominio e imagen
   ============================================================ */
const T2 = (()=>{
  const fns = {
    curva: {f:x=>0.3+0.7*Math.sin(1.25*x)+0.18*x, a:-3.6, b:3.0, ends:true},
    inv:   {f:x=>x===0?NaN:1/x, a:-6, b:6},
    raiz:  {f:x=>x<0?NaN:Math.sqrt(x), a:0, b:6, ends:'left'},
    par:   {f:x=>0.45*x*x-2, a:-6, b:6}
  };
  let s={fn:'curva', mode:'arriba', t:0, hold:0, bx:null, by:null, pts:[]};
  const NB=480;
  function prep(){
    const F=fns[s.fn]; s.pts=[];
    const lo=Math.max(F.a,xL()+0.05), hi=Math.min(F.b,xR()-0.05);
    for(let i=0;i<=900;i++){ const x=lo+(hi-lo)*i/900, y=F.f(x);
      if(Number.isFinite(y) && y>yBot()+0.15 && y<yTop()-0.15) s.pts.push([x,y]); }
    s.bx=new Uint8Array(NB); s.by=new Uint8Array(NB); s.t=0; s.hold=0;
  }
  function intervals(bins, lo, hi){ const out=[]; let st=-1;
    for(let i=0;i<=bins.length;i++){ const on=i<bins.length&&bins[i];
      if(on&&st<0) st=i; if(!on&&st>=0){ out.push([lo+(hi-lo)*st/bins.length, lo+(hi-lo)*i/bins.length]); st=-1; } }
    return out; }
  return {
    enter(){ V={cx:0,cy:0.2,half:6.4}; prep();
      buttons([
        {t:'Curva',group:'f',on:s.fn==='curva',f:()=>{s.fn='curva';prep();}},
        {t:'1/x',group:'f',on:s.fn==='inv',f:()=>{s.fn='inv';prep();}},
        {t:'√x',group:'f',on:s.fn==='raiz',f:()=>{s.fn='raiz';prep();}},
        {t:'Parábola',group:'f',on:s.fn==='par',f:()=>{s.fn='par';prep();}},
        '|',
        {t:'☀ arriba',group:'m',on:s.mode==='arriba',f:()=>{s.mode='arriba';prep();}},
        {t:'☀ de lado',group:'m',on:s.mode==='lado',f:()=>{s.mode='lado';prep();}},
        {t:'Ambos',group:'m',on:s.mode==='ambos',f:()=>{s.mode='ambos';prep();}}
      ]);
    },
    draw(dt, time){
      clear(); axes();
      const F=fns[s.fn], up = s.mode!=='lado', side = s.mode!=='arriba';
      plotF(F.f, Math.max(F.a,xL()), Math.min(F.b,xR()), COL.tema, 3.2);
      if(F.ends===true){ dot(F.a,F.f(F.a),COL.tema,5); dot(F.b,F.f(F.b),COL.tema,5,true); }
      if(F.ends==='left'){ dot(0,0,COL.tema,5); }
      // avance del punto
      if(s.t<1){ s.t=Math.min(1,s.t+dt/4.2); } else { s.hold+=dt; if(s.hold>2.2) prep(); }
      const n=s.pts.length, k=Math.floor(s.t*(n-1));
      const xl=xL(), xr=xR(), yb=yBot(), yt=yTop();
      const bin=(v,lo,hi)=>clamp(Math.floor((v-lo)/(hi-lo)*NB),0,NB-1);
      for(let i=0;i<=k && i<n;i++){ const [x,y]=s.pts[i];
        s.bx[bin(x,xl,xr)]=1; s.by[bin(y,yb,yt)]=1;
        if(i>0){ const [x0,y0]=s.pts[i-1];
          if(Math.abs(x-x0)<0.2 && Math.abs(y-y0)<1.5){
            for(let j=Math.min(bin(x,xl,xr),bin(x0,xl,xr)); j<=Math.max(bin(x,xl,xr),bin(x0,xl,xr)); j++) s.bx[j]=1;
            for(let j=Math.min(bin(y,yb,yt),bin(y0,yb,yt)); j<=Math.max(bin(y,yb,yt),bin(y0,yb,yt)); j++) s.by[j]=1; } } }
      ctx.save(); ctx.lineCap='butt'; ctx.strokeStyle=COL.tema; ctx.globalAlpha=0.55; ctx.lineWidth=9;
      if(up) intervals(s.bx,xl,xr).forEach(([a,b])=>{ ctx.beginPath(); ctx.moveTo(sx(a),sy(0)); ctx.lineTo(sx(b),sy(0)); ctx.stroke(); });
      if(side) intervals(s.by,yb,yt).forEach(([a,b])=>{ ctx.beginPath(); ctx.moveTo(sx(0),sy(a)); ctx.lineTo(sx(0),sy(b)); ctx.stroke(); });
      ctx.restore();
      // rayo de luz desde el punto
      if(n && s.t<1){ const [x,y]=s.pts[k];
        ctx.save(); ctx.strokeStyle=COL.sol; ctx.lineWidth=1.8; ctx.setLineDash([5,5]);
        if(up){ ctx.beginPath(); ctx.moveTo(sx(x),sy(y)); ctx.lineTo(sx(x),sy(0)); ctx.stroke(); }
        if(side){ ctx.beginPath(); ctx.moveTo(sx(x),sy(y)); ctx.lineTo(sx(0),sy(y)); ctx.stroke(); }
        ctx.restore(); dot(x,y,COL.sol,6);
      }
      if(up) sun(W*0.74, 30, 15, time*0.4);
      if(side) sun(W-34, H*0.2, 15, time*0.4);
    }
  };
})();

/* ============================================================
   3. Máquinas en cadena: composición
   ============================================================ */
const T3 = (()=>{
  const sq = {f:x=>x*x, lab:String.raw`(\;\cdot\;)^2`}, sn = {f:x=>Math.sin(x), lab:String.raw`\operatorname{sen}`};
  let s={order:0, x:2, t:0, hold:0, drag:false, toggled:false};
  const R=4.4; // rango de cada recta
  const L = () => [H*0.15, H*0.52, H*0.89];
  const px = v => W/2 + v*(W*0.38)/R;
  const vx = p => (p-W/2)*R/(W*0.38);
  function chain(o){ return o===0 ? [sn,sq] : [sq,sn]; }
  function line(y){
    ctx.strokeStyle=COL.eje; ctx.lineWidth=1.4; ctx.beginPath(); ctx.moveTo(px(-R)-10,y); ctx.lineTo(px(R)+10,y); ctx.stroke();
    arrowHead(px(R)+14,y,0);
    for(let k=-4;k<=4;k++){ ctx.beginPath(); ctx.moveTo(px(k),y-(k===0?7:4)); ctx.lineTo(px(k),y+(k===0?7:4)); ctx.stroke(); }
  }
  function machine(y,lab){
    const w=74,h=40; ctx.save(); ctx.fillStyle='#E6F1EB'; ctx.strokeStyle=COL.tema; ctx.lineWidth=2;
    ctx.beginPath(); ctx.roundRect(W/2-w/2,y-h/2,w,h,9); ctx.fill(); ctx.stroke();
    ctx.restore(); texAt('maq'+Math.round(y),lab,W/2,y,{color:COL.temaD,size:22});
  }
  function bez(p0,p1,p2,t){ return [ (1-t)*(1-t)*p0[0]+2*(1-t)*t*p1[0]+t*t*p2[0], (1-t)*(1-t)*p0[1]+2*(1-t)*t*p1[1]+t*t*p2[1] ]; }
  return {
    enter(){ s.t=0; s.hold=0;
      buttons([{t:'⇅ Cambiar el orden',f:()=>{s.order=1-s.order; s.t=0; s.hold=0; s.toggled=true;}}]); },
    down(x,y){ if(Math.abs(y-L()[0])<28){ s.drag=true; s.x=clamp(vx(x),-2.6,2.6); s.t=0; s.hold=0; } },
    move(x,y,d){ if(d&&s.drag){ s.x=clamp(vx(x),-2.6,2.6); s.t=0; s.hold=0; } },
    up(){ s.drag=false; },
    draw(dt){
      clear(); const [y1,y2,y3]=L(); const m1=(y1+y2)/2, m2=(y2+y3)/2;
      [y1,y2,y3].forEach(line);
      const [A,B]=chain(s.order), v1=s.x, v2=A.f(v1), v3=B.f(v2);
      machine(m1,A.lab); machine(m2,B.lab);
      // trayectos

        texAt('c-otro',labF(1-s.order)+String.raw`=${fx(w)}`,px(w),y3+32,{bg:true,color:COL.rojo,size:19}); }

    }
  };
})();

/* ============================================================
   4. Simetrías: par, impar, periódica
   ============================================================ */
const T4 = (()=>{
  const fns = {
    x2:  x=>x*x,
    x3:  x=>x*x*x,
    sen: x=>Math.sin(x),
    mix: x=>x*x+x,
    exp: x=>Math.exp(x)
  };
  const TP=2*Math.PI;
  let s={fn:'x2', mov:null, t:0, res:null};
  const T = {
    espejo: (x,y,t)=>[x*Math.cos(Math.PI*t), y],
    giro:   (x,y,t)=>[x*Math.cos(Math.PI*t)-y*Math.sin(Math.PI*t), x*Math.sin(Math.PI*t)+y*Math.cos(Math.PI*t)],
    deslizar:(x,y,t)=>[x+TP*t, y]
  };
  const test = {
    espejo:  f=>x=>f(-x)-f(x), giro: f=>x=>-f(-x)-f(x), deslizar: f=>x=>f(x-TP)-f(x)
  };
  function check(){ const f=fns[s.fn], g=test[s.mov](f); let m=0;
    for(let x=-5;x<=5;x+=0.05) m=Math.max(m,Math.abs(g(x))); return m<1e-6; }
  function go(m){ s.mov=m; s.t=0; s.res=null; }
  return {
    enter(){ V={cx:0,cy:0,half:6.2}; s.mov=null; s.res=null;
      buttons([
        {t:'x²',group:'f',on:s.fn==='x2',f:()=>{s.fn='x2';s.mov=null;}},
        {t:'x³',group:'f',on:s.fn==='x3',f:()=>{s.fn='x3';s.mov=null;}},
        {t:'sen x',group:'f',on:s.fn==='sen',f:()=>{s.fn='sen';s.mov=null;}},
        {t:'x² + x',group:'f',on:s.fn==='mix',f:()=>{s.fn='mix';s.mov=null;}},
        {t:'eˣ',group:'f',on:s.fn==='exp',f:()=>{s.fn='exp';s.mov=null;}},
        '|',
        {t:'↔ Espejo',f:()=>go('espejo')},
        {t:'⟲ Giro',f:()=>go('giro')},
        {t:'→ Deslizar',f:()=>go('deslizar')}
      ]); },
    draw(dt,time){
      clear(); axes(); const f=fns[s.fn];
      const glowing = s.res===true;
      plotF(f,-14,14,COL.tema,3.2,{glow: glowing ? 8+6*Math.sin(time*4) : 0});
      if(!s.mov) return;
      if(s.t<1){ s.t=Math.min(1,s.t+dt/1.8); if(s.t>=1) s.res=check(); }
      const e=ease(s.t);
      // elemento de simetría
      ctx.save(); ctx.strokeStyle=COL.f; ctx.lineWidth=2;
      if(s.mov==='espejo'){ ctx.setLineDash([6,5]); ctx.beginPath(); ctx.moveTo(sx(0),0); ctx.lineTo(sx(0),H); ctx.stroke(); }
      if(s.mov==='giro'){ ctx.beginPath(); ctx.arc(sx(0),sy(0),26,-0, -Math.PI*e, true); ctx.stroke(); dot(0,0,COL.f,4); }
      if(s.mov==='deslizar'){ const y=yTop()-0.6; ctx.beginPath(); ctx.moveTo(sx(-TP/2),sy(y)); ctx.lineTo(sx(-TP/2+TP*e),sy(y)); ctx.stroke(); if(e>0.05) arrowHead(sx(-TP/2+TP*e),sy(y),0,9,COL.f); }
      ctx.restore();
      if(s.res===true) return;
      const pts=[]; for(let x=-14;x<=14;x+=0.02){ const y=f(x); if(Math.abs(y)<9) pts.push(T[s.mov](x,y,e)); }
      poly(pts, s.res===false ? COL.rojo : COL.fant, 2.8, [8,6], s.res===false?0.75:0.9);
    }
  };
})();

/* ============================================================
   5. La regla de la horizontal: inyectividad
   ============================================================ */
const T5 = (()=>{
  const fns = {
    x2:  {f:x=>x*x, even:true},
    exp: {f:x=>Math.exp(x)},
    x3:  {f:x=>x*x*x},
    sen: {f:x=>Math.sin(x)},
    cub: {f:x=>-2*x*x*x+x+1}
  };
  let s={fn:'x2', c:0, t:0, drag:false};
  function roots(f,c){ const r=[]; const a=xL(), b=xR(), n=2400; let px=a, pv=f(a)-c;
    for(let i=1;i<=n;i++){ const x=a+(b-a)*i/n, v=f(x)-c;
      if(Number.isFinite(v)&&Number.isFinite(pv)&&(pv===0||pv*v<0)) r.push(pv===0?px:px+(x-px)*pv/(pv-v));
      px=x; pv=v; }
    return r; }
  return {
    enter(){ V={cx:0,cy:0.6,half:4.5};
      buttons([
        {t:'x²',group:'f',on:s.fn==='x2',f:()=>s.fn='x2'},
        {t:'eˣ',group:'f',on:s.fn==='exp',f:()=>s.fn='exp'},
        {t:'x³',group:'f',on:s.fn==='x3',f:()=>s.fn='x3'},
        {t:'sen x',group:'f',on:s.fn==='sen',f:()=>s.fn='sen'},
        {t:'−2x³+x+1',group:'f',on:s.fn==='cub',f:()=>s.fn='cub'}
      ]); },
    down(x,y){ s.drag=true; s.c=wy(y); }, move(x,y,d){ if(d&&s.drag) s.c=wy(y); }, up(){ s.drag=false; },
    draw(dt){
      clear(); axes(); const F=fns[s.fn];
      if(!s.drag){ s.t+=dt; s.c=0.6+2.4*Math.sin(s.t*0.6); }
      plotF(F.f,xL(),xR(),COL.tema,3.2);
      const r=roots(F.f,s.c), col=r.length>1?COL.rojo:COL.ok;
      ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=2.2; ctx.setLineDash([7,6]);
      ctx.beginPath(); ctx.moveTo(0,sy(s.c)); ctx.lineTo(W,sy(s.c)); ctx.stroke(); ctx.restore();
      if(F.even && r.length===2){
        const a=Math.abs(r[0]);
        ctx.save(); ctx.strokeStyle=COL.rojo; ctx.globalAlpha=0.6; ctx.lineWidth=1.4; ctx.setLineDash([3,4]);
        r.forEach(x=>{ ctx.beginPath(); ctx.moveTo(sx(x),sy(s.c)); ctx.lineTo(sx(x),sy(0)); ctx.stroke(); });
        ctx.setLineDash([]); ctx.lineWidth=2; ctx.beginPath();
        ctx.ellipse(sx(0),sy(0),a*U(),Math.min(40,a*U()*0.35),0,0,Math.PI); ctx.stroke(); ctx.restore();
        dot(-a,0,COL.rojo,4); dot(a,0,COL.rojo,4);
      }
      r.forEach(x=>dot(x,s.c,col,6));
    }
  };
})();

/* ============================================================
   6. El espejo de la diagonal: inversa (plegado en 3D)
   ============================================================ */
const T6 = (()=>{
  const PI=Math.PI, h=PI/2;
  const fns = {
    exp: {f:x=>Math.exp(x), a:-6.4, b:1.85, inj:true, name:String.raw`\ln x`},
    x3:  {f:x=>x*x*x, a:-1.86, b:1.86, inj:true, name:String.raw`\sqrt[3]{x}`},
    x2:  {f:x=>x*x, a:-2.5, b:2.5, cut:[0,2.5], cutLab:['0',''], name:String.raw`\sqrt{x}`, x0:2.4},
    inv: {f:x=>1/x, a:-6.4, b:6.4, inj:true, name:String.raw`\dfrac{1}{x}`},
    sen: {f:x=>Math.sin(x), a:-6.4, b:6.4, cut:[-h,h], cutLab:[String.raw`-\tfrac{\pi}{2}`,String.raw`\tfrac{\pi}{2}`], name:String.raw`\operatorname{arcsen} x`, x0:0.5},
    cos: {f:x=>Math.cos(x), a:-6.4, b:6.4, cut:[0,PI], cutLab:['0',String.raw`\pi`], name:String.raw`\arccos x`, x0:0.5},
    tan: {f:x=>Math.tan(x), a:-6.4, b:6.4, cut:[-h+0.002,h-0.002], cutLab:[String.raw`-\tfrac{\pi}{2}`,String.raw`\tfrac{\pi}{2}`], name:String.raw`\operatorname{arctg} x`, x0:1.2}
  };
  let s={fn:'exp', th:0, target:0, cut:false};
  const a=Math.SQRT1_2, D=34;
  function rot(x,y,th){ const p=(x+y)/2, q=(x-y)/2, c=Math.cos(th); return [p+q*c, p-q*c, a*(y-x)*Math.sin(th)]; }
  function proj([X,Y,Z]){ const k=D/(D-Z); return [sx(X*k), sy(Y*k)]; }
  function sample(F,lo,hi){ const pts=[], seg=[];
    for(let i=0;i<=900;i++){ const x=lo+(hi-lo)*i/900, y=F.f(x);
      if(!Number.isFinite(y)||Math.abs(y)>6.2||(F===fns.inv&&Math.abs(x)<0.16)){ if(seg.length) pts.push(seg.splice(0)); continue; }
      seg.push([x,y]); }
    if(seg.length) pts.push(seg); return pts; }
  function strokeSegs(segs,th,col,lw,alpha,dash){ segs.forEach(sg=>{ const pp=sg.map(([x,y])=>proj(rot(x,y,th)));
    ctx.save(); ctx.globalAlpha=alpha??1; ctx.strokeStyle=col; ctx.lineWidth=lw; ctx.lineCap='round'; ctx.lineJoin='round'; if(dash) ctx.setLineDash(dash);
    ctx.beginPath(); pp.forEach((p,i)=> i?ctx.lineTo(...p):ctx.moveTo(...p)); ctx.stroke(); ctx.restore(); }); }
  function label(txt,x,y,col){ ctx.save(); ctx.font='italic 20px "Latin Modern Math","STIX Two Math","Times New Roman",serif'; ctx.fillStyle=col;
    ctx.lineWidth=4; ctx.strokeStyle='#fff'; ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.strokeText(txt,x,y); ctx.fillText(txt,x,y); ctx.restore(); }
  let cutBtn=null;
  return {
    enter(){ V={cx:0,cy:0,half:6.4}; s.th=0; s.target=0;
      const set=f=>{ s.fn=f; s.th=0; s.target=0; s.cut=false; if(cutBtn){ cutBtn.classList.remove('on'); cutBtn.disabled=!fns[f].cut; } };
      buttons([
        {t:'eˣ',group:'f',on:s.fn==='exp',f:()=>set('exp')},
        {t:'x³',group:'f',on:s.fn==='x3',f:()=>set('x3')},
        {t:'x²',group:'f',on:s.fn==='x2',f:()=>set('x2')},
        {t:'1/x',group:'f',on:s.fn==='inv',f:()=>set('inv')},
        {t:'sen x',group:'f',on:s.fn==='sen',f:()=>set('sen')},
        {t:'cos x',group:'f',on:s.fn==='cos',f:()=>set('cos')},
        {t:'tg x',group:'f',on:s.fn==='tan',f:()=>set('tan')},
        '|',
        {t:'Doblar ⟷',f:()=>{ s.target = s.target>0 ? 0 : Math.PI; }},
        {t:'✂ Cortar',f:b=>{ if(fns[s.fn].cut){ s.cut=!s.cut; b.classList.toggle('on',s.cut);} }}
      ]);
      cutBtn=[...bar.querySelectorAll('button')].find(b=>b.textContent.includes('Cortar')); if(cutBtn) cutBtn.disabled=!fns[s.fn].cut; },
    draw(dt,time){
      clear();
      const sp=dt*1.6; if(Math.abs(s.target-s.th)<sp) s.th=s.target; else s.th+=Math.sign(s.target-s.th)*sp;
      const th=ease(s.th/Math.PI)*Math.PI, F=fns[s.fn], cutOn=s.cut&&F.cut, done=s.th>=Math.PI-1e-6;
      // hoja que se pliega
      const L=4.6, corners=[[-L,-L],[L,-L],[L,L],[-L,L]].map(([x,y])=>proj(rot(x,y,th)));
      ctx.save(); ctx.fillStyle = Math.cos(th)>=0 ? 'rgba(60,140,100,0.05)' : 'rgba(60,140,100,0.11)';
      ctx.strokeStyle='rgba(60,140,100,0.25)'; ctx.lineWidth=1;
      ctx.beginPath(); corners.forEach((p,i)=> i?ctx.lineTo(...p):ctx.moveTo(...p)); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
      // la franja que conservamos al cortar
      if(cutOn){ const [lo,hi]=F.cut, al=1-th/Math.PI*0.6;
        ctx.save(); ctx.globalAlpha=0.10*al+0.04; ctx.fillStyle=COL.tema; ctx.fillRect(sx(lo),0,sx(hi)-sx(lo),H); ctx.restore();
        ctx.save(); ctx.globalAlpha=al; ctx.strokeStyle=COL.tema; ctx.lineWidth=1.4; ctx.setLineDash([4,5]);
        [lo,hi].forEach(x=>{ ctx.beginPath(); ctx.moveTo(sx(x),0); ctx.lineTo(sx(x),H); ctx.stroke(); }); ctx.restore();
        F.cutLab.forEach((t,i)=>{ if(t){ ctx.save(); ctx.fillStyle=COL.tema; ctx.beginPath(); ctx.arc(sx(F.cut[i]),sy(0),5,0,7); ctx.fill(); ctx.restore();
          texAt('cut'+i,t,sx(F.cut[i]),sy(0)+30,{bg:true,color:COL.temaD,size:22}); } }); }
      axes();
      // espejo y = x
      ctx.save(); ctx.strokeStyle=COL.f; ctx.lineWidth=2; ctx.setLineDash([8,6]);
      ctx.beginPath(); ctx.moveTo(sx(-5.5),sy(-5.5)); ctx.lineTo(sx(5.5),sy(5.5)); ctx.stroke(); ctx.restore();
      const keep = cutOn ? sample(F,F.cut[0],F.cut[1]) : sample(F,F.a,F.b);
      // lo que se corta queda atrás, tenue
      if(cutOn){ strokeSegs(sample(F,F.a,F.cut[0]),0,'#b9c4be',2,0.8,[5,5]); strokeSegs(sample(F,F.cut[1],F.b),0,'#b9c4be',2,0.8,[5,5]); }
      // la original, como recuerdo, mientras se dobla
      if(s.th>0) strokeSegs(keep,0,'#c9d3ce',2.2);
      const ok = F.inj || cutOn, col = done ? (ok?COL.tema:COL.rojo) : COL.tema;
      strokeSegs(keep,th,col,3.2);
      if(done && !ok){ // el reflejo no es función: la vertical lo corta varias veces
        const x0=F.x0; ctx.save(); ctx.strokeStyle=COL.rojo; ctx.lineWidth=2; ctx.setLineDash([7,6]);
        ctx.beginPath(); ctx.moveTo(sx(x0),0); ctx.lineTo(sx(x0),H); ctx.stroke(); ctx.restore();
        keep.forEach(sg=>{ for(let i=1;i<sg.length;i++){ const [xa,ya]=sg[i-1],[xb,yb]=sg[i];
          if((ya-x0)*(yb-x0)<=0 && ya!==yb){ const xx=xa+(xb-xa)*(x0-ya)/(yb-ya); if(Math.abs(xx)<6.2) dot(x0,xx,COL.rojo,6); } } });
      }
      if(done && ok && F.name){ // nombre de la inversa que acaba de nacer
        const sg=keep[keep.length-1], pt=sg[Math.floor(sg.length*0.82)];
        texAt('fname',F.name,sx(pt[1])+12,sy(pt[0])-18,{anchor:'l',bg:true,color:COL.temaD,size:22}); }
    }
  };
})();

      else if(pp!==null && Math.abs(pv)<Math.abs(v) && Math.abs(pv)<Math.abs(pp) && Math.abs(pv)<1e-3){ // mínimo tocando 0
        let a=grid[i-2], b=x; for(let k=0;k<200;k++){ const m1=a+(b-a)/3, m2=b-(b-a)/3; if(Math.abs(g(m1))<Math.abs(g(m2))) b=m2; else a=m1; }
        const m=(a+b)/2; if(Math.abs(g(m))<1e-12) out.push(m); }
      pp=pv; pv=v; px=x;
      if(out.length>60) break; }
    return [...new Set(out.map(r=>+r.toPrecision(12)))].sort((a,b)=>a-b);
  }
  // valores «bonitos»: enteros, fracciones, raíces, múltiplos de π
  function nice(v){
    if(v===I) return R`+\infty`; if(v===-I) return R`-\infty`;
    const s=v<0?'-':'', a=Math.abs(v), tol=1e-7*Math.max(1,a);
    if(Math.abs(a-Math.round(a))<tol) return s+Math.round(a);
    for(const d of [2,3,4,5,6,8]){ const k=Math.round(a*d); if(Math.abs(a-k/d)<tol) return s+R`\tfrac{`+k+'}{'+d+'}'; }
    for(const d of [1,2,3,4,6]){ const k=Math.round(a*d/PI); if(k>0&&Math.abs(a-k*PI/d)<tol){ const g=(p,q)=>q?g(q,p%q):p, m=g(k,d), K=k/m, D=d/m;
        const num=(K===1?'':K)+R`\pi`; return s+(D===1?num:R`\tfrac{`+num+'}{'+D+'}'); } }
    for(let n=2;n<=60;n++){ const r=Math.sqrt(n); if(Number.isInteger(r)) continue; for(const k of [1,2,3]){ for(const d of [1,2,3]){
      if(Math.abs(a-k*r/d)<tol){ const num=(k===1?'':k)+R`\sqrt{`+n+'}'; return s+(d===1?num:R`\tfrac{`+num+'}{'+d+'}'); } } } }

  const niceVal=v=>{ if(!Number.isFinite(v)) return v; const a=Math.abs(v), tol=1e-7*Math.max(1,a);
    if(Math.abs(a-Math.round(a))<tol) return Math.sign(v)*Math.round(a);
    for(const d of [2,3,4,5,6,8]){ const k=Math.round(a*d); if(Math.abs(a-k/d)<tol) return Math.sign(v)*k/d; }
    for(const d of [1,2,3,4,6]){ const k=Math.round(a*d/PI); if(k>0&&Math.abs(a-k*PI/d)<tol) return Math.sign(v)*k*PI/d; }
    for(let n=2;n<=60;n++){ const r=Math.sqrt(n); for(const k of [1,2,3]) for(const d of [1,2,3]) if(Math.abs(a-k*r/d)<tol) return Math.sign(v)*k*r/d; }
    return v; };
  function limitAt(f,b,side){                 // límite al acercarse a b (finito o ±∞) desde el interior
    const xs=[]; if(b===I) for(let k=1;k<=150;k++) xs.push(Math.pow(10,k*2)); else if(b===-I) for(let k=1;k<=150;k++) xs.push(-Math.pow(10,k*2));

    const mono=d.every(t=>t>0)||d.every(t=>t<0);
    if(mono && Math.abs(d[d.length-1])>=0.3*Math.abs(d[0])) return Math.sign(d[0])*I;
    return null;
  }

  function partInfo(f,a,b,ca,cb){
    let flat=false;
    const tern=(lo,hi,sg)=>{ for(let k=0;k<120;k++){ const m1=lo+(hi-lo)/3, m2=hi-(hi-lo)/3; if(sg*f(m1)>sg*f(m2)) hi=m2; else lo=m1; } return (lo+hi)/2; };
      const xs=[]; if(ca) xs.push(a);
      for(let i=0;i<NG;i++){ const x=grid[i]; if(x>a&&x<b) xs.push(x); }
      if(cb) xs.push(b);
      const ys=xs.map(f);
      let sgn=0, changes=[], last=-1, nz=0, nch=0, outL=false, outR=false;
      for(let i=0;i<xs.length;i++){ if(!Number.isFinite(ys[i])) continue;
        if(last>=0){ const dy=ys[i]-ys[last]; const s=Math.abs(dy)<=1e-12*(1+Math.abs(ys[i]))?0:Math.sign(dy);
          if(s!==0){ nz++; if(sgn!==0&&s!==sgn){ nch++; const lo=xs[Math.max(0,last-1)], hi=xs[i]; if(Math.abs(hi)<200) changes.push(niceVal(tern(lo,hi,sgn))); else if(hi<0) outL=true; else outR=true; } sgn=s; } }
        last=i; }
      if(nz===0 && ys.filter(Number.isFinite).length>=3) flat=true;
      // extremos alcanzados en puntos «razonables» (no en la lejanía ni pegados a un borde abierto)
      let lo=I, hi=-I, loC=false, hiC=false, loX=null, hiX=null;
      const consider=(y,x,isEnd)=>{ if(!Number.isFinite(y)) return;
        if(y<lo){ lo=y; loC=true; loX=isEnd?0:x; } if(y>hi){ hi=y; hiC=true; hiX=isEnd?0:x; } };
      let imn=-1, imx=-1; const better=(i,j,sg)=>{ const a=sg*ys[i], b=sg*ys[j]; return a<b || (a===b && Math.abs(xs[i])<Math.abs(xs[j])); };
      for(let i=0;i<xs.length;i++){ if(!Number.isFinite(ys[i])) continue; if(imn<0||better(i,imn,1)) imn=i; if(imx<0||better(i,imx,-1)) imx=i; }
      const refine=(i,sg)=>{ if(i<=0||i>=xs.length-1) return [xs[i],ys[i]]; const x=tern(xs[i-1],xs[i+1],sg); return [x,f(x)]; };
      if(imn>=0){ const [x,y]=refine(imn,-1); consider(y,x,(ca&&imn===0)||(cb&&imn===xs.length-1)); }
      if(imx>=0){ const [x,y]=refine(imx,1); consider(y,x,(ca&&imx===0)||(cb&&imx===xs.length-1)); }
      if(ca) consider(f(a),a,true); if(cb) consider(f(b),b,true);
      const ends=[]; if(!ca) ends.push([limitAt(f,a,1),a]); if(!cb) ends.push([limitAt(f,b,-1),b]);
      const near=(u,v)=>Number.isFinite(u)&&Number.isFinite(v)&&Math.abs(u-v)<=1e-6*(1+Math.abs(v));
      const atB=(X,B)=>X!==null && (Math.abs(X)>20 || (Number.isFinite(B) && Math.abs(X-B)<6e-3*(1+Math.abs(B))));
      ends.forEach(([L,B])=>{ if(L===null) return;
        if(near(L,lo)){ lo=L; if(atB(loX,B)) loC=false; } else if(L<lo){ lo=L; loC=false; }
        if(near(L,hi)){ hi=L; if(atB(hiX,B)) hiC=false; } else if(L>hi){ hi=L; hiC=false; } });
      if(loX!==null&&Math.abs(loX)>1e4) loC=false; if(hiX!==null&&Math.abs(hiX)>1e4) hiC=false;
      if(Math.abs(lo)>1e12){ lo=Math.sign(lo)*I; loC=false; } if(Math.abs(hi)>1e12){ hi=Math.sign(hi)*I; hiC=false; }
      return {range:[niceVal(lo),niceVal(hi),loC,hiC], mono:{a,b,changes,sgn,nch,outL,outR}, flat};
  }

  function analyze(node){
    const f=x=>ev(node,x), C=conditions(node);
    // (a) dominio: tramos donde valen las desigualdades, menos los ceros de las «≠ 0»
    const ineq=C.filter(c=>c.kind!=='ne'), neq=C.filter(c=>c.kind==='ne');
    const inside=x=>ok(ineq,x);
    let pieces=[]; let st=null;
    for(let i=0;i<NG;i++){ const x=grid[i], o=inside(x);
      if(o&&st===null) st=(i===0)?-I:bis(t=>inside(t),grid[i-1],x);
      if(!o&&st!==null){ pieces.push([st,bis(t=>inside(t),grid[i-1],x)]); st=null; } }
    if(st!==null) pieces.push([st,I]);
    pieces=pieces.map(([a,b])=>[Number.isFinite(a)?niceVal(a):a, Number.isFinite(b)?niceVal(b):b]);
    let holes=[]; neq.forEach(c=>{ pieces.forEach(([a,b])=>{ rootsOf(c.g,a,b).forEach(r=>holes.push(niceVal(r))); }); });
    holes=[...new Set(holes)].sort((a,b)=>a-b);
    const closedAt=v=>Number.isFinite(v)&&ok(ineq,v);
    // tramos continuos = tramos partidos por los huecos
    const parts=[]; pieces.forEach(([a,b])=>{ let lo=a; holes.filter(h=>h>a&&h<b).forEach(h=>{ parts.push([lo,h,lo===a?closedAt(a):false,false]); lo=h; }); parts.push([lo,b,lo===a?closedAt(a):false,closedAt(b)]); });
    const many = holes.length>8 || pieces.length>6;
    // (b) imagen y monotonía por tramos
    const ranges=[], mono=[]; let flat=false;
    parts.forEach(P=>{ const r=partInfo(f,...P); ranges.push(r.range); mono.push(r.mono); if(r.flat) flat=true; });
    // unir intervalos de la imagen
    const rs=ranges.slice().sort((p,q)=>p[0]-q[0]), img=[];
    rs.forEach(r=>{ const l=img[img.length-1];
      if(l && (r[0]<l[1]-1e-9 || (Math.abs(r[0]-l[1])<1e-9 && (l[3]||r[2])))){ if(r[1]>l[1]||(r[1]===l[1]&&r[3])){ l[1]=r[1]; l[3]=r[3]||(r[1]===l[1]&&l[3]); } if(Math.abs(r[0]-l[0])<1e-9) l[2]=l[2]||r[2]; }

    // (c) simetrías
    const test=[]; for(let k=1;k<=400;k++){ const x=0.0731*k-0.37*Math.sin(k); if(Math.abs(x)<30) test.push(x); }
    const inD=x=>ok(C,x)&&Number.isFinite(f(x));
    const close=(u,v)=>Math.abs(u-v)<=1e-8*(1+Math.abs(u)+Math.abs(v));
    let par=true, impar=true, cnt=0;
    test.forEach(x=>{ if(inD(x)&&inD(-x)){ cnt++; const a=f(x), b=f(-x); if(!close(a,b)) par=false; if(!close(a,-b)) impar=false; } });
    if(cnt<10){ par=false; impar=false; }
    let period=null;
    if(/sin|cos|tan/.test(JSON.stringify(node))) for(const p of [PI/2,PI,2*PI,3*PI,4*PI,1,2,4,6*PI,8*PI]){
      let good=true, c2=0; for(const x of test){ if(inD(x)&&inD(x+p)){ c2++; if(!close(f(x),f(x+p))){ good=false; break; } } }

    const konst = img.length===1 && Number.isFinite(img[0][0]) && Math.abs(img[0][0]-img[0][1])<1e-9;

  }

  /* ---------- 6. Inversa: cambiar y despejar (si x aparece una vez) ---------- */
  const N=v=>({t:'num',v}), op=(o,a,b)=>({t:'op',o,a,b});
  function simp(n){ if(n.a) n.a=simp(n.a); if(n.b) n.b=simp(n.b);

    if(n.t==='op'&&n.o==='-'&&n.b.t==='num'&&n.b.v<0&&!n.b.c) return op('+',n.a,N(-n.b.v));
    if(n.t==='op'&&(n.o==='+'||n.o==='-')&&n.b.t==='num'&&n.b.v===0) return n.a;
    if(n.t==='op'&&n.o==='*'&&n.b.t==='num'&&n.b.v===1) return n.a;
    if(n.t==='op'&&n.o==='/'&&n.b.t==='num'&&n.b.v===1) return n.a;

  const piK=k=>k===1?{t:'num',v:PI,c:'pi'}:op('*',N(k),{t:'num',v:PI,c:'pi'});
  const plus=(k,X)=>k===0?X:(k<0?op('-',X,piK(-k)):op('+',piK(k),X));
  function invert(n,T,x0){
    if(n.t==='x') return T;
    if(n.t==='neg') return invert(n.a,{t:'neg',a:T},x0);
    if(n.t==='op'){ const inA=hasX(n.a), c=inA?n.b:n.a, s=inA?n.a:n.b;
      switch(n.o){ case '+': return invert(s,op('-',T,c),x0);
        case '-': return inA?invert(s,op('+',T,c),x0):invert(s,op('-',c,T),x0);
        case '*': return invert(s,op('/',T,c),x0);
        case '/': return inA?invert(s,op('*',c,T),x0):invert(s,op('/',c,T),x0); } }

    if(n.t==='fn'){ const u0=ev(n.a,x0);
      if(n.f==='sqrt') return invert(n.a,{t:'pow',a:T,b:N(2)},x0);
      if(n.f==='abs') return invert(n.a, u0<0?{t:'neg',a:T}:T, x0);
      if(n.f==='sin'){ const k=Math.round(u0/PI), A_={t:'fn',f:'asin',a:T}; return invert(n.a, plus(k, k%2?{t:'neg',a:A_}:A_), x0); }
      if(n.f==='cos'){ const k=Math.floor(u0/PI), A_={t:'fn',f:'acos',a:T}; return invert(n.a, k%2===0?plus(k,A_):(k+1===0?{t:'neg',a:A_}:op('-',piK(k+1),A_)), x0); }

      if(!inv) return null; return invert(n.a,{t:'fn',f:inv,a:T},x0); }

  }

  /* ---------- 7. Presentación ---------- */
  function ivTex([a,b,ca,cb]){ if(a===-I&&b===I) return R`\mathbb{R}`; return (ca?'[':'(')+nice(a)+','+nice(b)+(cb?']':')'); }
  function domTex(A){
    if(A.many) return R`\left\{x \;\middle|\; `+A.C.map(c=>c.tex).join(R`,\ `)+R`\right\}`;
    if(!A.pieces.length) return R`\varnothing`;
    const base=A.pieces.map(([a,b])=>ivTex([a,b,Number.isFinite(a)&&ok(A.C.filter(c=>c.kind!=='ne'),a),Number.isFinite(b)&&ok(A.C.filter(c=>c.kind!=='ne'),b)]));
    let s=base.join(R`\cup `);
    if(A.holes.length){ const h=R`\{`+A.holes.map(nice).join(',')+R`\}`; s=(base.length===1?s:R`\left(`+s+R`\right)`)+R`\setminus `+h; }
    return s; }
  function imgTex(A){ if(!A.img.length) return '?'; if(A.konst) return R`\{`+nice(A.img[0][0])+R`\}`; if(A.img.length>4) return R`\text{(muchos tramos)}`; return A.img.map(ivTex).join(R`\cup `); }
  function branches(A){                     // ramas donde f es monótona (inyectiva)
    const segs=[]; A.mono.forEach((m,k)=>{ const P=A.parts[k]; const pts=[m.a,...m.changes,m.b];
      for(let i=0;i<pts.length-1;i++){ if((i===0&&m.outL)||(i===pts.length-2&&m.outR)) continue;
        segs.push([pts[i],pts[i+1], (i>0 || P[2])&&Number.isFinite(pts[i]), (i<pts.length-2 || P[3])&&Number.isFinite(pts[i+1])]); } });
    return segs; }
  function nearZero(segs,k=6){              // las k ramas más cercanas al origen
    const d=([a,b])=>a<=0&&b>=0?0:Math.min(Math.abs(a),Math.abs(b));
    return segs.slice().sort((p,q)=>d(p)-d(q)).slice(0,k).sort((p,q)=>p[0]-q[0]); }
  function monoTex(A){ if(A.mono.some(m=>m.outL||m.outR)) return null; const segs=branches(A); if(segs.length>4) return null; return segs.map(ivTex).join(R`,\ `); }
  function niceTxt(v){ if(v===I) return '+∞'; if(v===-I) return '−∞';
    const t=nice(v); return t.replace(/\\tfrac\{(\d*)\\pi\}\{(\d+)\}/,(m,k,d)=>(k||'')+'π/'+d).replace(/\\tfrac\{(\d+)\}\{(\d+)\}/,'$1/$2')
      .replace(/\\tfrac\{1\}\{e\}/,'1/e').replace(/(\d*)\\sqrt\{(\d+)\}/,'$1√$2').replace(/\\pi/,'π').replace(/\\approx ?/,'≈').replace(/\{,\}/,',').replace(/^-/,'−'); }
  const ivTxt=([a,b,ca,cb])=>(ca?'[':'(')+niceTxt(a)+', '+niceTxt(b)+(cb?']':')');

  let src='e^(-x^2)', node=null, A=null, err=null, inv=null, invOn=false, it=0, drag=null, V0=null;
  let ramas=[], sel=null, selInfo=null, selInv=null;
  const EX=['x^2-4','x^3-3x','1/(x^2-1)','sqrt(4-x^2)','ln(x^2-1)','e^(-x^2)','sin(x)/x','sin(x)','cos(x)','arctg(1/x)','|x-1|','2^x-1','tg(2x)'];
  const x0Of=([a,b])=>Number.isFinite(a)&&Number.isFinite(b)?(a+b)/2:Number.isFinite(a)?a+1:Number.isFinite(b)?b-1:0.37;
  function run(s){ src=s; err=null; invOn=false; it=0; sel=null; selInfo=null; selInv=null; ramas=[];
    try{ node=parse(s); A=analyze(node);
      inv=null; if(A.inj && countX(node)===1){ const r=invert(node,{t:'x'},x0Of(A.parts[0]||[0,1])); if(r) inv=simp(r); }
      if(!A.inj && !A.konst && !A.flat) ramas=nearZero(branches(A),5); }
    catch(e){ err=String(e); node=null; A=null; }
    build(); }
  function pick(i){ invOn=false; it=0;
    if(i===null||sel===i){ sel=null; selInfo=null; selInv=null; build(); return; }
    sel=i; const R_=ramas[i]; selInfo=partInfo(A.f,R_[0],R_[1],R_[2],R_[3]);
    selInv=null; if(countX(node)===1){ const r=invert(node,{t:'x'},x0Of(R_)); if(r) selInv=simp(r); }
    build(); }
  function build(){
    bar.innerHTML='';
    const row=document.createElement('div'); row.style.cssText='display:flex;flex-wrap:wrap;justify-content:center;gap:8px;width:100%;align-items:center';
    const lab=document.createElement('span'); lab.innerHTML='<b>f(x) =</b>'; lab.style.cssText='font-size:17px;color:#2E6E4E';
    const inp=document.createElement('input'); inp.value=src; inp.spellcheck=false; inp.title='sin, cos, tan (o tg), arcsin, arccos, arctan, ln, sqrt, |x|, pi, e';
    inp.style.cssText='font:inherit;font-size:17px;padding:6px 12px;border:1.5px solid #3C8C64;border-radius:10px;width:260px;outline:none';
    inp.onkeydown=e=>{ if(e.key==='Enter') run(inp.value); };
    const go=document.createElement('button'); go.textContent='Dibujar'; go.className='on'; go.onclick=()=>run(inp.value);
    const can = A && (A.inj || sel!==null);
    const bi=document.createElement('button'); bi.textContent=invOn?'Ocultar la inversa':'⟷ Ver su inversa'; bi.disabled=!can;
    bi.style.opacity=bi.disabled?.4:1; bi.onclick=()=>{ invOn=!invOn; build(); };
    const bc=document.createElement('button'); bc.textContent='⌖ Centrar'; bc.onclick=()=>{ V={...V0}; };
    const ex=document.createElement('select'); ex.style.cssText='font:inherit;font-size:15px;padding:6px 10px;border:1.5px solid #3C8C64;border-radius:999px;color:#2E6E4E;background:#fff;cursor:pointer';
    ex.innerHTML='<option value="">Ejemplos ▾</option>'+EX.map(e=>'<option>'+e+'</option>').join('');
    ex.onchange=()=>{ if(ex.value) run(ex.value); };
    row.append(lab,inp,go,ex,bi,bc); bar.appendChild(row);
    if(ramas.length){
      const r3=document.createElement('div'); r3.style.cssText='display:flex;flex-wrap:wrap;justify-content:center;gap:6px;width:100%;align-items:center;font-size:14px;color:#2E6E4E';
      const t=document.createElement('b'); t.textContent='✂ Cortar en ramas inyectivas:'; r3.appendChild(t);

      for(let i=0,N=C.connect?8000:2400;i<=N;i++){ const x=cx-ww+2*ww*i/N, y=C.f(x); if(!Number.isFinite(y)){ pen=false; continue; }
        const X=mx(x), Y=my(y); if(Y<py0-3*S||Y>py0+4*S){ if(!C.connect){ pen=false; py=null; continue; } }
        if(pen&&py!==null&&Math.abs(Y-py)>S*0.6&&!C.connect) pen=false; if(!pen){ ctx.moveTo(X,Y); pen=true; } else ctx.lineTo(X,Y); py=Y; }
      ctx.stroke();
      // dos viajeros que se acercan al centro de la lupa
      [-1,1].forEach(sd=>{ const x=cx+sd*ww*(1-t)*0.92, y=C.f(x); if(Number.isFinite(y)&&my(y)>py0&&my(y)<py0+S){ ctx.fillStyle=COL.rojo; ctx.beginPath(); ctx.arc(mx(x),my(y),5,0,7); ctx.fill(); } });
      { let up=0; for(let i=0;i<=40;i++){ const x=cx-ww+2*ww*i/40, y=C.f(x); if(Number.isFinite(y)&&y>cy+hh) up++; }
        if(up>30){ ctx.fillStyle=COL.rojo; ctx.font='bold 16px "Latin Modern Sans",Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
          for(const fx of [0.25,0.5,0.75]){ const X=px0+fx*S; ctx.beginPath(); ctx.moveTo(X,py0+14); ctx.lineTo(X-9,py0+30); ctx.lineTo(X+9,py0+30); ctx.closePath(); ctx.fill(); }
          ctx.fillText('la curva está por encima: se escapa',px0+S/2,py0+S/2); } }
      C.pts.forEach(([x,y,k])=>{ if(x>cx-ww&&x<cx+ww&&y>cy-hh&&y<cy+hh){ ctx.beginPath(); ctx.arc(mx(x),my(y),7,0,7); ctx.fillStyle=k==='h'?'#fff':COL.tema; ctx.strokeStyle=COL.tema; ctx.lineWidth=2.5; ctx.fill(); ctx.stroke(); } });
      ctx.restore();
      ctx.save(); ctx.strokeStyle='#5f6b66'; ctx.lineWidth=2.5; ctx.strokeRect(px0,py0,S,S); ctx.restore();
      // conectores lupa → ventana
      ctx.save(); ctx.strokeStyle='rgba(95,107,102,.35)'; ctx.lineWidth=1.2; ctx.beginPath();
      ctx.moveTo(sx(cx),sy(cy)-rr); ctx.lineTo(px0,py0); ctx.moveTo(sx(cx),sy(cy)+rr); ctx.lineTo(px0,py0+S); ctx.stroke(); ctx.restore();
      const ex=Math.round(lz*10)/10;
      texAt('lu-z',R`\text{aumento }\times 10^{`+String(ex).replace('.',',')+'}',px0+S/2,py0-20,{color:COL.temaD,size:18});
      texAt('lu-x0',fmt(cx-ww),px0,py0+S+14,{color:'#555',size:13}); texAt('lu-x1',fmt(cx+ww),px0+S,py0+S+14,{color:'#555',size:13});
      texAt('lu-y0',fmt(cy-hh),px0-6,py0+S-8,{anchor:'r',color:'#555',size:13}); texAt('lu-y1',fmt(cy+hh),px0-6,py0+8,{anchor:'r',color:'#555',size:13});
      texAt('lu-ed', C.wy ? R`\text{ventana }2\delta\times 2\varepsilon,\ \ \delta=`+fmt(ww,Math.max(2,Math.ceil(lz)+1))+R`,\ \varepsilon=`+fmt(hh,2)+R`\ \text{(fijo: solo estiramos en horizontal)}` : R`\text{ventana }2\delta\times 2\varepsilon,\ \ \delta=\varepsilon=`+fmt(ww,Math.max(2,Math.ceil(lz)+1)),px0+S/2,py0+S+40,{color:'#7a6a7a',size:15});
      // tabla
      const tx0=px0+S+18, tx1=W-10; const a=cx; const rows=[]; for(const k of [0,1,2]) rows.push(a-ww*Math.pow(10,-k)); for(const k of [2,1,0]) rows.push(a+ww*Math.pow(10,-k));
      ctx.save(); ctx.strokeStyle='#cfdcd4'; ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(tx0,py0+30); ctx.lineTo(tx1,py0+30); ctx.moveTo((tx0+tx1)/2,py0+8); ctx.lineTo((tx0+tx1)/2,py0+30+6*34+10);
      ctx.moveTo(tx0,py0+30+3*34+5); ctx.lineTo(tx1,py0+30+3*34+5); ctx.stroke(); ctx.restore();
      texAt('lu-th1','x',(tx0*3+tx1)/4,py0+18,{size:19}); texAt('lu-th2','f(x)',(tx0+tx1*3)/4,py0+18,{size:19});
      rows.forEach((x,i)=>{ const yy=py0+50+i*34+(i>2?10:0);
        texAt('lu-r'+i,fmt(x,Math.min(9,Math.ceil(lz)+3)),(tx0*3+tx1)/4,yy,{size:16,color:'#503050'});
        texAt('lu-v'+i,fmt(C.f(x),Math.min(9,Math.ceil(lz)+3)),(tx0+tx1*3)/4,yy,{size:16,color:COL.rojo}); });
      // mensaje
      const near = Math.abs(cx-C.a)<ww*0.2 && Math.abs(cy-C.L)<hh*0.5;
      texAt('lu-msg', near? C.msg : R`\text{Arrastra la lupa por la gráfica; con la rueda o la barra, aumenta}`, W*0.5+S/2-20, H-24, {bg:true,color:near?COL.temaD:'#6b7671',size:17,maxw:W*0.6});
    }
  };
})();

/* ============================================================
   Pestañas y bucle
   ============================================================ */
const TABS = [
  ['Vertical',T1],['Sombras',T2],['Cadena',T3],['Simetrías',T4],
  ['Horizontal',T5],['Espejo',T6],['Apilar',T7],['Árbol',T8],['Laboratorio',T9],['Lupa',TL]
];
let cur = T1;
const nav=document.getElementById('tabs');
TABS.forEach(([name,tab],i)=>{
  const b=document.createElement('button'); b.textContent=name; if(i===0) b.classList.add('on');
  b.onclick=()=>{ [...nav.children].forEach(c=>c.classList.remove('on')); b.classList.add('on'); cur=tab; cv.style.cursor=''; resize(); tab.enter(); };
  nav.appendChild(b);
});
resize(); T1.enter();
let last=performance.now(), time=0;
function loop(now){ const dt=Math.min(0.05,(now-last)/1000); last=now; time+=dt; cur.draw(dt,time); texFrame(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script>
