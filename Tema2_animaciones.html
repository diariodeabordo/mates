<script>
(function(){

const CSS=k=>getComputedStyle(document.documentElement).getPropertyValue(k).trim();
const cv=document.getElementById('coo-cv'), ctx=cv.getContext('2d');
const replayBtn=document.getElementById('coo-replayBtn');

/* ---------- álgebra ---------- */
const Z2=[0,0];
const add=(a,b)=>[a[0]+b[0],a[1]+b[1]];
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1]];
const mul=(k,a)=>[k*a[0],k*a[1]];
const len=a=>Math.hypot(a[0],a[1]);
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const ease=g=>g*g*(3-2*g);
const cross=(a,b)=>a[0]*b[1]-a[1]*b[0];
const dist2=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
function solve2(u,v,p){ const d=cross(u,v); if(Math.abs(d)<1e-9) return [0,0]; return [cross(p,v)/d, cross(u,p)/d]; }
function hexRgb(h){ h=h.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
function hexA(h,a){ const c=hexRgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
const hcol=(h,l)=>`hsl(${h},68%,${l||55}%)`;
let bgResolved='#f2efe9';
function refreshBg(){ bgResolved=CSS('--bg'); }

/* ---------- datos: una base (e1,e2) y un vector v que se elige pinchando ---------- */
const HE=[22,205];
const E0=[[2.3,0.5],[-0.7,1.9]];
let E=E0.map(v=>v.slice()), v=null;
const coords=()=>v?solve2(E[0],E[1],v):[0,0];

/* ---------- disposición ---------- */
let W=0,H=0,S=30,K=1,portrait=false;
let Vr={x:0,y:0,w:0,h:0}, Mr={x:0,y:0,w:0,h:0}, CV=[0,0], HX=5, HY=4, MX={cx:0,cy:0,cs:50};
function layout(){
  const r=cv.getBoundingClientRect(); if(!r.width) return;
  const d=window.devicePixelRatio||1;
  cv.width=r.width*d; cv.height=r.height*d; W=r.width; H=r.height;
  ctx.setTransform(d,0,0,d,0,0);
  portrait = H > W*0.95;
  if(!portrait){
    const pw=clamp(W*0.2,150,240), gap=16;
    Vr={x:12,y:12,w:W-24-pw-gap,h:H-24}; Mr={x:12+Vr.w+gap,y:12,w:pw,h:H-24};
    MX={cx:Mr.x+Mr.w/2,cy:Mr.y+Mr.h/2,cs:clamp(Math.min(Mr.w/3.0,Mr.h/4.6),38,80)};
  }else{
    const mh=clamp(H*0.26,140,210), gap=12;
    Vr={x:12,y:12,w:W-24,h:H-24-mh-gap}; Mr={x:12,y:12+Vr.h+gap,w:W-24,h:mh};
    MX={cx:Mr.x+Mr.w/2,cy:Mr.y+Mr.h/2,cs:clamp(Math.min(Mr.w/3.0,Mr.h/3.6),34,70)};
  }
  S=Math.min(Vr.w/10.4,Vr.h/8.4); K=clamp(S/38,.6,1.25);
  CV=[Vr.x+Vr.w/2,Vr.y+Vr.h/2]; HX=Vr.w/(2*S); HY=Vr.h/(2*S);
}
new ResizeObserver(layout).observe(cv);
const Pv=p=>[CV[0]+p[0]*S, CV[1]-p[1]*S];
const unV=(x,y)=>[(x-CV[0])/S,(CV[1]-y)/S];

/* ---------- primitivas ---------- */
function drawArrow(p1,p2,color,alpha,lw,halo){
  const [x1,y1]=p1,[x2,y2]=p2;
  const Lp=Math.hypot(x2-x1,y2-y1); if(Lp<1.5) return;
  const hl=Math.min(Lp*0.4, lw*2.4+6), hw=lw*1.6+4;
  const ang=Math.atan2(y2-y1,x2-x1);
  const bx=x2-hl*Math.cos(ang), by=y2-hl*Math.sin(ang);
  const nx=-Math.sin(ang), ny=Math.cos(ang);
  ctx.save(); ctx.globalAlpha=alpha; ctx.lineCap='round'; ctx.lineJoin='round';
  if(halo){
    ctx.strokeStyle=halo; ctx.lineWidth=lw+4;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(bx,by); ctx.stroke();
    ctx.fillStyle=halo; ctx.lineWidth=4; ctx.strokeStyle=halo;
    ctx.beginPath(); ctx.moveTo(x2,y2); ctx.lineTo(bx+nx*hw/2,by+ny*hw/2); ctx.lineTo(bx-nx*hw/2,by-ny*hw/2); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  ctx.strokeStyle=color; ctx.lineWidth=lw;
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(bx,by); ctx.stroke();
  ctx.fillStyle=color;
  ctx.beginPath(); ctx.moveTo(x2,y2); ctx.lineTo(bx+nx*hw/2,by+ny*hw/2); ctx.lineTo(bx-nx*hw/2,by-ny*hw/2); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function dashSeg(a,b,color,alpha,lw,dash){
  ctx.save(); ctx.globalAlpha=alpha; ctx.strokeStyle=color; ctx.lineWidth=lw||1.8; ctx.setLineDash(dash||[5,5]);
  ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke(); ctx.restore();
}
function ring(pt,r,color,alpha,lw,dash){
  ctx.save(); ctx.globalAlpha=alpha; ctx.strokeStyle=color; ctx.lineWidth=lw; if(dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.arc(pt[0],pt[1],r,0,7); ctx.stroke(); ctx.restore();
}
function dot_(pt,r,color,alpha){
  ctx.save(); ctx.globalAlpha=alpha; ctx.fillStyle=color; ctx.beginPath(); ctx.arc(pt[0],pt[1],r,0,7); ctx.fill(); ctx.restore();
}
function rrect(x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r); ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r); ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}
function drawOrigin(pt,color,t){
  const br=1+0.12*Math.sin(t*2.4), rad=30*K*br;
  const g=ctx.createRadialGradient(pt[0],pt[1],0,pt[0],pt[1],rad);
  g.addColorStop(0,hexA(color,.6)); g.addColorStop(.35,hexA(color,.22)); g.addColorStop(1,hexA(color,0));
  ctx.save(); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(pt[0],pt[1],rad,0,7); ctx.fill(); ctx.restore();
  ring(pt,9*K*br,color,.55,1.6);
  dot_(pt,5.5*K+1,color,1); dot_(pt,2.2*K+.4,'#ffffff',.9);
}

/* ---------- la construcción: e1 y e2 se estiran, se suman (paralelogramo) y llegan a v ---------- */
function paraAnim(ui,uj,hi,hj,a,b,tau,alpha,diagCol){
  const eA=ease(clamp(tau/1.2,0,1)), eB=ease(clamp((tau-1.2)/1.0,0,1)), eC=ease(clamp((tau-2.2)/0.8,0,1));
  const A=mul(a,ui), Bv=mul(b,uj), Ev=add(A,Bv), O=Pv(Z2);
  const si=lerp(1,a,eA), sj=lerp(1,b,eA);
  if(eB>0){
    const pA=Pv(A), pB=Pv(Bv), pE=Pv(Ev);
    ctx.save(); ctx.globalAlpha=alpha*.1*eB; ctx.fillStyle=CSS('--fg');
    ctx.beginPath(); ctx.moveTo(O[0],O[1]); ctx.lineTo(pA[0],pA[1]); ctx.lineTo(pE[0],pE[1]); ctx.lineTo(pB[0],pB[1]); ctx.closePath(); ctx.fill(); ctx.restore();
    const t1=mul(eB,A), t2=mul(eB,Bv);
    drawArrow(Pv(t1),Pv(add(t1,Bv)),hcol(hj),alpha*.8,3.4*K+1,bgResolved);
    drawArrow(Pv(t2),Pv(add(t2,A)),hcol(hi),alpha*.8,3.4*K+1,bgResolved);
  }
  drawArrow(O,Pv(mul(si,ui)),hcol(hi),alpha,5*K+1.5,bgResolved);
  drawArrow(O,Pv(mul(sj,uj)),hcol(hj),alpha,5*K+1.5,bgResolved);
  if(eC>0){
    drawArrow(O,Pv(mul(eC,Ev)),diagCol,alpha,5.8*K+1.5,bgResolved);
    if(tau>3.0&&tau<3.7){ const k=(tau-3.0)/0.7; ring(Pv(Ev),k*30*K,diagCol,(1-k)*.8*alpha,2.4); }
  }
}
function ghostPara(ui,uj,hi,hj,a,b,alpha){
  const A=mul(a,ui), Bv=mul(b,uj), Ev=add(A,Bv), O=Pv(Z2), pA=Pv(A), pB=Pv(Bv), pE=Pv(Ev);
  dashSeg(O,pA,hcol(hi),alpha,1.6,[3,5]); dashSeg(pA,pE,hcol(hj),alpha,1.6,[3,5]);
  dashSeg(O,pB,hcol(hj),alpha,1.6,[3,5]); dashSeg(pB,pE,hcol(hi),alpha,1.6,[3,5]);
}
/* retícula de la base: cada punto del lienzo tiene una dirección única en ella */
function drawLattice(alpha){
  ctx.save();
  [[E[0],E[1],HE[0]],[E[1],E[0],HE[1]]].forEach(([base,dir,h])=>{
    const dn=mul(1/len(dir),dir);
    for(let k=-16;k<=16;k++){
      const p0=mul(k,base), a=Pv(add(p0,mul(-30,dn))), b=Pv(add(p0,mul(30,dn)));
      ctx.globalAlpha=alpha*(k===0?.5:.2); ctx.strokeStyle=hcol(h); ctx.lineWidth=k===0?2:1;
      ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
    }
  });
  ctx.restore();
}

/* ---------- el vector columna ---------- */
const fmt=x=>(Math.abs(x)<0.005?0:x).toFixed(2).replace('-','−');
function cellCenter(i){ const {cx,cy,cs}=MX; return [cx, cy-cs+(i+.5)*cs]; }
function miniArrow(c,dir,len_,color,alpha,lw){
  const l=Math.hypot(dir[0],dir[1])||1, u=[dir[0]/l,-dir[1]/l];
  drawArrow([c[0]-u[0]*len_/2,c[1]-u[1]*len_/2],[c[0]+u[0]*len_/2,c[1]+u[1]*len_/2],color,alpha,lw,null);
}
function drawColumn(t){
  const {cx,cy,cs}=MX, fg=CSS('--fg'), hab=CSS('--habitat');
  const left=cx-cs*0.55, right=cx+cs*0.55, top=cy-cs, bot=cy+cs;
  if(phase==='anim'){
    ctx.save(); ctx.globalAlpha=.10+.05*Math.sin(t*5); ctx.fillStyle=fg;
    rrect(left,top-4,right-left,2*cs+8,8*K); ctx.fill(); ctx.restore();
  }
  ctx.save(); ctx.strokeStyle=fg; ctx.globalAlpha=.85; ctx.lineWidth=3*K; ctx.lineCap='round'; ctx.lineJoin='round';
  const bw=9*K, pad=6*K;
  ctx.beginPath(); ctx.moveTo(left-pad+bw,top-pad); ctx.lineTo(left-pad,top-pad); ctx.lineTo(left-pad,bot+pad); ctx.lineTo(left-pad+bw,bot+pad); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(right+pad-bw,top-pad); ctx.lineTo(right+pad,top-pad); ctx.lineTo(right+pad,bot+pad); ctx.lineTo(right+pad-bw,bot+pad); ctx.stroke();
  ctx.restore();
  // cabecera: el vector v; marcas de fila: los vectores de la base
  if(v) miniArrow([cx,top-0.55*cs-6*K],v,cs*0.55,fg,1,3.6*K);
  for(let i=0;i<2;i++) miniArrow([left-0.62*cs-pad,top+(i+.5)*cs],E[i],cs*0.55,hcol(HE[i]),1,3.4*K);
  const fs=clamp(cs*0.34,13,26), co=coords();
  ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font=`600 ${fs}px "Iowan Old Style",Palatino,Georgia,serif`;
  for(let i=0;i<2;i++){
    const c=cellCenter(i);
    if(v && filled()){
      const val=co[i], landed=(phase==='anim'&&pt<FILL+1.0), k=landed?(pt-FILL)/1.0:1;
      if(landed) ring(c,(8+k*26)*K,hcol(HE[i]),(1-k)*.8,2.2);
      ctx.fillStyle=hcol(HE[i],50); ctx.globalAlpha=1; ctx.fillText(fmt(val),c[0],c[1]-3*K);
      const bl=clamp(Math.abs(val),0,1.8)/1.8*cs*0.4;
      ctx.globalAlpha=.85; ctx.fillStyle=hcol(HE[i]);
      ctx.fillRect(val>=0?c[0]:c[0]-bl, c[1]+fs*0.62, bl, 3.6*K);
      ctx.globalAlpha=.3; ctx.fillRect(c[0]-1,c[1]+fs*0.62-2*K,2,7.6*K);
    }else{
      ctx.globalAlpha=.45; ctx.strokeStyle=hab; ctx.lineWidth=1.4; ctx.setLineDash([3,5]);
      rrect(c[0]-cs*0.4,c[1]-cs*0.4,cs*0.8,cs*0.8,8*K); ctx.stroke(); ctx.setLineDash([]);
    }
  }
  ctx.restore();
}
function drawChips(){
  if(!v || phase!=='anim') return;
  const ct=pt-0.7, co=coords(), fs=clamp(MX.cs*0.30,12,19);
  for(let i=0;i<2;i++){
    if(ct<1.3||pt>=FILL) continue;
    const tipW=Pv(mul(co[i],E[i])), O=Pv(Z2), dx=tipW[0]-O[0], dy=tipW[1]-O[1], l=Math.hypot(dx,dy)||1;
    let start=[tipW[0]+(-dy/l)*18*K, tipW[1]+(dx/l)*18*K];
    start=[clamp(start[0],Vr.x+24,Vr.x+Vr.w-24), clamp(start[1],Vr.y+14,Vr.y+Vr.h-14)];
    const target=cellCenter(i);
    let p=start, sc=1, al=clamp((ct-1.3+i*0.15)/0.3,0,1);
    const fly0=FILL-1.0+i*0.1;
    if(pt>=fly0){
      const s=ease(clamp((pt-fly0)/1.0,0,1));
      p=[lerp(start[0],target[0],s), lerp(start[1],target[1],s)-Math.sin(Math.PI*s)*34*K]; sc=lerp(1,0.8,s);
    }
    const txt=fmt(co[i]);
    ctx.save(); ctx.globalAlpha=al; ctx.font=`600 ${fs*sc}px "Iowan Old Style",Palatino,Georgia,serif`;
    const tw=ctx.measureText(txt).width+14*K;
    ctx.fillStyle=bgResolved; ctx.strokeStyle=hcol(HE[i]); ctx.lineWidth=2*K;
    rrect(p[0]-tw/2,p[1]-fs*0.85*sc,tw,fs*1.7*sc,9*K); ctx.fill(); ctx.stroke();
    ctx.fillStyle=hcol(HE[i],50); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(txt,p[0],p[1]); ctx.restore();
  }
}

/* ---------- estado ---------- */
let phase='idle', pt=0, hoverKey=null, drag=null, vDrag=false, hintT=0;
const FILL=5.6, END=6.4;
const filled=()=> phase==='live'||phase==='done'||(phase==='anim'&&pt>=FILL);
function startAnim(){ if(!v) return; phase='anim'; pt=0; replayBtn.disabled=true; }
replayBtn.onclick=startAnim;
document.getElementById('coo-resetBtn').onclick=()=>{ v=null; phase='idle'; pt=0; E=E0.map(a=>a.slice()); replayBtn.disabled=true; };

/* ---------- dibujo ---------- */
function render(t){
  ctx.fillStyle=bgResolved; ctx.fillRect(0,0,W,H);
  if(!W) return;
  const gold=CSS('--gold'), fg=CSS('--fg');
  // el lienzo
  ctx.save(); rrect(Vr.x,Vr.y,Vr.w,Vr.h,18*K); ctx.fillStyle=hexA(gold,.05); ctx.fill();
  ctx.strokeStyle=CSS('--habitat'); ctx.globalAlpha=.8; ctx.lineWidth=1.6; ctx.setLineDash([2,6]); ctx.stroke(); ctx.restore();

  ctx.save(); rrect(Vr.x,Vr.y,Vr.w,Vr.h,18*K); ctx.clip();
  drawLattice(.9);
  const co=coords();
  // la base
  for(let i=0;i<2;i++){
    const O=Pv(Z2), T=Pv(E[i]);
    dot_([(O[0]+T[0])/2,(O[1]+T[1])/2],Math.hypot(T[0]-O[0],T[1]-O[1])/2+10*K,hcol(HE[i]),.14);
    drawArrow(O,T,hcol(HE[i]),1,6*K+1,null);
  }
  if(!v){
    // invitación: un anillo que late sobre un punto del lienzo
    const hp=Pv([HX*0.45,HY*0.38]), ph=(t%1.8)/1.8;
    ring(hp,(10+ph*26)*K,fg,(1-ph)*.55,2); dot_(hp,3*K,fg,.5);
  }else{
    const g=phase==='anim'?ease(clamp(pt/0.6,0,1)):1;
    const T=Pv(mul(g,v)), O=Pv(Z2);
    // el vector elegido
    const tip=Pv(v);
    const pul=1+0.1*Math.sin(t*4);
    ring(tip,12*K*pul,fg,.7,2); dot_(tip,3.4*K,fg,.9);
    // construcción
    if(phase==='anim'){
      const tau=Math.max(0,pt-0.7);
      if(pt<0.7) drawArrow(O,T,fg,1,6*K+1.5,bgResolved);
      else{
        paraAnim(E[0],E[1],HE[0],HE[1],co[0],co[1],Math.min(tau,3.8),1,fg);
      }
    }else{
      // en reposo: huella del paralelogramo y el vector v
      ghostPara(E[0],E[1],HE[0],HE[1],co[0],co[1],.4);
      drawArrow(O,tip,fg,1,6*K+1.5,bgResolved);
    }
  }
  ctx.restore();

  for(let i=0;i<2;i++) ring(Pv(E[i]),13*K,hcol(HE[i]),(hoverKey==='e'+i||drag==='e'+i)?.95:.55,(hoverKey==='e'+i||drag==='e'+i)?2.2:1.5,[3,4]);
  drawOrigin(CV,gold,t);
  drawColumn(t);
  drawChips();
  if(phase==='done' && pt<1.2){ const k=pt/1.2, {cx,cy,cs}=MX; ring([cx,cy],(cs*1.7+k*24)*K,fg,(1-k)*.35,2.4); }
}

/* ---------- bucle ---------- */
function update(dt){
  pt+=dt;
  if(phase==='anim' && pt>=END){ phase='done'; pt=0; replayBtn.disabled=false; }
}
let last=performance.now();
function loop(now){ if(!cv.offsetParent){ last=now; requestAnimationFrame(loop); return; }
  let dt=(now-last)/1000; last=now; dt=Math.min(dt,0.05);
  update(dt); render(now/1000);
  requestAnimationFrame(loop);
}

/* ---------- interacción: pinchar para elegir v; arrastrar las puntas de la base ---------- */
const ptr=e=>{const r=cv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top];};
const inRect=(x,y)=>x>=Vr.x&&x<=Vr.x+Vr.w&&y>=Vr.y&&y<=Vr.y+Vr.h;
function findHandle(px,py){
  const thr=Math.max(22,24*K); let best=null,bd=thr;
  for(let i=0;i<2;i++){ const d=dist2([px,py],Pv(E[i])); if(d<bd){bd=d;best='e'+i;} }
  return best;
}
function enforceIndep(i){
  const o=E[1-i], u=E[i], lu=len(u), lo=len(o); if(lu<1e-6||lo<1e-6) return;
  let rel=Math.atan2(u[1],u[0])-Math.atan2(o[1],o[0]); rel=Math.atan2(Math.sin(rel),Math.cos(rel));
  if(Math.abs(Math.sin(rel))>=0.28) return;
  const m=0.2838; let nr;
  if(Math.abs(rel)<=Math.PI/2) nr=(rel>=0?1:-1)*m; else nr=(rel>0?1:-1)*(Math.PI-m);
  const ang=Math.atan2(o[1],o[0])+nr; E[i]=[lu*Math.cos(ang),lu*Math.sin(ang)];
}
function setBase(i,px,py){
  let p=unV(px,py); const L=len(p); if(L>3.4) p=mul(3.4/L,p); if(L<0.9){ const d=L>1e-6?mul(1/L,p):[1,0]; p=mul(0.9,d); }
  E[i]=[clamp(p[0],-HX+0.5,HX-0.5),clamp(p[1],-HY+0.5,HY-0.5)]; enforceIndep(i);
}
function setV(px,py){ const p=unV(px,py); v=[clamp(p[0],-HX+0.4,HX-0.4),clamp(p[1],-HY+0.4,HY-0.4)]; }
cv.addEventListener('pointerdown',e=>{
  const [px,py]=ptr(e); cv.setPointerCapture(e.pointerId);
  const h=findHandle(px,py);
  if(h){ drag=h; hoverKey=h; setBase(+h[1],px,py); }
  else if(inRect(px,py)){ vDrag=true; setV(px,py); phase='live'; replayBtn.disabled=true; }
});
cv.addEventListener('pointermove',e=>{
  const [px,py]=ptr(e);
  if(drag){ setBase(+drag[1],px,py); return; }
  if(vDrag){ setV(px,py); return; }
  const h=findHandle(px,py); hoverKey=h; cv.style.cursor=h?'grab':(inRect(px,py)?'crosshair':'default');
});
function endDrag(){
  if(vDrag){ vDrag=false; startAnim(); }
  drag=null;
}
cv.addEventListener('pointerup',endDrag);
cv.addEventListener('pointercancel',endDrag);
cv.addEventListener('pointerleave',()=>{ if(!drag&&!vDrag) hoverKey=null; });

document.getElementById('coo-themeBtn').onclick=()=>{
  const el=document.documentElement, dark=matchMedia('(prefers-color-scheme: dark)').matches;
  const now=el.getAttribute('data-theme')||(dark?'dark':'light');
  el.setAttribute('data-theme', now==='dark'?'light':'dark'); refreshBg();
};

layout(); refreshBg();
window.addEventListener('resize',layout);
requestAnimationFrame(loop);


})();

</script>
<script>
/* =====================================================================
   Utilidades comunes de los módulos nuevos (mismo trazo que los antiguos)
   ===================================================================== */
const CSSV=k=>getComputedStyle(document.documentElement).getPropertyValue(k).trim();
const hcol=(h,l)=>`hsl(${h},68%,${l||55}%)`;
function hexA(h,a){ h=h.replace('#',''); return `rgba(${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)},${a})`; }
const V2={add:(a,b)=>[a[0]+b[0],a[1]+b[1]], sub:(a,b)=>[a[0]-b[0],a[1]-b[1]], mul:(k,a)=>[k*a[0],k*a[1]],
  len:a=>Math.hypot(a[0],a[1]), cross:(a,b)=>a[0]*b[1]-a[1]*b[0], dot:(a,b)=>a[0]*b[0]+a[1]*b[1]};
const V3={add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]], mul:(k,a)=>[k*a[0],k*a[1],k*a[2]],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2], cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  len:a=>Math.hypot(a[0],a[1],a[2]), unit:a=>{const l=Math.hypot(a[0],a[1],a[2])||1; return [a[0]/l,a[1]/l,a[2]/l];}};
const clampN=(x,a,b)=>Math.max(a,Math.min(b,x)), lerpN=(a,b,t)=>a+(b-a)*t, easeN=g=>g*g*(3-2*g), randN=(a,b)=>a+Math.random()*(b-a);
const HU=[22,205,140,300];

function makeKit(cv){
  const ctx=cv.getContext('2d');
  const K={cv,ctx,W:0,H:0,k:1,onfit:null};
  K.fit=()=>{ const r=cv.getBoundingClientRect(); if(!r.width) return; const d=window.devicePixelRatio||1;
    cv.width=r.width*d; cv.height=r.height*d; K.W=r.width; K.H=r.height; ctx.setTransform(d,0,0,d,0,0); if(K.onfit) K.onfit(); };
  new ResizeObserver(K.fit).observe(cv);
  K.bg=()=>{ ctx.fillStyle=CSSV('--bg'); ctx.fillRect(0,0,K.W,K.H); };
  K.arrow=(p1,p2,color,alpha,lw,halo)=>{
    const [x1,y1]=p1,[x2,y2]=p2, Lp=Math.hypot(x2-x1,y2-y1); if(Lp<1.5) return;
    const hl=Math.min(Lp*0.4,lw*2.4+6), hw=lw*1.6+4, ang=Math.atan2(y2-y1,x2-x1);
    const bx=x2-hl*Math.cos(ang), by=y2-hl*Math.sin(ang), nx=-Math.sin(ang), ny=Math.cos(ang);
    ctx.save(); ctx.globalAlpha=alpha; ctx.lineCap='round'; ctx.lineJoin='round';
    if(halo){ ctx.strokeStyle=halo; ctx.lineWidth=lw+4; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(bx,by); ctx.stroke();
      ctx.fillStyle=halo; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(x2,y2); ctx.lineTo(bx+nx*hw/2,by+ny*hw/2); ctx.lineTo(bx-nx*hw/2,by-ny*hw/2); ctx.closePath(); ctx.fill(); ctx.stroke(); }
    ctx.strokeStyle=color; ctx.lineWidth=lw; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(bx,by); ctx.stroke();
    ctx.fillStyle=color; ctx.beginPath(); ctx.moveTo(x2,y2); ctx.lineTo(bx+nx*hw/2,by+ny*hw/2); ctx.lineTo(bx-nx*hw/2,by-ny*hw/2); ctx.closePath(); ctx.fill();
    ctx.restore(); };
  K.dash=(a,b,color,alpha,lw,dash)=>{ ctx.save(); ctx.globalAlpha=alpha; ctx.strokeStyle=color; ctx.lineWidth=lw||1.8; ctx.setLineDash(dash||[5,5]);
    ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke(); ctx.restore(); };
  K.ring=(pt,r,color,alpha,lw,dash)=>{ ctx.save(); ctx.globalAlpha=alpha; ctx.strokeStyle=color; ctx.lineWidth=lw; if(dash) ctx.setLineDash(dash);
    ctx.beginPath(); ctx.arc(pt[0],pt[1],Math.max(0,r),0,7); ctx.stroke(); ctx.restore(); };
  K.dot=(pt,r,color,alpha)=>{ ctx.save(); ctx.globalAlpha=alpha; ctx.fillStyle=color; ctx.beginPath(); ctx.arc(pt[0],pt[1],r,0,7); ctx.fill(); ctx.restore(); };
  K.cross=(pt,s,color,alpha)=>{ ctx.save(); ctx.globalAlpha=alpha; ctx.strokeStyle=color; ctx.lineWidth=2.8*K.k; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(pt[0]-s,pt[1]-s); ctx.lineTo(pt[0]+s,pt[1]+s); ctx.moveTo(pt[0]+s,pt[1]-s); ctx.lineTo(pt[0]-s,pt[1]+s); ctx.stroke(); ctx.restore(); };
  K.origin=(pt,t,col)=>{ const color=col||CSSV('--gold'), br=1+0.12*Math.sin(t*2.4), rad=30*K.k*br;
    const g=ctx.createRadialGradient(pt[0],pt[1],0,pt[0],pt[1],rad);
    g.addColorStop(0,hexA(color,.6)); g.addColorStop(.35,hexA(color,.22)); g.addColorStop(1,hexA(color,0));
    ctx.save(); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(pt[0],pt[1],rad,0,7); ctx.fill(); ctx.restore();
    K.ring(pt,9*K.k*br,color,.55,1.6); K.dot(pt,5.5*K.k+1,color,1); K.dot(pt,2.2*K.k+.4,'#ffffff',.9); };
  K.habitat=(C,R)=>{ const gold=CSSV('--gold'), hab=CSSV('--habitat');
    ctx.save(); ctx.fillStyle=hexA(gold,0.05); ctx.beginPath(); ctx.arc(C[0],C[1],R,0,7); ctx.fill(); ctx.restore();
    K.ring(C,R,hab,.6,1.4,[2,6]); };
  K.habitatFuerte=(C,R,S)=>{ // el plano R^2 como disco bien marcado, con sus ejes
    ctx.save(); ctx.beginPath(); ctx.arc(C[0],C[1],R,0,7); ctx.fillStyle=hexA('#4F81BD',0.04); ctx.fill(); ctx.clip();
    ctx.strokeStyle='#e2e8f0'; ctx.lineWidth=1;
    for(let k=-12;k<=12;k++){ ctx.beginPath(); ctx.moveTo(C[0]+k*S,C[1]-R); ctx.lineTo(C[0]+k*S,C[1]+R); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(C[0]-R,C[1]+k*S); ctx.lineTo(C[0]+R,C[1]+k*S); ctx.stroke(); }
    ctx.strokeStyle='#8c9bad'; ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.moveTo(C[0]-R,C[1]); ctx.lineTo(C[0]+R,C[1]); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(C[0],C[1]-R); ctx.lineTo(C[0],C[1]+R); ctx.stroke(); ctx.restore();
    K.ring(C,R,'#8c9bad',.9,1.8); };
  K.loop=fn=>{ let last=performance.now();
    const L=now=>{ const dt=Math.min(.05,(now-last)/1000); last=now;
      if(cv.offsetParent){ if(!K.W) K.fit(); if(K.W) fn(dt,now/1000); } requestAnimationFrame(L); };
    requestAnimationFrame(L); };
  K.ptr=e=>{ const r=cv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; };
  return K;
}
function planoR2(K,C,S){ // R^2: cuadrícula suave y ejes continuos con flecha
  const ctx=K.ctx; ctx.save(); ctx.strokeStyle='#e2e8f0'; ctx.lineWidth=1;
  for(let k=-20;k<=20;k++){ const x=C[0]+k*S, y=C[1]+k*S;
    if(x>0&&x<K.W){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,K.H); ctx.stroke(); }
    if(y>0&&y<K.H){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(K.W,y); ctx.stroke(); } }
  ctx.strokeStyle='#8c9bad'; ctx.lineWidth=1.6;
  ctx.beginPath(); ctx.moveTo(8,C[1]); ctx.lineTo(K.W-8,C[1]); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(C[0],K.H-8); ctx.lineTo(C[0],8); ctx.stroke();
  ctx.fillStyle='#8c9bad';
  ctx.beginPath(); ctx.moveTo(K.W-6,C[1]); ctx.lineTo(K.W-16,C[1]-5); ctx.lineTo(K.W-16,C[1]+5); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(C[0],6); ctx.lineTo(C[0]-5,16); ctx.lineTo(C[0]+5,16); ctx.closePath(); ctx.fill();
  ctx.restore(); }
function makeBar(id){ return document.getElementById(id); }
function pill(bar,txt,title,fn,pressed){
  const b=document.createElement('button'); b.className='pill'; b.textContent=txt; if(title) b.title=title; b.onclick=fn;
  if(pressed!==undefined) b.setAttribute('aria-pressed',pressed); bar.appendChild(b); return b; }

/* =====================================================================
   SUBESPACIOS: ¿las sumas y los estiramientos se quedan dentro?
   ===================================================================== */
(function(){
  const K=makeKit(document.getElementById('sub-cv')), ctx=K.ctx, bar=makeBar('sub-bar');
  const B=6.6; let S=30,R=200,C=[0,0];
  K.onfit=()=>{ R=Math.max(60,Math.min(K.W,K.H)/2-14); C=[K.W/2,K.H*0.56]; S=Math.min(K.W,K.H)/7.2; K.k=clampN(S/60,.7,1.3); };
  const P=p=>[C[0]+p[0]*S, C[1]-p[1]*S];
  const sets={
    rectaO:{f:x=>x, on:p=>Math.abs(p[1]-p[0])<1e-6, pick:()=>{const a=randN(.8,2.2)*(Math.random()<.5?1:-1); return [a,a];}},
    rectaD:{f:x=>1+x, on:p=>Math.abs(p[1]-1-p[0])<1e-6, pick:()=>{const a=randN(-2.4,1.4); return [a,1+a];}},
    parab: {f:x=>x*x, on:p=>Math.abs(p[1]-p[0]*p[0])<1e-6, pick:()=>{const a=randN(.6,1.6)*(Math.random()<.5?1:-1); return [a,a*a];}}
  };
  let set='rectaO', op='suma', tr=null, t0=0, first=true;
  function newTrial(force){
    if(force) op=force; else op = op==='suma' ? 'escalar' : 'suma';
    const S_=sets[set]; let u,v,lam=0,res;
    for(let k=0;k<40;k++){
      if(set==='parab' && first && op==='suma'){ u=[1,1]; v=[-1,1]; }
      else { u=S_.pick(); v=S_.pick(); }
      lam = [2,-1,1.6,-1.5,0.5][Math.floor(Math.random()*5)];
      res = op==='suma' ? V2.add(u,v) : V2.mul(lam,u);
      if(Math.abs(res[0])<4.4 && res[1]<3.2 && res[1]>-2.6 && Math.abs(u[1])<3.2 && Math.abs(v[1])<3.2 && V2.len(V2.sub(u,v))>0.6) break;
    }
    first=false; tr={u,v,lam,res,inside:sets[set].on(res)}; t0=0;
  }
  function setSet(s){ set=s; first=true; op='escalar'; newTrial('suma'); build(); }
  function build(){
    bar.innerHTML='';
    pill(bar,'Recta por el origen','',()=>setSet('rectaO'),set==='rectaO');
    pill(bar,'Recta desplazada','',()=>setSet('rectaD'),set==='rectaD');
    pill(bar,'Parábola','',()=>setSet('parab'),set==='parab');
    const s=document.createElement('span'); s.style.width='18px'; bar.appendChild(s);
    pill(bar,'⊕','sumar dos flechas',()=>newTrial('suma'));
    pill(bar,'↔','estirar una flecha',()=>newTrial('escalar'));
  }
  function drawSet(){
    const f=sets[set].f, blue=CSSV('--tema');
    ctx.save(); ctx.beginPath(); ctx.rect(0,0,K.W,K.H); ctx.clip();
    ctx.lineCap='round'; ctx.lineJoin='round';
    for(const [w,a] of [[14*K.k,.13],[3*K.k,.85]]){
      ctx.strokeStyle=blue; ctx.globalAlpha=a; ctx.lineWidth=w; ctx.beginPath(); let pen=false;
      for(let i=0;i<=400;i++){ const x=-8+16*i/400, y=f(x); if(Math.abs(y)>8){pen=false;continue;}
        const q=P([x,y]); pen?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]); pen=true; }
      ctx.stroke(); }
    ctx.restore();
  }
  function axes(){ planoR2(K,C,S); }
  K.loop((dt,t)=>{
    K.bg(); if(!tr) newTrial('suma');
    axes(); drawSet();
    t0+=dt; const T=t0, O=P([0,0]), fg=CSSV('--fg'), bad=CSSV('--bad'), ok=CSSV('--ok'), bgc=CSSV('--bg');
    const {u,v,lam,res,inside}=tr;
    const g0=easeN(clampN(T/0.6,0,1));
    if(op==='suma'){
      K.arrow(O,P(V2.mul(g0,u)),hcol(HU[0]),1,5*K.k+1.5,bgc);
      K.arrow(O,P(V2.mul(g0,v)),hcol(HU[1]),1,5*K.k+1.5,bgc);
      const eB=easeN(clampN((T-0.8)/1.0,0,1)), eC=easeN(clampN((T-1.9)/0.8,0,1));
      if(eB>0){ const t1=V2.mul(eB,u), t2=V2.mul(eB,v);
        K.arrow(P(t1),P(V2.add(t1,v)),hcol(HU[1]),.75,3.4*K.k+1,bgc); K.arrow(P(t2),P(V2.add(t2,u)),hcol(HU[0]),.75,3.4*K.k+1,bgc); }
      if(eC>0) K.arrow(O,P(V2.mul(eC,res)),fg,1,5.6*K.k+1.5,bgc);
    }else{
      const eA=easeN(clampN((T-0.8)/1.4,0,1));
      if(eA>0) K.dash(O,P(u),hcol(HU[0]),.5,2,[4,5]);
      K.arrow(O,P(V2.mul(g0*lerpN(1,lam,eA),u)),eA>=1?fg:hcol(HU[0]),1,5.6*K.k+1.5,bgc);
    }
    // veredicto
    if(T>2.8){ const k=clampN((T-2.8)/0.4,0,1), q=P(res);
      if(inside){ K.ring(q,(10+6*Math.sin(t*5))*K.k,ok,.9*k,3); K.dot(q,5*K.k,ok,k); }
      else { K.cross(q,11*K.k,bad,k*(.7+.3*Math.sin(t*6))); } }
    if(T>5.2) newTrial();
    // el origen: ¿está dentro del conjunto?
    K.origin(O,t);
    if(!sets[set].on([0,0])) K.ring(O,(22+4*Math.sin(t*4))*K.k,bad,.55,2.4,[4,4]);
  });
  build();
})();

/* =====================================================================
   COMBINACIÓN LINEAL: λu + μv recorre todo lo que puede generar
   ===================================================================== */
(function(){
  const K=makeKit(document.getElementById('com-cv')), ctx=K.ctx, bar=makeBar('com-bar');
  const B=6.6; let S=30,R=200,C=[0,0];
  K.onfit=()=>{ R=Math.max(60,Math.min(K.W,K.H)/2-14); C=[K.W/2,K.H/2]; S=R/B; K.k=clampN(S/40,.55,1.25); };
  const P=p=>[C[0]+p[0]*S, C[1]-p[1]*S], unP=(x,y)=>[(x-C[0])/S,(C[1]-y)/S];
  let u=[2.4,0.7], v=[-0.8,2.3], n=2, trail=[], tt=0, drag=null, hov=null;
  function build(){ bar.innerHTML='';
    pill(bar,'•','una flecha',()=>{n=1;trail=[];build();},n===1);
    pill(bar,'••','dos flechas',()=>{n=2;trail=[];build();},n===2);
    pill(bar,'⌫','borrar el rastro',()=>{trail=[];}); }
  function snap(){ // si casi son paralelas, se alinean: así se ve el caso dependiente
    const s=Math.abs(V2.cross(u,v))/(V2.len(u)*V2.len(v));
    if(s<0.1){ const d=V2.dot(u,v)>=0?1:-1, l=V2.len(v), a=Math.atan2(u[1],u[0])+(d>0?0:Math.PI); v=[l*Math.cos(a),l*Math.sin(a)]; } }
  K.cv.addEventListener('pointerdown',e=>{ const p=K.ptr(e);
    for(const [k,w] of [['u',u],['v',v]]) if(Math.hypot(p[0]-P(w)[0],p[1]-P(w)[1])<24*K.k && (k==='u'||n===2)){ drag=k; K.cv.setPointerCapture(e.pointerId); trail=[]; } });
  K.cv.addEventListener('pointermove',e=>{ const p=K.ptr(e);
    if(drag){ let q=unP(p[0],p[1]); const L=V2.len(q); if(L>3.6) q=V2.mul(3.6/L,q); if(L<0.7) q=V2.mul(0.7/(L||1),q);
      if(drag==='u') u=q; else v=q; if(n===2) snap(); trail=[]; return; }
    hov=null; for(const [k,w] of [['u',u],['v',v]]) if(Math.hypot(p[0]-P(w)[0],p[1]-P(w)[1])<24*K.k) hov=k;
    K.cv.style.cursor=hov?'grab':'default'; });
  K.cv.addEventListener('pointerup',()=>{drag=null;});
  K.loop((dt,t)=>{
    K.bg(); K.habitatFuerte(C,R,S);
    if(!drag) tt+=dt;
    const lam=1.8*Math.sin(0.61*tt), mu = n===2 ? 1.8*Math.sin(0.97*tt+1.1) : 0;
    const A=V2.mul(lam,u), Bv=V2.mul(mu,v), w=V2.add(A,Bv), O=P([0,0]), fg=CSSV('--fg'), bgc=CSSV('--bg');
    if(!drag && V2.len(w)<B-0.1) trail.push({p:w,a:0});
    trail.forEach(d=>d.a+=dt/22); trail=trail.filter(d=>d.a<1); if(trail.length>5000) trail.splice(0,trail.length-5000);
    // rastro: lo que la combinación ya ha visitado
    ctx.save(); trail.forEach(d=>{ const q=P(d.p); ctx.globalAlpha=0.55*(1-d.a); ctx.fillStyle=CSSV('--tema');
      ctx.beginPath(); ctx.arc(q[0],q[1],1.9*K.k,0,7); ctx.fill(); }); ctx.restore();
    // u y v
    K.arrow(O,P(u),hcol(HU[0]),.35,6*K.k+1,null); K.ring(P(u),13*K.k,hcol(HU[0]),hov==='u'||drag==='u'?.95:.45,1.6,[3,4]);
    if(n===2){ K.arrow(O,P(v),hcol(HU[1]),.35,6*K.k+1,null); K.ring(P(v),13*K.k,hcol(HU[1]),hov==='v'||drag==='v'?.95:.45,1.6,[3,4]); }
    // la combinación: λu, después μv encadenada, y la flecha resultado
    K.arrow(O,P(A),hcol(HU[0]),1,5*K.k+1.5,bgc);
    if(n===2){ K.arrow(P(A),P(w),hcol(HU[1]),1,5*K.k+1.5,bgc); K.dash(O,P(Bv),hcol(HU[1]),.35,1.6,[3,5]); K.dash(P(Bv),P(w),hcol(HU[0]),.35,1.6,[3,5]); }
    K.arrow(O,P(w),fg,.9,4*K.k+1,bgc); K.dot(P(w),4*K.k,fg,1);
    K.origin(O,t);
  });
  build();
})();

/* =====================================================================
   Motor 3D mínimo (giro con el ratón)
   ===================================================================== */
function make3D(K){
  const V={yaw:0.75,pitch:0.38,S:30,C:[0,0],drag:null,idle:0};
  V.rot=p=>{ const c=Math.cos(V.yaw), s=Math.sin(V.yaw), x=p[0]*c-p[1]*s, y=p[0]*s+p[1]*c, z=p[2];
    const cp=Math.cos(V.pitch), sp=Math.sin(V.pitch); return [x, z*cp - y*sp, y*cp + z*sp]; };
  V.P=p=>{ const r=V.rot(p); return [V.C[0]+r[0]*V.S, V.C[1]-r[1]*V.S]; };
  V.depth=p=>V.rot(p)[2];
  K.cv.addEventListener('pointerdown',e=>{ V.drag=K.ptr(e); K.cv.setPointerCapture(e.pointerId); });
  K.cv.addEventListener('pointermove',e=>{ if(!V.drag) return; const p=K.ptr(e);
    V.yaw-=(p[0]-V.drag[0])*0.008; V.pitch=clampN(V.pitch+(p[1]-V.drag[1])*0.006,-0.2,1.2); V.drag=p; V.idle=0; });
  K.cv.addEventListener('pointerup',()=>{V.drag=null;});
  V.tick=dt=>{ V.idle+=dt; if(!V.drag && V.idle>1.5) V.yaw+=dt*0.16; };
  V.fit=()=>{ V.C=[K.W/2,K.H/2]; V.S=Math.min(K.W,K.H)/14.5; K.k=clampN(V.S/40,.6,1.2); };
  V.cube=(L,alpha,color)=>{ const ctx=K.ctx, c=[-L,L], pts=[];
    for(const x of c) for(const y of c) for(const z of c) pts.push([x,y,z]);
    const pp=pts.map(V.P), faces=[[0,1,3,2],[4,5,7,6],[0,1,5,4],[2,3,7,6],[0,2,6,4],[1,3,7,5]];
    ctx.save(); ctx.fillStyle=CSSV('--tema'); ctx.globalAlpha=0.025;
    faces.forEach(f=>{ ctx.beginPath(); f.forEach((i,k)=>k?ctx.lineTo(pp[i][0],pp[i][1]):ctx.moveTo(pp[i][0],pp[i][1])); ctx.closePath(); ctx.fill(); });
    ctx.strokeStyle=color||'#8ea3bb'; ctx.globalAlpha=0.9; ctx.lineWidth=1.5; ctx.lineJoin='round';
    for(let i=0;i<8;i++) for(let j=i+1;j<8;j++){ const d=[0,1,2].filter(k=>pts[i][k]!==pts[j][k]).length;
      if(d===1){ const a=pp[i], b=pp[j]; ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke(); } }
    ctx.restore(); };
  V.axes=L=>{ const g='#a9b6c6'; [[1,0,0],[0,1,0],[0,0,1]].forEach(e=>{ const a=V.P(V3.mul(-L,e)), b=V.P(V3.mul(L,e));
    K.ctx.save(); K.ctx.strokeStyle=g; K.ctx.globalAlpha=.8; K.ctx.lineWidth=1.2; K.ctx.beginPath(); K.ctx.moveTo(a[0],a[1]); K.ctx.lineTo(b[0],b[1]); K.ctx.stroke(); K.ctx.restore(); }); };
  V.planeBasis=n=>{ const nn=V3.unit(n), a=V3.unit(Math.abs(nn[0])<.9?V3.cross(nn,[1,0,0]):V3.cross(nn,[0,1,0])); return [a,V3.cross(nn,a)]; };
  V.disc=(a,b,r,fill,fa,edge,ea)=>{ // trozo cuadrado del plano generado por a, b
    const ctx=K.ctx, cs=[[1,1],[-1,1],[-1,-1],[1,-1]].map(([i,j])=>V.P(V3.add(V3.mul(i*r,a),V3.mul(j*r,b))));
    ctx.save(); ctx.beginPath(); cs.forEach((q,k)=>k?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])); ctx.closePath();
    ctx.globalAlpha=fa; ctx.fillStyle=fill; ctx.fill();
    if(edge){ ctx.globalAlpha=ea; ctx.strokeStyle=edge; ctx.lineWidth=2; ctx.lineJoin='round'; ctx.stroke(); }
    // retícula tenue sobre la hoja: se ve que es plana
    ctx.globalAlpha=(edge?ea:fa)*0.35; ctx.strokeStyle=edge||fill; ctx.lineWidth=1;
    for(let k=-3;k<=3;k++){ const t=k/4*r;
      let q1=V.P(V3.add(V3.mul(t,a),V3.mul(-r,b))), q2=V.P(V3.add(V3.mul(t,a),V3.mul(r,b)));
      ctx.beginPath(); ctx.moveTo(q1[0],q1[1]); ctx.lineTo(q2[0],q2[1]); ctx.stroke();
      q1=V.P(V3.add(V3.mul(-r,a),V3.mul(t,b))); q2=V.P(V3.add(V3.mul(r,a),V3.mul(t,b)));
      ctx.beginPath(); ctx.moveTo(q1[0],q1[1]); ctx.lineTo(q2[0],q2[1]); ctx.stroke(); }
    ctx.restore(); };
  V.line=(d,L,color,alpha)=>{ const ctx=K.ctx, u=V3.unit(d), a=V.P(V3.mul(-L,u)), b=V.P(V3.mul(L,u));
    ctx.save(); ctx.lineCap='round'; ctx.strokeStyle=hexA(color,.16*alpha); ctx.lineWidth=16*K.k; ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
    ctx.strokeStyle=hexA(color,.85*alpha); ctx.lineWidth=2.6*K.k; ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke(); ctx.restore(); };
  V.solidCube=(L,alpha)=>{ // el espacio entero, encendido
    const gold=CSSV('--gold'), ctx=K.ctx, c=[-L,L], pts=[]; for(const x of c) for(const y of c) for(const z of c) pts.push(V.P([x,y,z]));
    const faces=[[0,1,3,2],[4,5,7,6],[0,1,5,4],[2,3,7,6],[0,2,6,4],[1,3,7,5]];
    ctx.save(); faces.forEach(f=>{ ctx.beginPath(); f.forEach((i,k)=>k?ctx.lineTo(pts[i][0],pts[i][1]):ctx.moveTo(pts[i][0],pts[i][1])); ctx.closePath();
      ctx.globalAlpha=.06*alpha; ctx.fillStyle=gold; ctx.fill(); ctx.globalAlpha=.55*alpha; ctx.strokeStyle=gold; ctx.lineWidth=1.6; ctx.stroke(); }); ctx.restore(); };
  return V;
}

/* =====================================================================
   DIMENSIÓN: ⟨u⟩ recta, ⟨u,v⟩ plano, ⟨u,v,w⟩ espacio
   ===================================================================== */
(function(){
  const K=makeKit(document.getElementById('dim-cv')), bar=makeBar('dim-bar'), V=make3D(K);
  K.onfit=V.fit;
  const u=[2.8,0.4,0.6], v=[-0.5,2.7,0.5], w=[0.5,0.4,2.9], d=V3.add(V3.mul(0.65,u),V3.mul(0.7,v));
  let mode=1, grow=0, dust=[], spawn=0;
  function setMode(m){ mode=m; grow=0; dust=[]; build(); }
  function build(){ bar.innerHTML='';
    pill(bar,'•','una flecha: una recta',()=>setMode(1),mode===1);
    pill(bar,'••','dos flechas: un plano',()=>setMode(2),mode===2);
    pill(bar,'•••','tres flechas: todo el espacio',()=>setMode(3),mode===3);
    const s=document.createElement('span'); s.style.width='18px'; bar.appendChild(s);
    pill(bar,'•• + dependiente','una tercera flecha dentro del plano no añade nada',()=>setMode(4),mode===4); }
  const vecs=()=> mode===1?[u]: mode===2?[u,v]: mode===3?[u,v,w]:[u,v,d];
  K.loop((dt,t)=>{
    V.tick(dt); K.bg(); grow=Math.min(1,grow+dt/1.2); const g=easeN(grow), gold=CSSV('--gold'), bgc=CSSV('--bg');
    V.cube(4.2,.55); V.axes(4.2);
    const rk = mode===1?1: mode===3?3:2;
    if(rk===1) V.line(u,4.6*g+0.01,gold,1);
    if(rk===2){ const [a,b]=V.planeBasis(V3.cross(u,v)); V.disc(a,b,3.6*g,gold,.16,gold,.75); }
    if(rk===3) V.solidCube(4.2*g+0.01,1);
    // población: combinaciones al azar que caen dentro de lo generado
    spawn-=dt; if(spawn<=0){ spawn=0.08;
      for(let k=0;k<6;k++){ const vs=vecs(); let p=[0,0,0]; vs.forEach(x=>{p=V3.add(p,V3.mul(randN(-1.4,1.4),x));});
        if(Math.max(Math.abs(p[0]),Math.abs(p[1]),Math.abs(p[2]))<4.1){ dust.push({p,a:0}); break; } } }
    dust.forEach(q=>q.a+=dt/3); dust=dust.filter(q=>q.a<1);
    dust.forEach(q=>K.dot(V.P(q.p),2.6*K.k,CSSV('--tema'),Math.min(1,q.a*8)*(1-q.a)*.9));
    const O=V.P([0,0,0]);
    vecs().forEach((x,i)=>{ const dep=(mode===4&&i===2);
      K.arrow(O,V.P(x),hcol(dep?HU[3]:HU[i]),1,5*K.k+1.5,bgc);
      if(dep){ K.dash(O,V.P(V3.mul(0.65,u)),hcol(HU[0]),.6,2,[4,5]); K.dash(V.P(V3.mul(0.65,u)),V.P(x),hcol(HU[1]),.6,2,[4,5]); } });
    K.origin(O,t);
  });
  build();
})();

/* =====================================================================
   ECUACIONES: cada ecuación independiente quita una dimensión
   ===================================================================== */
(function(){
  const K=makeKit(document.getElementById('ecu-cv')), bar=makeBar('ecu-bar'), V=make3D(K);
  K.onfit=V.fit;
  const N=[[0.35,-0.45,1],[1,0.55,0.3],[-0.6,1,0.45]], HE=[22,205,300];
  let eqs=[], trans=1, dust=[], spawn=0, pulse=0;
  function rank(ns){ if(!ns.length) return 0; const ind=[ns[0]];
    for(let i=1;i<ns.length;i++){ const c=ind.length===1?V3.len(V3.cross(ind[0],ns[i]))/(V3.len(ind[0])*V3.len(ns[i])):
      Math.abs(V3.dot(V3.cross(ind[0],ind[1]),ns[i]))/(V3.len(V3.cross(ind[0],ind[1]))*V3.len(ns[i])); if(c>1e-3) ind.push(ns[i]); }
    return ind; }
  function addEq(dep){
    if(eqs.length>=4) return;
    let n,h;
    if(!dep){ const used=eqs.filter(e=>!e.dep).length; if(used>=3) return; n=N[used]; h=HE[used]; }
    else { if(!eqs.length) return; const ind=rank(eqs.map(e=>e.n)); n = ind.length>=2 ? V3.add(ind[0],ind[1]) : V3.mul(-1.4,ind[0]); h=140; }
    eqs.push({n,h,dep,t:0}); trans=0; pulse=dep?1:0; dust=[]; }
  function build(){ bar.innerHTML='';
    pill(bar,'+ ecuación','',()=>addEq(false));
    pill(bar,'+ ecuación dependiente','combinación de las anteriores',()=>addEq(true));
    pill(bar,'⟲','empezar de nuevo',()=>{eqs=[];trans=0;dust=[];}); }
  K.loop((dt,t)=>{
    V.tick(dt); K.bg(); trans=Math.min(1,trans+dt/1.2); pulse=Math.max(0,pulse-dt/1.6);
    const gold=CSSV('--gold'), g=easeN(trans);
    V.cube(4.2,.55); V.axes(4.2);
    eqs.forEach(e=>{ e.t=Math.min(1,e.t+dt/0.8); const [a,b]=V.planeBasis(e.n); V.disc(a,b,3.6*easeN(e.t),hcol(e.h),.06,hcol(e.h),.5); });
    const ind=rank(eqs.map(e=>e.n)), r=ind.length;
    // el conjunto de soluciones, en dorado
    let pick=null;
    if(r===0){ V.solidCube(4.2,g); pick=()=>[randN(-4,4),randN(-4,4),randN(-4,4)]; }
    if(r===1){ const [a,b]=V.planeBasis(ind[0]); V.disc(a,b,3.6,gold,.2*g,gold,.85*g); pick=()=>V3.add(V3.mul(randN(-3.6,3.6),a),V3.mul(randN(-3.6,3.6),b)); }
    if(r===2){ const dl=V3.cross(ind[0],ind[1]); V.line(dl,4.8,gold,g); pick=()=>V3.mul(randN(-4.5,4.5),V3.unit(dl)); }
    if(pick){ spawn-=dt; if(spawn<=0){ spawn=0.07; const p=pick(); if(V3.len(p)<4.6) dust.push({p,a:0}); } }
    dust.forEach(q=>q.a+=dt/3); dust=dust.filter(q=>q.a<1);
    dust.forEach(q=>K.dot(V.P(q.p),2.6*K.k,CSSV('--tema'),Math.min(1,q.a*8)*(1-q.a)*.85));
    const O=V.P([0,0,0]);
    if(pulse>0) K.ring(O,(1-pulse)*80*K.k,hcol(140),pulse*.8,3);
    K.origin(O,t);
    if(r===3) K.ring(O,(18+6*Math.sin(t*4))*K.k,gold,.8,3);
  });
  build();
})();

/* =====================================================================
   CAMBIO DE BASE: el mismo vector, visto desde dos bases
   ===================================================================== */
(function(){
  const K=makeKit(document.getElementById('cb-cv')), ctx=K.ctx, bar=makeBar('cb-bar');
  const EB=[[2.3,0.5],[-0.7,1.9]], FB=[[2.0,-0.3],[0.6,2.0]], HE=[22,205], HF=[140,300];
  let v=[3.1,2.3], view=0, s=0, Vr={x:0,y:0,w:0,h:0}, S=30, CV=[0,0], cols=[], drag=false;
  K.onfit=()=>{ const pw=Math.max(170,Math.min(260,K.W*0.24)); Vr={x:12,y:12,w:K.W-24-pw-16,h:K.H-24};
    S=Math.min(Vr.w/11,Vr.h/8.6); K.k=clampN(S/38,.6,1.2); CV=[Vr.x+Vr.w/2,Vr.y+Vr.h/2];
    const cs=clampN(Math.min(pw/4.6,K.H/5.4),30,64), cx0=Vr.x+Vr.w+16+pw/2;
    cols=[{cx:cx0-cs*1.15,cy:K.H/2,cs},{cx:cx0+cs*1.15,cy:K.H/2,cs}]; };
  const P=p=>[CV[0]+p[0]*S, CV[1]-p[1]*S], unP=(x,y)=>[(x-CV[0])/S,(CV[1]-y)/S];
  const solve=(a,b,p)=>{ const d=V2.cross(a,b); return [V2.cross(p,b)/d, V2.cross(a,p)/d]; };
  const fmt=x=>(Math.abs(x)<0.005?0:x).toFixed(2).replace('-','−');
  function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  function lattice(b1,b2,h1,h2,alpha){
    ctx.save(); rr(Vr.x,Vr.y,Vr.w,Vr.h,18*K.k); ctx.clip();
    [[b1,b2,h1],[b2,b1,h2]].forEach(([base,dir,h])=>{ const dn=V2.mul(1/V2.len(dir),dir);
      for(let k=-14;k<=14;k++){ const p0=V2.mul(k,base), a=P(V2.add(p0,V2.mul(-30,dn))), b=P(V2.add(p0,V2.mul(30,dn)));
        ctx.globalAlpha=alpha*(k===0?.5:.2); ctx.strokeStyle=hcol(h); ctx.lineWidth=k===0?2:1; ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke(); } });
    ctx.restore(); }
  function miniArrow(c,dir,L,color,lw){ const l=Math.hypot(dir[0],dir[1])||1, d=[dir[0]/l,-dir[1]/l];
    K.arrow([c[0]-d[0]*L/2,c[1]-d[1]*L/2],[c[0]+d[0]*L/2,c[1]+d[1]*L/2],color,1,lw,null); }
  function column(c,co,base,hues,active,t){
    const {cx,cy,cs}=c, fg=CSSV('--fg'), left=cx-cs*.55, right=cx+cs*.55, top=cy-cs, bot=cy+cs;
    if(active){ ctx.save(); ctx.globalAlpha=.10+.04*Math.sin(t*4); ctx.fillStyle=CSSV('--tema'); rr(left-4,top-6,right-left+8,2*cs+12,9*K.k); ctx.fill(); ctx.restore(); }
    ctx.save(); ctx.strokeStyle=fg; ctx.globalAlpha=active?.9:.35; ctx.lineWidth=3*K.k; ctx.lineCap='round'; const bw=9*K.k, pad=6*K.k;
    ctx.beginPath(); ctx.moveTo(left-pad+bw,top-pad); ctx.lineTo(left-pad,top-pad); ctx.lineTo(left-pad,bot+pad); ctx.lineTo(left-pad+bw,bot+pad); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(right+pad-bw,top-pad); ctx.lineTo(right+pad,top-pad); ctx.lineTo(right+pad,bot+pad); ctx.lineTo(right+pad-bw,bot+pad); ctx.stroke(); ctx.restore();
    ctx.save(); ctx.globalAlpha=active?1:.4; miniArrow([cx,top-0.6*cs],v,cs*.5,fg,3.2*K.k);
    for(let i=0;i<2;i++){ const yy=top+(i+.5)*cs; miniArrow([left-0.55*cs,yy],base[i],cs*.45,hcol(hues[i]),3*K.k);
      ctx.font=`600 ${clampN(cs*.32,12,22)}px "Iowan Old Style",Palatino,Georgia,serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillStyle=hcol(hues[i],45); ctx.fillText(fmt(co[i]),cx,yy); }
    ctx.restore(); }
  function build(){ bar.innerHTML='';
    pill(bar,'⇄ Cambiar de punto de vista','',()=>{view=1-view;}); }
  K.cv.addEventListener('pointerdown',e=>{ const p=K.ptr(e); if(p[0]>Vr.x&&p[0]<Vr.x+Vr.w&&p[1]>Vr.y&&p[1]<Vr.y+Vr.h){ drag=true; K.cv.setPointerCapture(e.pointerId); move(p);} });
  function move(p){ const q=unP(p[0],p[1]); v=[clampN(q[0],-4.6,4.6),clampN(q[1],-3.6,3.6)]; }
  K.cv.addEventListener('pointermove',e=>{ if(drag) move(K.ptr(e)); });
  K.cv.addEventListener('pointerup',()=>{drag=false;});
  K.loop((dt,t)=>{
    K.bg(); const gold=CSSV('--gold'), fg=CSSV('--fg'), bgc=CSSV('--bg');
    s+=(view-s)*Math.min(1,dt*3.2); const e=easeN(clampN(s,0,1));
    ctx.save(); rr(Vr.x,Vr.y,Vr.w,Vr.h,18*K.k); ctx.fillStyle=hexA(gold,.05); ctx.fill(); ctx.strokeStyle=CSSV('--habitat'); ctx.setLineDash([2,6]); ctx.stroke(); ctx.restore();
    // la retícula se transforma: el punto de vista cambia, el vector no
    lattice(EB[0],EB[1],HE[0],HE[1],1-e); lattice(FB[0],FB[1],HF[0],HF[1],e);
    const base = e<.5 ? EB : FB, hues = e<.5 ? HE : HF, al=Math.abs(e-.5)*2;
    const co=solve(base[0],base[1],v), A=V2.mul(co[0],base[0]), Bv=V2.mul(co[1],base[1]), O=P([0,0]);
    ctx.save(); rr(Vr.x,Vr.y,Vr.w,Vr.h,18*K.k); ctx.clip();
    K.dash(O,P(A),hcol(hues[0]),.7*al,2,[4,5]); K.dash(P(A),P(v),hcol(hues[1]),.7*al,2,[4,5]);
    K.dash(O,P(Bv),hcol(hues[1]),.4*al,1.6,[3,5]); K.dash(P(Bv),P(v),hcol(hues[0]),.4*al,1.6,[3,5]);
    [[EB,HE,1-e],[FB,HF,e]].forEach(([b,h,a])=>{ for(let i=0;i<2;i++) K.arrow(O,P(b[i]),hcol(h[i]),Math.max(.12,a),6*K.k+1,null); });
    K.arrow(O,P(v),fg,1,6*K.k+1.5,bgc); K.ring(P(v),(12+2*Math.sin(t*4))*K.k,fg,.6,2);
    ctx.restore();
    K.origin(O,t);
    column(cols[0],solve(EB[0],EB[1],v),EB,HE,view===0,t);
    column(cols[1],solve(FB[0],FB[1],v),FB,HF,view===1,t);
  });
  build();
})();

</script>
<script>
/* ---------- pestañas ---------- */
const tabBtns=[...document.querySelectorAll('#tabs button')];
function show(btn){
  tabBtns.forEach(b=>b.classList.toggle('on',b===btn));
  const m=btn.dataset.mod, s=btn.dataset.sub;
  document.querySelectorAll('.stage').forEach(e=>e.classList.toggle('on',e.id==='st-'+m));
  document.querySelectorAll('.bar').forEach(e=>e.classList.toggle('on',e.id==='bar-'+m));
  if(m==='dep' && s) window.DEP_setTab(s);
  window.dispatchEvent(new Event('resize'));
}
tabBtns.forEach(b=>b.onclick=()=>show(b));
show(tabBtns[0]);
</script>
